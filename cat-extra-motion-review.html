<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追加の3動作</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e4;color:#424c3e;font:16px/1.6 system-ui}header,main{max-width:1200px;margin:auto;padding:18px}h1{font-size:24px}nav{display:flex;flex-wrap:wrap;gap:12px}button,a{font:inherit;background:#617a53;color:white;border:0;border-radius:24px;padding:10px 18px;text-decoration:none}main{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{background:#fffaf0;border:1px solid #d5d5c0;border-radius:20px;overflow:hidden}iframe{width:100%;height:340px;border:0;display:block;background:#e8e3cd}section{padding:16px;min-height:160px}h2{font-size:19px;margin:0}p{margin:8px 0}.blind section{visibility:hidden}@media(max-width:700px){main{grid-template-columns:1fr}} </style>
<header><h1>追加の3動作</h1><p>無音で比較する動作試作。本編の自動行動への割り当てはまだ行っていません。</p><nav><button id="pause">一時停止 →</button><button id="restart">最初から →</button><button id="random">柄を変える →</button><button id="labels">説明を隠す／戻す →</button><a href="cat-reaction-review.html">5段階へ戻る →</a></nav></header><main></main>
<script>
const motions=[['sniff','匂いを確かめる','鼻先を近づけ、小さく嗅いで確かめる。'],['settle','静かに安心する','肩の力を抜き、体を少し沈めて目を細める。'],['disengage','接触を外して離れる','顔をそらし、足を運んで距離を取る。']];let stopped=matchMedia('(prefers-reduced-motion:reduce)').matches,coatSeed=2718;
function send(extra={}){document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage({type:'cat-gallery',paused:stopped,coatSeed,...extra},'*'));}
for(const [id,label,text]of motions){const card=document.createElement('article');card.innerHTML=`<iframe title="${label}" src="cat-life-sample.html?embed=1&pose=${id}"></iframe><section><h2>${label}</h2><p>${text}</p></section>`;document.querySelector('main').append(card);card.querySelector('iframe').onload=()=>send();}
function label(){document.querySelector('#pause').textContent=stopped?'再生 →':'一時停止 →';}label();document.querySelector('#pause').onclick=()=>{stopped=!stopped;send();label();};document.querySelector('#restart').onclick=()=>send({restart:true});document.querySelector('#random').onclick=()=>{coatSeed=crypto.getRandomValues(new Uint32Array(1))[0];send({restart:true});};document.querySelector('#labels').onclick=()=>document.body.classList.toggle('blind');
</script></html>
