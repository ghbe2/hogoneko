<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心の手ごたえ｜3案比較</title><style>
*{box-sizing:border-box}body{margin:0;background:#e5ddd0;color:#514638;font:14px system-ui}main{max-width:780px;margin:auto;padding:12px}a{color:inherit}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:10px 0}button,select{font:inherit;color:inherit;background:#fff9ed;border:1px solid #c9b594;border-radius:12px;padding:10px;min-height:44px}button[aria-pressed=true]{background:#685444;color:#fff}nav{display:flex;gap:6px;margin:10px 0}nav button{flex:1} .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.description{min-height:44px;line-height:1.6;margin:8px 0}.phone{width:min(100%,375px);height:480px;background:#f3e8cc;border-radius:24px;margin:auto;position:relative;overflow:hidden;display:flex;flex-direction:column}.top{height:44px;padding:12px 18px;background:#fff8e9;display:flex;justify-content:space-between}.room{position:relative;flex:1;background:linear-gradient(#efe4c9 55%,#c9a77e 55%)}.window{position:absolute;width:95px;height:100px;border:7px solid #ad815b;top:22px;left:30px;background:linear-gradient(#c1d8d5 65%,#8faa80 65%)}.window:after{content:'';position:absolute;left:43%;width:5px;height:100%;background:#faf0d9}.cat{position:absolute;width:165px;height:210px;left:calc(50% - 82px);bottom:35px;overflow:visible}.toy{position:absolute;left:47%;bottom:25px;font-size:30px;touch-action:none}.hud{position:absolute;top:136px;left:14px;right:14px;display:flex;align-items:center;justify-content:center;height:74px;pointer-events:none}.footer{padding:10px;background:#fff7e6;text-align:center}.play{width:100%;background:#d17e8d;color:white;border:0;touch-action:none;user-select:none}.hint{text-align:center;font-size:12px;margin:7px 0;color:#796651}.ring{width:78px;height:78px;border-radius:50%;background:conic-gradient(#ce7189 var(--p),#dccdb7 0);display:grid;place-items:center}.ring span{width:62px;height:62px;border-radius:50%;background:#fff6e2;display:grid;place-items:center;font-size:28px;color:#cc7188}.beads{display:flex;gap:5px;background:#fff6e5;padding:14px 10px;border-radius:22px}.beads i{font-style:normal;font-size:23px;color:#ddcbbd;transition:color .2s,transform .2s}.beads i.on{color:#ce7189;transform:scale(1.13)}.ribbon{width:100%;background:#fff5e2;padding:12px;border-radius:16px}.track{height:24px;border-radius:12px;background:#dfd1b9;position:relative;overflow:hidden}.fill{height:100%;background:#cc7189;width:0;transition:width .1s}.start{position:absolute;left:0;top:0;height:24px;background:#b9957b}.ticks{position:absolute;inset:0;display:flex;justify-content:space-evenly}.ticks i{width:2px;background:#fff6;display:block}.ledger{position:absolute;top:8px;right:12px;font-size:20px;color:#ce7189;max-width:160px;text-align:right}.burst{position:absolute;left:48%;top:43%;font-size:35px;color:#c85d7a;animation:fly 1s forwards;pointer-events:none}@keyframes fly{to{transform:translate(70px,-130px) scale(.5);opacity:0}}.flash{animation:pulse .5s}@keyframes pulse{50%{transform:scale(1.15)}}.state{height:20px;font-size:12px;text-align:center}.note{font-size:12px;line-height:1.6;color:#786754;margin:12px 0}.footer .play:active{background:#ad5e72}@media(max-height:720px){.phone{height:390px}.hud{top:110px}.cat{height:175px;bottom:15px}.window{height:80px}.toy{bottom:12px}}
.hud{top:12px;z-index:2}.ledger{top:94px;z-index:3}.cat{bottom:0;height:190px}.window{opacity:.5}main{height:100dvh;display:flex;flex-direction:column}.phone{flex:1;min-height:250px;max-height:480px;flex-shrink:0}.note{margin:4px 0}.description{margin:4px 0}nav{margin:4px 0}.controls{margin:8px 0}.beads{gap:4px}.beads i{font-size:20px}@media(max-height:600px){.phone{min-height:220px}.top,.hint,.note{display:none}.cat{height:125px;left:calc(50% - 40px);width:110px;bottom:0}.hud{height:54px;top:5px}.ring{width:54px;height:54px}.ring span{width:42px;height:42px;font-size:22px}.footer{padding:5px}.state{height:16px}.description{font-size:12px;min-height:38px}.ledger{top:66px}.window{height:60px;width:60px}.controls{gap:4px}}
</style></head><body><main><header><h1>遊びの手ごたえ・3案</h1><a href="check.html" target="_top">一覧へ</a></header><nav aria-label="UI案"><button data-mode="ring" aria-pressed="true">輪が満ちる</button><button data-mode="beads" aria-pressed="false">粒が集まる</button><button data-mode="ribbon" aria-pressed="false">伸びが残る</button></nav><p class="description" id="description"></p><div class="phone"><div class="top"><span>おうち</span><span>遊びのUI試作</span></div><div class="room"><div class="window"></div><div class="ledger" aria-label="今回たまった小ハート"></div><div class="hud"></div><svg class="cat" viewBox="200 55 320 320" aria-label="玩具と遊ぶネコ"></svg><span class="toy">🪶</span></div><div class="footer"><div class="state" aria-live="polite"></div><button class="play">押している間、玩具を振る</button><div class="hint">離すと休憩・続きから遊べます</div></div></div><div class="controls"><label>相性 <select id="affinity"><option value="4">超好き</option><option value="2" selected>好き</option><option value="1">ふつう</option><option value="0">嫌い</option><option value="-1">超嫌い</option></select></label><button id="auto" aria-pressed="false">自動で比較</button><button id="reset">最初から</button></div><p class="note">比較専用・セーブには影響しません。同じ速度で表示方式だけ切り替わります。好きは10秒、ふつうは20秒で小ハート1つ分。小ハート10個が手帳の大ハート1個分。長押しは比較用の操作です。</p></main><script src="assets/cat-svg.js"></script><script>
const $=s=>document.querySelector(s),texts={ring:'輪が満ちたら、ぽんっと小ハートになる。次の達成までの近さを、ひと目で。',beads:'ネコからもらった粒を、ひと粒ずつ集める。10粒そろうと小ハートになって残る。',ribbon:'遊ぶ前の位置を残して、伸びたぶんを積み重ねる。中断しても「ここまで育てた」が見える。'};
let mode='ring',value=0,held=false,auto=false,last=performance.now(),pulse=-1;const svg=$('.cat'),rig=CatSVG.buildCat(svg,'study',{...CatSVG.defaults},375,1.25);svg.querySelector('.floor')?.remove();
function draw(){const fraction=(Math.max(0,value)%1)*100;$('.description').textContent=texts[mode];$('.hud').innerHTML=mode==='ring'?`<div class="ring" style="--p:${fraction}%"><span>♥</span></div>`:mode==='beads'?`<div class="beads">${Array.from({length:10},(_,i)=>`<i class="${i<Math.floor(fraction/10)?'on':''}">●</i>`).join('')}</div>`:`<div class="ribbon"><div class="track"><div class="fill" style="width:${30+value*6}%"></div><div class="start" style="width:30%"></div><div class="ticks">${'<i></i>'.repeat(9)}</div></div></div>`;$('.ledger').textContent=value<0?'♡': '♥'.repeat(Math.floor(value));}
function reset(){value=0;pulse=-1;$('.state').textContent='';draw();}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();});
const play=$('.play');play.onpointerdown=e=>{held=true;play.setPointerCapture(e.pointerId)};play.onpointerup=play.onpointercancel=()=>held=false;play.onkeydown=e=>{if(e.code==='Space'||e.code==='Enter'){held=true;e.preventDefault()}};play.onkeyup=()=>held=false;window.addEventListener('blur',()=>held=false);document.addEventListener('visibilitychange',()=>{held=false;last=performance.now()});$('#auto').onclick=()=>{auto=!auto;$('#auto').setAttribute('aria-pressed',auto);$('#auto').textContent=auto?'比較を止める':'自動で比較'};$('#reset').onclick=reset;$('#affinity').onchange=reset;
function tick(now){const dt=Math.min(100,now-last)/1000;last=now;const active=(held||auto)&&!document.hidden,affinity=Number($('#affinity').value);if(active&&value<10){value=Math.max(-2,Math.min(10,value+dt*affinity/20));const step=Math.floor(Math.max(0,value)*10);if(step!==pulse){pulse=step;if(step>0&&step%10===0){const h=document.createElement('span');h.className='burst';h.textContent='♥';$('.room').appendChild(h);setTimeout(()=>h.remove(),1000);}}draw();}$('.state').textContent=value>=10?'大ハートひとつ分、育った':active?(affinity<0?'嫌がって身を引く':affinity===0?'距離を取っている':''):'';$('.toy').style.transform=`translateX(${active?Math.sin(now/170)*45:0}px) rotate(${active?Math.sin(now/170)*20:0}deg)`;const pose=active&&affinity>0?'punch':'sit';CatSVG.applyPose(rig,CatSVG.poseModel(pose,now/1000),now/1000,pose);requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);
</script></body></html>
