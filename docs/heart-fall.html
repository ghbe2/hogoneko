    const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    const sessionKey='hogoneko-preview-key:'+payload.salt;
    let gateOpening=false;
    async function unlock(key){
      const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));
      document.open();document.write(new TextDecoder().decode(data));document.close();

      event.preventDefault();
      if(gateOpening)return;
      gateOpening=true;
      const button=document.querySelector('#enter'), input=document.querySelector('#password'), error=document.querySelector('#error');
      button.disabled=true;button.textContent='開いています…';error.textContent='';
      if(!globalThis.crypto?.subtle){error.textContent='HTTPSのURLを、最新のブラウザで開いてください。';button.disabled=false;button.textContent='プレビューを開く';return;}
      try {
