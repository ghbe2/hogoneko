<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#efe1d6">
  <title>つぐねこ｜アルファテスト用</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#efe1d6;color:#75594f;font-family:"Yu Gothic",Meiryo,sans-serif}
    body{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 32%,#fffaf4,transparent 75%),#efe1d6}
    main{width:min(100%,340px);padding:34px 24px;text-align:center;background:#fffaf4e8;border:1px solid #ead4cc;border-radius:28px;box-shadow:0 18px 45px #60472d10}
    h1{font-size:32px;letter-spacing:.13em;margin:12px 0}p{font-size:12px;line-height:1.9;color:#998078}
    label{display:block;text-align:left;font-size:11px;margin:26px 0 8px}input,button{width:100%;font:inherit;border-radius:12px;min-height:48px;padding:12px}
    input{font-size:16px;border:1px solid #dfc8c0;background:#fff;color:#473b3a}input:focus{outline:2px solid #9d5341;outline-offset:2px}
    button{border:0;background:#9d5341;color:white;font-weight:bold;margin-top:16px;box-shadow:0 4px 0 #743e31;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    #error{min-height:36px;margin:14px 0 0;color:#b14c65;font-size:11px}small{font-size:9px;color:#ad958c}
  </style>
</head>
<body>
  <main>
    <h1>つぐねこ</h1>
    <p>アルファテスト用<br>お知らせしたパスワードでお入りください。</p>
    <form id="entry">
      <label for="password">閲覧用パスワード</label>
      <input id="password" type="password" required autocomplete="current-password" autocapitalize="none" spellcheck="false" aria-describedby="error">
      <button id="enter" type="submit">ゲームをはじめる</button>
      <p id="error" role="status" aria-live="polite"></p>
    </form>
    <small>開発中のアルファテスト版です</small>
  </main>
  <script>
    const payload = {"salt":"qKgdtfsgl7d5J5uIzbo9Xg==","iv":"I3QxaehedN2JTFr5","data":"b7WgHeZnlYjXbgl8JtLRymufjPHBtQ0aAKp/XZx5VvwlnQxcoVnylbQGYAp596TLdlwFzIJYG4PwZHsQugch3L7nJgRPeHKqSBMEoWGi8brREzph5zL/XcsXE/PaAzZVa2Jse9Q+iP65p1ba6oKv0ZdMgSuIUoLZN7v7UJWYvJl9d3CwZBurVm9SxKy0w8dXsM8HA9q1D+W94ese2nVgF6eCcyOXrkxyIcqQgbeDU7hKBZJI+n9lDLdRVHlJh/v6KI4PRb0EeQp/AyO1vC4PQ2t71yCQ64cesJ0ddwSt8sjD3MEqM6PO0FjqU9X1QTgskRptVcxeYL66lBfXgukn8ryGjSeFNg+REjBxypEMQZKgbjfKBRP3IrGbY7sdU+ktRIXMLVm0PC/Kwa+GvKBvHwMh831qxEGb2zuLeCDNeKZzeSwNhRf+Bqdo8w7KQie5euT1sIXzPEb3LqjwJNJRyvmHnMIVqVIujPgYKCRpj5Gr8LShLmGsZOczVXvF24fsiaYhdLv1bKdHn3/k37FO26HeMMeG0Nx+35LGRwoVPaEnP/BCazw522x8b2JVn0UJEAzSqeXxn6JoLAH+FJk3Qe9mEJ4sJCfEsQaYeHvmj41etsepFGyPtwCIcUAMAdvmenySpRFrHTX7c2CtrTIkro4sqycQ4m8r0rM2ZbPy64uoyYLxg2FHfWZqw666iEb3H0SZhxU1noI0L+ovugw/K3vcbabS6qjHtgBhP60oPF1yTbN5QOVt/PMPAX/jnJGsa8zRgFgji0zImehLroimEy4P45yJBGtbvnBmbKhERLFn42UcpUODhpQsmBRbOsABa0LxAHkPiHsFKndVWdccr+/3WNU11GoLi5OnqO4zFI15UBECGSZKUdW2tny0VAWFCb6wYZlxZWjVNnk7q3Em0Cyrg0QFCx2xOwdvO0u7BBCHkqvOZlngsyUG2yg3ZU0pakFUwPgc0WlUqXfMQGlvYChGlfSXkwkmUTPgDYWwibt6geEHPdfY4IbMD4P7wAlXNHJLPN3GKjRTqIqzRFs255bST3MbFJa7iKsiz5WC9sHpGEZQ20Kh7Hy4fuYOL4CNSX0JmwH57TCOYbmpOZiXkytWmbQgDkvjW6A6JLXQO9t+4+jMDXEvKAzEnsn50n1QHfwxp289jsVyjFVJu94C6XfqbDDjs2/zcByIxjWetQ5kblNjBni1/YaLEEqBhbcTgM6PnDxr/x/KF816jdd6r1zNJ8/JjNFAPygv0cZocxk09uny8aOmp4gFcNi6xbrxHYnZ+YzvfJyfpynIAgnYYOxIE3qnI3icc1weOGV7LyJIlxd85/LV4LVbVGyPqPqYMKL0r/rSTZ0N7KFUEcwC2LNBeG49tC21RvwnxKLrljbV48ugJhpufFR4zhxyWBpHfiFyhjosmdAEt4O5wJY7zBGYebimC4y6WEVFvPVOt8Nd3yZCEPZt21pWYE3opJNzBPqkrapgQTnR+b+s6/ME7Nk+VcW+6yTjHKLJVNGgYTUmhuSaQtzp4IKGwLcVF+UbjXr1SE0lJ77CGiLY3NaNUrKVshAyMEqazWBHxQfYchNqo1e+QKZk3FB1pFujllVFFwipaY/turshYBfkWWtLuB995rfQOI3t0tNOYEkU2lNipJYRY1F7169CrjlHsvrKb3Ny/Wdf6vJK4ZfCrS8qyjXqRNqGFYjeFlJQFySKu/TUfQIX5NgSSrD7kd7LiE9DCUrG+EPXKUhlXqLzsNVcUKZqQa1+01+BGRndEJsRF7ncEyRWrR70ywRiiW7m3eR5sGVsjGPaLnTh3xtosJgrLcsM5GxLuMNWCs4NJOVPOegSQQCSHQzC6GLvjeZNCjY3R+ShxL5avDv4wpPVKjVMmOY941Pm8FLbDMaNJL1XjqGAq6i+7v+Qsdnqx     const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    const sessionKey='hogoneko-preview-key:'+payload.salt;
    let gateOpening=false;
    async function unlock(key){
      const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));
      document.open();document.write(new TextDecoder().decode(data));document.close();
    }
    // A tab-scoped decryption key, never the password. New builds use a new salt.
    const cachedKey=sessionStorage.getItem(sessionKey);
    if(cachedKey){gateOpening=true;document.querySelector('#enter').disabled=true;
      window.addEventListener('load',async()=>{try{const key=await crypto.subtle.importKey('raw',bytes(cachedKey),'AES-GCM',false,['decrypt']);await unlock(key);}catch{sessionStorage.removeItem(sessionKey);gateOpening=false;document.querySelector('#enter').disabled=false;}},{once:true});
    }
    document.querySelector('#entry').addEventListener('submit',async event => {
      event.preventDefault();
      if(gateOpening)return;
      gateOpening=true;
      const button=document.querySelector('#enter'), input=document.querySelector('#password'), error=document.querySelector('#error');
      button.disabled=true;button.textContent='開いています…';error.textContent='';
      if(!globalThis.crypto?.subtle){error.textContent='HTTPSのURLを、最新のブラウザで開いてください。';button.disabled=false;button.textContent='ゲームをはじめる';return;}
      try {
        const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);
        const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},true,['decrypt']);
        const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));
        input.value='';
        try{sessionStorage.setItem(sessionKey,btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key)))));}catch{}
        document.open();document.write(new TextDecoder().decode(data));document.close();
      }catch{
        gateOpening=false;
        error.textContent='パスワードが違います。もう一度お試しください。';
        button.disabled=false;button.textContent='ゲームをはじめる';input.focus();input.select();
      }
    });
  </script>
</body>
</html>
