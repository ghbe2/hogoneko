<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#efe1d6">
  <title>ホゴネコ｜プレビュー</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#efe1d6;color:#75594f;font-family:"Yu Gothic",Meiryo,sans-serif}
    body{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 32%,#fffaf4,transparent 75%),#efe1d6}
    main{width:min(100%,340px);padding:34px 24px;text-align:center;background:#fffaf4e8;border:1px solid #ead4cc;border-radius:28px;box-shadow:0 18px 45px #60472d10}
    .paw{font-size:36px}h1{font-size:32px;letter-spacing:.13em;margin:12px 0}p{font-size:12px;line-height:1.9;color:#998078}
    label{display:block;text-align:left;font-size:11px;margin:26px 0 8px}input,button{width:100%;font:inherit;border-radius:12px;min-height:48px;padding:12px}
    input{font-size:16px;border:1px solid #dfc8c0;background:#fff;color:#473b3a}input:focus{outline:2px solid #d67d90;outline-offset:2px}
    button{border:0;background:#d47c90;color:white;font-weight:bold;margin-top:16px;box-shadow:0 4px 0 #ae6173;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    #error{min-height:36px;margin:14px 0 0;color:#b14c65;font-size:11px}small{font-size:9px;color:#ad958c}
  </style>
</head>
<body>
  <main>
    <div class="paw" aria-hidden="true">🐾</div><h1>ホゴネコ</h1>
    <p>クライアント向けプレビュー<br>お知らせしたパスワードでお入りください。</p>
    <form id="entry">
      <label for="password">閲覧用パスワード</label>
      <input id="password" type="password" required autocomplete="current-password" autocapitalize="none" spellcheck="false" aria-describedby="error">
      <button id="enter" type="submit">プレビューを開く</button>
      <p id="error" role="status" aria-live="polite"></p>
    </form>
    <small>開発中のモックです</small>
  </main>
  <script>
    const payload = {"salt":"xxur/h2rrXSGpQNvkU7TaQ==","iv":"ZscOac1Ly7JmX0W0","data":"JKYY3l9LOIh6nZdluhj/F3jsD534HxsPckxVQYjZdFghJ0GT0/0nYuvXkE2k59AkaSCc0bkA+SQ/tVNs/qrVa66m4/mErDP+ppViIccBIJZvjDUFm/MNK/tYvl88hcD6uV/4n35wkzVvWUeLnfBnLhw4Lg5tXkdnPr/Cd9T5qFuJZ6sViVT8dLL02Bc8LcN+eneNMiCGQJEzvOsWlxNKmQqFl8JRRjQHpvgI1+4PrWomW1EOby6Ly1tQg8vHPFXGsXgQAy6JcVp9o4tpRm2egqYVoss6lYYkkITRf2fVfutSZKg3WdvvqIM4RD55+zX0JoetXx39GURkmB6z7WbtFRzPDt4mqMtvlXy4sjCznOnCqrCmE9WZ0R6YpeQpEkR7zQjvr6P8qjBEy/OWrjjUdC9lEsl9a0dmhnTy7c5+kmFUHhnP3VXhRx4KENC8+beMqVi0TtusXJBZsguC2sQ/cKabqPgcQgRExkSGbGoaoiz02yCJbmsgJSfHKGAXL9IiG+d+vJLDT9K36kcH2jW7bbQvo8uf917j86dyzSjBid0XeNtkdGioPR0z1VcvvGw/uIayi5aRP0S7DX0d8j355yBHdxehhX5RMrqndrbqTBeRMBC1OPAizTMsV8/WvcxpwtjBvI25e5NXex86oqCWTztGEc5Ck2MQ0gd5enI/e2TieEVpvlqaoDdQ+x7X8wise/D62/iiTjxFuudeYPPPd58FSyAQEQFTrd/ZEJqPqzg1B6CVgMnzz9lVeUcIbtPsN/tW+aZJQzXgT2rv5tZOR2Hm3BUsZF6APtp0Ij7fgKpc9k1x+oD3IoeFIi/nmDRuqTNrrj19/mG53vyx84NrDlFZTj1KoMh26OCBqi8fV53sL6EZSYKTP5f8gKjagjVhrDmlyThC5cuIchcM+fajPg2O6zCjZTFszFdoDGb4O7TQCHLKijfNw/GBFBcSAaZeRqoMhiAFtQyiZG7JGWgC6Fkd7p5ZrRF3blXAMp7yQ3imiB4qZZrkke3E3yjKtT6mmuYKaN2josIPIusNsdw4+d6rVTwPeDMgaJ40yg31E4thVXBdV7gHO1EIcvX3VBLHIjpnwny+CenS8ztiTdmBao/BFwGSbU6L6NIaOEz6pNhBzJZK2SrPnQU6fUKznYpIX13vMQvaf9P3O7H6iPqFPF5o0H9n7pcTugCtz8kGgShE3AkAtFqyQNGOzesGgSv5r5LSxJjH1P38ipynz+rSD71y/GkYB/EJqOlLl2DPM49FaitJyLTz6f/QgM0JFCA6X6skP1lKbRohOwtM91sWfMSzeR0HkKDWV4qAVNsAK5eHf8t78p9KRrIsmYkFN8BQ6b+3ZN5dmPd06kBdEFpU4NXYhny6Nfnwdt2LyOvuJ5CSJolRfaZkeQ5PHfIZ/+wmz48rsU8ibKdrjFJzjhNESx9a7YY8CZiFqNLodlb6PwGaKzmVjX8mpU4bSZx3YywlT5ezIqgB+J5Q6bhRNzMM0ZkOZ0L+ohcQR4jnRKBnpzsYzIFSRjZjo4Ikn8YAfFzwyDC6BvDCYbitUuw99hbqb+i+Y9KvuAVvpQ8vDAULg5DM2S5c6cXyqH20Yh268y/Mzri9hcgiU4luNdElNCTV24JhWwC8B74MPfxK1MLrQ+FMLy16IPeIbEjeuc9XcS3b1pwzcw3mxCB9cOOsCrIQs9FSw1IzPjrvQ3nLzISs4VA/tZREP+JHTm2p7T+29zhPja8SEkXKVY2bSfwDad9iK30fpwn5vrzAcIpIkQtJuwyEBsyaYURcYEeQqng1SEJOrBTnlHtvKfJ4HvDdOBYcE3//35Lnm/yPb1Go8ZxV6/AlDJpLOiUsY5OySq4NnZzYbS5GtIeq4zmHyMBpmqyZSLYsqGC5iktg857eOpAERMO12CSfPTT6MpXxE     const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    const sessionKey='hogoneko-preview-key:'+payload.salt;
    let gateOpening=false;
    async function unlock(key){
      const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));
      document.open();document.write(new TextDecoder().decode(data));document.close();
    }
    // A tab-scoped decryption key, never the password. New builds use a new salt.
    const cachedKey=sessionStorage.getItem(sessionKey);
    if(cachedKey){gateOpening=true;document.querySelector('#enter').disabled=true;
      window.addEventListener('load',async()=>{try{const key=await crypto.subtle.importKey('raw',bytes(cachedKey),'AES-GCM',false,['decrypt']);await unlock(key);}catch{sessionStorage.removeItem(sessionKey);gateOpening=false;document.querySelector('#enter').disabled=false;}},{once:true});
    }
    document.querySelector('#entry').addEventListener('submit',async event => {
      event.preventDefault();
      if(gateOpening)return;
      gateOpening=true;
      const button=document.querySelector('#enter'), input=document.querySelector('#password'), error=document.querySelector('#error');
      button.disabled=true;button.textContent='開いています…';error.textContent='';
      if(!globalThis.crypto?.subtle){error.textContent='HTTPSのURLを、最新のブラウザで開いてください。';button.disabled=false;button.textContent='プレビューを開く';return;}
      try {
        const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);
        const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},true,['decrypt']);
        const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));
        input.value='';
        try{sessionStorage.setItem(sessionKey,btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key)))));}catch{}
        document.open();document.write(new TextDecoder().decode(data));document.close();
      }catch{
        gateOpening=false;
        error.textContent='パスワードが違います。もう一度お試しください。';
        button.disabled=false;button.textContent='プレビューを開く';input.focus();input.select();
      }
    });
  </script>
</body>
</html>
