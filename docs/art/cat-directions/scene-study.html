    const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    const sessionKey='hogoneko-preview-key:'+payload.salt;
    let gateOpening=false;
    async function unlock(key){
      const data=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data));
      document.open();document.write(new TextDecoder().decode(data));document.close();
