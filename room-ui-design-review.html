<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>部屋のUI — 文字なしモック</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e4db;color:#343e33;font-family:'Yu Gothic',Meiryo,sans-serif}header{padding:28px 32px 20px;border-bottom:1px solid #c9c9bc;background:#f5f2eb}header small{font-size:11px;letter-spacing:.16em;color:#677361}h1{font-family:'Yu Mincho',serif;font-size:26px;font-weight:500;margin:8px 0 16px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar button,.expand{border:1px solid #78866d;border-radius:20px;background:transparent;padding:9px 16px;color:#42563d;font:inherit;font-size:12px;cursor:pointer}.toolbar button[aria-pressed=true]{background:#52694e;color:#fff9e9}.toolbar label{font-size:12px;margin-left:8px}.hint{font-size:12px;color:#697161;margin:14px 0 0}.comparison{--w:375px;--h:764px;display:grid;grid-template-columns:var(--w);justify-content:center;align-items:start;gap:28px;padding:28px 24px 48px}.comparison.compact{--w:320px;--h:520px}article{width:var(--w)}.caption{height:140px;position:relative;padding-right:58px}.number{font-size:11px;letter-spacing:.1em;color:#788569}.caption h2{font-size:19px;font-family:'Yu Mincho',serif;margin:6px 0 8px}.caption p{font-size:12px;line-height:1.8;margin:0;color:#63705d}.expand{position:absolute;right:0;top:12px;padding:8px 12px}.room{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#eee7cf;border-radius:4px;box-shadow:0 8px 30px #303d3020;isolation:isolate}.room-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:-1}.room button{font-family:'Yu Mincho','Hiragino Mincho ProN',serif;cursor:pointer;-webkit-tap-highlight-color:transparent}.room button:focus-visible{outline:2px solid #6d8360;outline-offset:2px}.room button:active{filter:brightness(.93)}.street{position:absolute;left:0;top:0;width:84px;height:84px;border:0;background:none;padding:0;color:#425b40}.rim{position:absolute;left:-87px;top:-87px;width:174px;height:174px;animation:turn 30s linear infinite}.street-picture{position:absolute;left:0;top:0;width:84px;height:63px;clip-path:circle(76px at 0 0)}.street-label{position:absolute;left:22px;top:89px;font-size:16px;font-weight:700;letter-spacing:.12em;display:flex;gap:13px;align-items:center}.street-label b{font-size:18px;font-weight:400}.top-actions{position:absolute;right:10px;top:8px;display:flex;gap:8px}.top-actions button{position:relative;width:64px;height:82px;border:0;background:none;padding:0;color:#5c5945}.top-actions svg{width:64px;height:59px;display:block}.top-actions span{display:block;font-size:12px;letter-spacing:.08em;line-height:21px;font-weight:700}.tool{position:absolute;bottom:8px;width:72px;height:92px;border:0;background:none;padding:0;color:#594c36}.tool.play{left:calc(50% - 86px)}.tool.clean{left:calc(50% + 14px)}.tool-pad{height:67px;width:70px;position:relative;display:grid;place-items:center}.tool-pad img{width:52px;height:52px;object-fit:contain;position:relative;z-index:1;pointer-events:none}.tool strong{font-size:14px;line-height:22px;letter-spacing:.1em;display:block;font-weight:700}.stock{position:absolute;right:2px;top:1px;color:#695e45;font:11px Georgia,serif}.call{position:absolute;right:0;bottom:0;width:72px;height:106px;border:0;padding:0;background:none;color:#64513d}.call svg{width:72px;height:86px;display:block}.call span{position:absolute;bottom:0;right:7px;font-size:14px;letter-spacing:.12em;font-weight:700}.shelf{position:absolute;left:0;bottom:120px;width:38px;height:132px;border:1px solid #a48861;border-left:0;background:#d9bb88;border-radius:0 7px 7px 0;box-shadow:inset -4px 0 #c1a171;color:#665039;display:flex;align-items:center;justify-content:center;gap:12px;flex-direction:column;font-family:'Yu Mincho',serif}.shelf span{writing-mode:vertical-rl;letter-spacing:.14em;font-size:13px}.shelf i{width:16px;height:7px;border:2px solid #927449;border-top:0;border-radius:0 0 6px 6px}.shelf b{font-size:17px;font-weight:400}.room-note{position:absolute;bottom:122px;left:54px;right:30px;text-align:center;padding:8px;background:#fff6de;border-radius:12px;font-size:12px;color:#5b674e;box-shadow:0 2px 7px #574a2b15;opacity:0;pointer-events:none;transition:opacity .2s}.room-note.on{opacity:1}.notes{padding:18px 3px;font-size:12px;line-height:1.9;color:#59634f}.notes b{display:block;color:#3d513b;font-size:13px;margin-bottom:3px}
/* A: carved wood for things held in the hand; a person remains unframed. */
.a .tool-pad{border-radius:44% 47% 42% 45%;border:1px solid #ac8959;background:#dbc195;box-shadow:inset 0 0 0 4px #ead5b0,inset 0 0 0 6px #c5a370,0 3px 0 #94764b40}.a .tool strong{color:#735b3e;text-shadow:0 1px #fff1d2}.a .call span{border-bottom:1px solid #b18e64;padding:0 3px 2px}.a .layout span{border-bottom:1px dashed #a79a77}.a .app span{font-size:11px;color:#526e5b}
/* B: soft storage mat, a room exit and actual desk objects. */
.b .rim{display:none}.b .street{width:124px;height:136px}.b .street-picture{left:-7px;top:-11px;width:123px;height:134px}.b .street-label{top:99px;left:25px;font-size:14px;background:#ecdbb6;padding:3px 8px;gap:7px;transform:rotate(-3deg);box-shadow:0 2px #b69a70}.b .tool-pad{background:#adad8a;border:1px solid #8d9676;border-radius:7px 12px 9px 6px;box-shadow:inset 0 0 0 4px #c4c5a4,0 2px 0 #8c896244}.b .tool-pad:after{content:'';position:absolute;inset:6px;border:1px dashed #828d6e;border-radius:5px;pointer-events:none}.b .tool strong{background:#ede1c3;color:#67634b;border-radius:2px;width:62px;margin:3px auto 0;font-size:13px}.b .call span{background:#f6ecd5;border-radius:10px 10px 2px 10px;padding:2px 6px}.b .layout span{font-size:11px}.b .app svg{transform:rotate(-7deg)}
/* C: bold visual silhouettes and minimal but legible labels. */
.c .tool-pad{border-radius:50%;background:#f9efd8;border:2px solid #819173;box-shadow:0 3px 0 #6b7e5d30}.c .tool strong{color:#435e45;font-family:'Yu Gothic',Meiryo,sans-serif;font-size:13px;letter-spacing:.04em;margin-top:3px}.c .street-label{font-family:'Yu Gothic',Meiryo,sans-serif;font-size:15px;letter-spacing:.04em;color:#3e5a42}.c .top-actions span{font-family:'Yu Gothic',Meiryo,sans-serif;font-size:11px;letter-spacing:0}.c .call span{font-family:'Yu Gothic',Meiryo,sans-serif;font-size:13px;right:5px;background:#f7edd4;padding:2px 6px;border-radius:12px;color:#425b40}.paused .rim{animation-play-state:paused}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.rim{animation:none}}.comparison.focused{grid-template-columns:var(--w)}.comparison.focused article:not(.selected){display:none}@media(max-width:1200px){.comparison{justify-content:start;overflow-x:auto}}@media(max-width:600px){header{padding:20px 16px}.comparison{display:flex;flex-direction:column;align-items:center;padding:24px 0;gap:20px}.comparison.focused article:not(.selected){display:none}h1{font-size:22px}.comparison:not(.compact){--w:min(375px,100vw)}}
/* Compare disclosure models, not three colours of the same labelled controls. */
.a .street-label,.a .top-actions span,.a .tool strong,.a .call>span,
.b .street-label,.b .top-actions span,.b .tool strong,.b .call>span,
.c .tool strong,.c .app span{display:none}

.b .rim{display:block}.b .street-picture{left:0;top:0;width:84px;height:63px;clip-path:circle(76px at 0 0)}.b .street{width:134px;height:130px}
.a .tool-pad img,.b .tool-pad img{width:58px;height:58px}.a .top-actions svg,.b .top-actions svg{height:68px}
.a .call svg,.b .call svg{position:absolute;right:0;bottom:0;height:85px;width:72px;margin:0}
.room .shelf{padding:0;width:38px;height:132px;border:0;overflow:visible;background:none;box-shadow:none;transition:width .25s;display:block}
.drawer-inside{position:absolute;left:0;top:0;width:110px;height:132px;background:#ad8c5f;border:5px solid #c4a373;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateX(-110px);transition:transform .25s;box-shadow:inset 0 0 0 2px #917247}
.room .drawer-inside img{width:48px;height:48px;object-fit:contain}.room .shelf .drawer-inside{writing-mode:horizontal-tb}
.drawer-front{writing-mode:horizontal-tb!important;position:absolute;left:0;top:0;width:38px;height:132px;border:1px solid #9f8057;border-left:0;background:#dbbd8a;box-shadow:inset -4px 0 #bf9e6f;display:flex;flex-direction:column;align-items:center;justify-content:space-around;border-radius:0 5px 5px 0;transition:transform .25s}
.drawer-front:after{content:'';position:absolute;left:0;right:5px;top:50%;border-top:2px solid #b49363}.room .shelf i{width:19px;height:9px;border:2px solid #8b6e47;border-top:3px solid #aa895b;box-shadow:0 2px #b99767;border-radius:2px 2px 6px 6px}
.shelf.open .drawer-front{transform:translateX(110px)}.shelf.open .drawer-inside{transform:translateX(0)}
.room button.responding:not(.tool):not(.shelf) svg:not(.rim){animation:object-response .65s ease}.room .layout.responding svg{animation:furniture-shift .65s ease!important}
@keyframes object-response{40%{transform:rotate(-5deg) translateY(-3px)}}@keyframes furniture-shift{35%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.drawer-front,.drawer-inside{transition:none}.room button.responding svg{animation:none!important}}
</style></head><body><header><small>TSUGUNEKO / ROOM UI STUDY</small><h1>部屋の操作を、どう見せるか。</h1><div class="toolbar"><button data-size="large" aria-pressed="true">375 × 764</button><button data-size="small" aria-pressed="false">320 × 520</button><button id="all">全体表示</button><label><input type="checkbox" id="motion" checked> 枠の動きを見る</label></div><p class="hint">文字なし・地図アイコンのモックです。本編や保存データは変更しません。道具は絵だけをドラッグできます。</p></header><main class="comparison"></main><script src="assets/room-ui-mockups/art.js"></script><script>
const svg=(body,box='0 0 72 72')=>`<svg viewBox="${box}" aria-hidden="true">${body}</svg>`;
const house='<path d="M15 29L36 12 57 29V62H15Z" fill="#fbefce"/><path d="M10 29L36 7 62 29 57 35 36 17 15 35Z" fill="#b47759"/><path d="M23 37h10v12H23Z" fill="#91aaa0"/><path d="M41 40h9v22h-9Z" fill="#6d8269"/>';
const map=svg('<path d="M3 3L35 8 69 0 98 7V66L69 60 35 71 3 65Z" fill="#d6ddbd"/><path d="M3 56Q35 38 98 45M65 0L58 70" fill="none" stroke="#faf2dc" stroke-width="7"/>'+house+'<path d="M80 10c-9 0-13 6-13 12 0 10 13 23 13 23s13-13 13-23c0-6-4-12-13-12Z" fill="#64846d"/><circle cx="80" cy="22" r="5" fill="#faf2dc"/>','0 0 105 78');
const phone=svg('<path d="M22 10L50 10 50 59 22 59Z" fill="#d0c3a0" transform="translate(2 2)"/><rect x="21" y="6" width="29" height="52" rx="6" fill="#557568"/><rect x="24" y="12" width="23" height="36" rx="2" fill="#fcf5df"/><path d="M35.5 24c-8-9-15 3 0 13 15-10 8-22 0-13" fill="#c8878d"/><path d="M32 53h7" stroke="#f6eed5" stroke-width="2" stroke-linecap="round"/>');
const sofa=svg('<path d="M11 57L20 61 63 58 53 53Z" fill="#b5a77e" opacity=".5"/><path d="M17 36V24q0-6 6-6h28q6 0 6 6v13" fill="#9eae8b"/><path d="M14 33h8v14h30V33h8v21H14Z" fill="#758d6e"/><path d="M22 35h30v12H22Z" fill="#bdc7a5"/><path d="M19 54v6m36-6v6" stroke="#677b5c" stroke-width="3"/><path d="M16 10h40m-34-5-6 5 6 5m28-10 6 5-6 5" fill="none" stroke="#6c8365" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>');
const swatches=svg('<path d="M13 14L53 9 60 55 19 61Z" fill="#f3e5c6" stroke="#bba17b"/><path d="M19 22L47 18 49 32 21 36Z" fill="#a4b394"/><path d="M22 40L35 38 37 51 24 54Z" fill="#c38d70"/><path d="M39 37L52 35 54 49 41 51Z" fill="#d3b680"/><path d="M53 58l10-39 4 1-10 39-4 6Z" fill="#8d7755"/>');
function rim(kind){const points=Array.from({length:32},(_,i)=>{const a=i*Math.PI/16,r=i%2?75:81;return `${87+Math.cos(a)*r},${87+Math.sin(a)*r}`}).join(' ');return `<svg class="rim" viewBox="0 0 174 174" aria-hidden="true"><polygon points="${points}" fill="${kind==='c'?'#7f9471':'#aeb998'}"/><circle cx="87" cy="87" r="71" fill="#f3e8cb"/>${kind==='c'?'<circle cx="87" cy="87" r="66" fill="none" stroke="#c2cdae" stroke-width="1"/>':''}</svg>`;}
const callMark=svg('<path d="M40 12C52 11 59 20 58 31C58 39 54 44 48 47V56C59 60 65 67 66 78H29C29 68 32 61 38 57V48C30 47 26 43 26 36L20 33 26 26C26 18 31 13 40 12Z" fill="#6b8067"/><path d="M15 27Q11 33 15 39M7 22Q1 33 7 44" fill="none" stroke="#6b8067" stroke-width="3" stroke-linecap="round"/>','0 0 66 78');
const variants=[{id:'a',name:'文字なし・地図の入口',tag:'ROOM UI / SELECTED DIRECTION',description:'操作名は表示せず、物と動作で伝える。\n配置を保ったまま、見た目を詰めるモック。',note:'地図・道具・人物・スマホ・動かす家具',detail:'左上は地図のアイコン。棚は取っ手で開閉し、玩具と掃除道具は絵だけを持ち上げます。触れても説明文は表示しません。'}];document.querySelector('main').innerHTML=variants.map(v=>`<article data-kind="${v.id}"><div class="caption"><span class="number">${v.tag}</span><h2>${v.name}</h2><p>${v.description.replace('\n','<br>')}</p><button class="expand" data-focus="${v.id}">拡大</button></div><div class="room ${v.id}"><img class="room-bg" src="assets/room-ui-mockups/room.png" alt="比較用の共通の部屋"><button class="street" aria-label="街へ">${rim(v.id)}<span class="street-picture">${map}</span></button><nav class="top-actions"><button class="app" aria-label="アプリ">${phone}</button><button class="layout" aria-label="模様替え">${sofa}</button></nav><button class="shelf" aria-label="収納を開く" aria-expanded="false"><span class="drawer-inside">${mockArt.toy}${mockArt.clean}</span><span class="drawer-front"><i></i><i></i></span></button><button class="tool play" aria-label="あそぶ"><span class="tool-pad">${mockArt.toy}<small class="stock">∞</small></span></button><button class="tool clean" aria-label="そうじ"><span class="tool-pad">${mockArt.clean}<small class="stock">∞</small></span></button><button class="call" aria-label="よぶ">${callMark}</button></div><div class="notes"><b>${v.note}</b>${v.detail}</div></article>`).join('');
const main=document.querySelector('main');document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{main.classList.toggle('compact',b.dataset.size==='small');document.querySelectorAll('.room-bg').forEach(n=>n.src='assets/room-ui-mockups/'+(b.dataset.size==='small'?'room-small.png':'room.png'));document.querySelectorAll('[data-size]').forEach(n=>n.setAttribute('aria-pressed',n===b));});document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{main.classList.add('focused');document.querySelectorAll('article').forEach(a=>a.classList.toggle('selected',a.dataset.kind===b.dataset.focus));main.scrollIntoView({behavior:'smooth'});});document.querySelector('#all').onclick=()=>main.classList.remove('focused');document.querySelector('#motion').onchange=e=>main.classList.toggle('paused',!e.target.checked);
function feedback(b){b.classList.remove('responding');void b.offsetWidth;b.classList.add('responding');setTimeout(()=>b.classList.remove('responding'),650);}
document.querySelectorAll('.room button').forEach(b=>{b.addEventListener('click',()=>{feedback(b);if(b.classList.contains('shelf')){const open=b.classList.toggle('open');b.setAttribute('aria-expanded',open);b.setAttribute('aria-label',open?'収納を閉じる':'収納を開く');}});});document.querySelectorAll('.tool').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);const img=b.querySelector('img').cloneNode();Object.assign(img.style,{position:'fixed',width:'52px',height:'52px',pointerEvents:'none',zIndex:99,left:e.clientX-26+'px',top:e.clientY-26+'px'});document.body.append(img);b.onpointermove=e=>{img.style.left=e.clientX-26+'px';img.style.top=e.clientY-26+'px'};b.onpointerup=b.onpointercancel=()=>{img.remove();b.onpointermove=null;};};b.style.touchAction='none';});
</script></body></html>
