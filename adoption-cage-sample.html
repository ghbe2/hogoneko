<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ホゴネコ｜かごの前をゆく人たち</title><style>
*{box-sizing:border-box}body{margin:0;background:#363b35;color:#554e3e;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}svg{display:block}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #d4ae69;outline-offset:2px}
.preview{height:48px;padding:4px 7px;display:flex;gap:7px;align-items:center;justify-content:center;background:#343a32;color:#fff7df;font:11px sans-serif}.preview label{display:flex;gap:4px;align-items:center}.preview select,.preview button{height:34px;padding:0 6px;border-radius:7px;border:1px solid #798371;background:#485242;color:#fff8e8}.preview small{color:#d2d5c7;font-size:10px}
.game{position:relative;margin:auto;width:min(100%,420px);height:calc(100dvh - 48px);max-height:820px;background:#e3e2cc;--card:178px;--paper:#fff8e8;--green:#667c57;isolation:isolate}.bar{height:40px;padding:0 16px;background:#fff8e8;display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:.1em}.bar small{font-size:10px;color:#8b8169}
.scene{position:absolute;inset:40px 0 0;background:linear-gradient(#e3e2cf 0 57%,#cdb88d 57%);overflow:clip}.stage{position:absolute;inset:0 0 calc(var(--card) + 12px)}
.windows{position:absolute;inset:12% 6% 43%;display:flex;justify-content:space-between}.window{width:26%;border:6px solid #aa9470;background:linear-gradient(90deg,transparent 46%,#f4ecd5 46% 53%,transparent 53%),linear-gradient(transparent 47%,#f4ecd5 47% 53%,transparent 53%),#b5cdcb;box-shadow:inset 0 0 0 2px #f4ecd5}.flags{position:absolute;top:2%;left:3%;width:94%;height:46px}.hall-name{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:13px;color:#747b5e;letter-spacing:.25em}
.walkway{position:absolute;left:0;right:0;bottom:12%;height:72%;pointer-events:none}.person{position:absolute;left:0;bottom:0;width:82px;height:100%;max-height:240px;visibility:hidden;will-change:transform;transform:translateX(-140px)}.person svg{height:100%;width:100%;overflow:visible}.person .leg-a{transform-origin:51px 163px;animation:stride 1.15s ease-in-out infinite}.person .leg-b{transform-origin:66px 163px;animation:stride 1.15s ease-in-out infinite reverse}.person .shin{transform-origin:0 39px;animation:knee 1.15s ease-in-out infinite}.person .leg-b .shin{animation-delay:-.575s}.person .arm{transform-origin:74px 106px;animation:arm 1.15s ease-in-out infinite}.person .torso{animation:breathe-step .575s ease-in-out infinite}.person .head{transform-origin:60px 94px;transition:rotate .5s}.face-front{opacity:0}.face-profile{opacity:1}.person.stopped .leg-a,.person.stopped .leg-b,.person.stopped .arm,.person.stopped .shin,.person.stopped .torso{animation:none}.person.stopped .head{rotate:8deg}.person.stopped .face-front{opacity:1}.person.stopped .face-profile{opacity:0}.person.stopped .arm{transform:rotate(7deg)}
.basket{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:212px;height:174px;z-index:3}.basket:after{content:'';position:absolute;left:6%;right:6%;bottom:-7px;height:15px;border-radius:50%;background:#9a835a40;z-index:-1}.basket-back,.basket-front{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.basket-front{z-index:4}.cat{position:absolute;left:43px;right:43px;bottom:34px;height:88px;z-index:2}.cat svg{width:100%;height:100%;overflow:visible}.basket-tag{position:absolute;left:79px;bottom:4px;z-index:5;background:#fff4d8;padding:3px 9px;font-size:11px;border-radius:3px;box-shadow:0 1px 2px #856c4440}
.aside{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:11px;letter-spacing:.08em;color:#76684e}
.result-title{position:absolute;top:14%;left:10%;right:10%;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s;z-index:6;pointer-events:none}.result-title small{display:block;font-size:11px;letter-spacing:.18em;color:#9d7d3c}.result-title strong{display:block;font-size:32px;font-weight:500;letter-spacing:.16em;line-height:1.7;color:#977136}.result-title:after{content:'✦';display:block;font-size:19px;color:#bda060}.revealed .result-title{opacity:1;transform:none}.revealed .hall-name,.revealed .flags{opacity:.25}.tnr .result-title strong{color:#647451}.tnr .result-title:after{content:'—';color:#80916b}.suspense .stage{filter:brightness(.91);transition:filter 1.5s}.revealed .basket:before{content:'';position:absolute;inset:-25%;z-index:-1;background:radial-gradient(ellipse,#fff3baaa,transparent 65%)}.tnr .basket:before{background:none}
.panel{position:absolute;left:10px;right:10px;bottom:12px;height:var(--card);border-radius:20px;background:var(--paper);box-shadow:0 3px 0 #a78c6033;padding:13px 15px;display:grid;grid-template-rows:14px 28px 46px 44px;gap:6px;z-index:7}.eyebrow{font-size:10px;letter-spacing:.14em;color:#938569}.panel h1{margin:0;font-weight:500;font-size:19px;line-height:28px;white-space:nowrap}.panel p{margin:0;font-size:13px;line-height:22px}.panel button{height:44px;width:100%;border:0;border-radius:25px;background:var(--green);color:#fff8e9;font-size:14px}.panel button:disabled{background:#eee6d2;color:#8c7f63;cursor:default}.record .basket{filter:drop-shadow(0 0 8px #fff9e7)}
.eyebrow{line-height:14px}
.request-speech{position:absolute;top:19%;left:15%;right:15%;margin:0;padding:12px 15px;border:1px solid #d7ccb0;border-radius:18px 18px 4px 18px;background:#fff8e8;color:#667251;text-align:center;font-size:15px;line-height:24px;z-index:6;opacity:0;transition:opacity .7s;pointer-events:none}.request-speech:after{content:'';position:absolute;right:13px;bottom:-11px;width:17px;height:12px;background:#fff8e8;clip-path:polygon(0 0,100% 0,100% 100%)}.requesting .request-speech{opacity:1}.requesting .flags,.requesting .hall-name{opacity:.3}
@keyframes stride{0%,100%{rotate:-11deg}50%{rotate:11deg}}@keyframes knee{0%,50%,100%{rotate:0deg}75%{rotate:16deg}}@keyframes arm{0%,100%{rotate:8deg}50%{rotate:-8deg}}@keyframes breathe-step{0%,100%{translate:0 0}50%{translate:0 -1.5px}}
@media(max-height:650px){.basket{width:184px;height:149px;bottom:6%}.cat{left:37px;right:37px;bottom:29px;height:75px}.basket-tag{left:66px;font-size:10px}.person{width:72px;max-height:190px}.result-title{top:9%}.result-title strong{font-size:26px}.result-title small{font-size:10px}.request-speech{top:6%;font-size:14px;padding:9px 12px}.panel h1{font-size:18px}.aside{font-size:10px}.preview small{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body>
<nav class="preview" aria-label="サンプル確認用・ゲーム外"><label>成績<select id="grade"><option value="high">よい</option><option value="mid">ふつう</option><option value="low">控えめ</option></select></label><label>結末<select id="branch"><option value="adopted">譲渡</option><option value="tnr">TNR</option></select></label><button id="restart">再生し直す</button><small>確認用</small></nav>
<main class="game"><header class="bar"><span>ホゴネコ</span><small>譲渡会</small></header><div class="scene" id="scene"><div class="stage"><div class="windows" aria-hidden="true"><i class="window"></i><i class="window"></i></div><svg class="flags" viewBox="0 0 400 55" preserveAspectRatio="none" aria-hidden="true"><path d="M0 3Q200 70 400 3" fill="none" stroke="#907959" stroke-width="2"/><path d="M30 12L62 21 41 41Z M244 31L276 25 264 49Z" fill="#bf8b6f"/><path d="M98 28L130 34 109 54Z M333 19L366 10 357 39Z" fill="#99aa83"/><path d="M173 36L206 36 189 55Z" fill="#cdb67c"/></svg><span class="hall-name">譲渡会</span><div class="walkway" id="walkway" aria-label="会場を歩く来場者"></div>
<div class="basket" aria-label="かごの中のこむぎ"><svg class="basket-back" viewBox="0 0 212 174" aria-hidden="true"><path d="M78 34V20Q106 3 134 20V34" fill="none" stroke="#967b53" stroke-width="6"/><path d="M13 57Q13 32 39 32H173Q199 32 199 57V150H13Z" fill="#c5b086"/><path d="M23 58Q23 43 40 43H172Q189 43 189 58V140H23Z" fill="#e8ddbf"/></svg><div class="cat"><svg id="cat" viewBox="200 55 320 320" preserveAspectRatio="xMidYMax meet" role="img" aria-label="こむぎ"></svg></div><svg class="basket-front" viewBox="0 0 212 174" aria-hidden="true"><path d="M13 58V145Q13 162 30 162H182Q199 162 199 145V58" fill="none" stroke="#a88c5e" stroke-width="8"/><path d="M15 135H197V153Q197 164 183 164H29Q15 164 15 153Z" fill="#bba172"/><path d="M22 142H190M26 154H186" stroke="#dfc797" stroke-width="3"/><path d="M40 49V135M77 43V135M135 43V135M172 49V135" stroke="#af9a7166" stroke-width="3"/><path d="M16 66H196" stroke="#d0b98a" stroke-width="5"/></svg><span class="basket-tag">こむぎ</span></div>
<div class="result-title" id="result-title"><small id="result-kicker"></small><strong id="result-word"></strong></div><div class="aside" id="aside">育ててきた日々を、この出会いへ。</div></div>
<section class="panel" aria-live="polite"><div class="eyebrow" id="step"></div><h1 id="heading"></h1><p id="copy"></p><button id="next"></button></section></div></main>
<script src="assets/cat-svg.js"></script><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let phase='ready',started=0,grade='high',route='adopted',seen=new Set();
const colors=['#889b7d','#bc8f78','#9d9c7a','#879da1','#a999b4','#b39d6f'];
function person(i){
 const hair=['#6e5b49','#514d43','#8a8170'][i%3],coat=colors[i],skin=i%3===1?'#d8ad8b':'#dfbb98';
 const leg=(name,x,fill)=>`<g class="${name}"><g transform="translate(${x} 163)"><path d="M-9 0H10L8 42H-8Z" fill="${fill}"/><g class="shin"><path d="M-8 39H8L7 78H-7Z" fill="${fill}"/><path d="M-7 74H7L17 81Q20 87 10 87H-10Z" fill="#655b4c"/><path d="M-9 86H16" stroke="#b6a88b" stroke-width="2"/></g></g></g>`;
 return `<svg viewBox="0 0 120 260" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><ellipse cx="60" cy="253" rx="31" ry="4" fill="#8b79552a"/><g class="figure">${leg('leg-b',66,'#797967')}${leg('leg-a',51,'#656858')}<g class="torso"><path d="M39 106Q56 92 75 102L82 168Q62 176 34 168Z" fill="${coat}"/><path d="M49 99L59 115 68 99" fill="#f1e5cb"/><path d="M58 116L57 162" stroke="#eee2ca" stroke-width="1.5" opacity=".5"/><circle cx="61" cy="128" r="1.5" fill="#e4d9bf"/><circle cx="61" cy="142" r="1.5" fill="#e4d9bf"/><path d="M38 151H50V160H38" fill="#ffffff20"/><path d="M65 152H77V161H65" fill="#ffffff20"/><path d="M50 90L50 103Q61 111 67 100V87" fill="${skin}"/>
 <g class="head">${i===4?`<path d="M39 44Q18 42 24 70L34 86 45 75Z" fill="${hair}"/>`:''}<path d="M39 46Q42 26 66 29Q86 32 84 54L88 68 80 73Q77 94 61 96Q39 89 37 66Z" fill="${skin}"/><path d="M37 68Q26 41 40 29Q61 15 80 30Q90 36 85 53L72 43 62 35 47 49 44 70Z" fill="${hair}"/>${i===2?'<path d="M32 39Q47 19 73 26L88 43H32" fill="#b7a880"/><path d="M30 44H96" stroke="#9e8d68" stroke-width="5"/>':''}<ellipse cx="43" cy="66" rx="5" ry="7" fill="${skin}"/><g class="face-profile"><path d="M72 59L77 60M74 80L79 79" stroke="#705f4c" stroke-width="2" stroke-linecap="round" fill="none"/></g><g class="face-front"><path d="M49 61L54 60M68 60L73 61M54 81Q62 87 70 80" stroke="#705f4c" stroke-width="2" stroke-linecap="round" fill="none"/>${i%2?'<g stroke="#8e8167" stroke-width="1.4" fill="none"><rect x="45" y="55" width="14" height="13" rx="5"/><rect x="65" y="55" width="14" height="13" rx="5"/><path d="M59 60H65"/></g>':''}</g><ellipse cx="72" cy="73" rx="4" ry="2" fill="#cb9378" opacity=".5"/></g>
 <g class="arm"><path d="M74 109L84 136 78 157" stroke="${coat}" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M78 156L76 167" stroke="${skin}" stroke-width="8" stroke-linecap="round"/></g>${i===4?'<path d="M45 107L72 154" stroke="#b89765" stroke-width="3"/><path d="M62 149H86L89 175H61Z" fill="#c8ad78"/><path d="M67 151Q74 140 81 151" stroke="#9b8157" fill="none" stroke-width="2"/>':''}</g></g></svg>`;
}
const walkers=colors.map((_,i)=>{const n=document.createElement('div');n.className='person';n.innerHTML=person(i);$('walkway').append(n);return n});
const speech=document.createElement('p');speech.className='request-speech';speech.id='request-speech';speech.textContent='あの……こむぎを、\n家族に迎えたいんです。';speech.style.whiteSpace='pre-line';document.querySelector('.stage').append(speech);
const stopSets={high:[0,1,3,4,5],mid:[1,4,5],low:[4]};
function content(k,h,c,b,disabled=false){$('step').textContent=k;$('heading').textContent=h;$('copy').innerHTML=c;$('next').textContent=b;$('next').disabled=disabled}
function reset(){phase='ready';grade=$('grade').value;route=$('branch').value;seen.clear();$('scene').className='scene';walkers.forEach(n=>{n.style.visibility='hidden';n.classList.remove('stopped')});$('aside').textContent='育ててきた日々を、この出会いへ。';content('最後の挑戦','この子の、これからへ。','かごの中から、会場を見つめるこむぎ。<br>今日の出会いを、最後まで見届けよう。','譲渡会をはじめる')}
function start(){reset();phase='walking';started=performance.now();content('譲渡会・見守る時間','どんな出会いがあるだろう。','会場を、人が行き交う。<br>こむぎに気づき、足を止める人もいる。','見守っています',true);$('aside').textContent='';}
function reveal(){phase='result';$('scene').className='scene revealed'+(route==='tnr'?' tnr':'');$('result-kicker').textContent=route==='adopted'?'この出会いが、未来になった':'保護活動の、ひとつの区切り';$('result-word').textContent=route==='adopted'?'譲渡成立':'元いた街へ';$('aside').textContent=route==='adopted'?'「この子と、一緒に暮らしたいです。」':'返したあとも、見守りは続く。';content('結果発表',route==='adopted'?'新しい家族ができました。':'こむぎを、街へ返そう。',route==='adopted'?'立ち止まった人との、小さな出会い。<br>家族へつなぐことができました。':'今回は、ご縁にはつながりませんでした。<br>元いた場所へ返し、これからも見守ります。','活動の記録へ')}
function positionPerson(n,x,stopped,faceLeft=false){n.style.visibility='visible';n.classList.toggle('stopped',stopped);n.dataset.stopped=String(stopped);n.style.transform=`translateX(${x}px)`;n.querySelector('.figure').setAttribute('transform',faceLeft?'translate(120 0) scale(-1 1)':'');}
function updateVisitors(elapsed){const w=$('walkway').clientWidth;walkers.forEach((n,i)=>{const local=elapsed-i*2.6,fromRight=i%2===1,pw=n.clientWidth,speed=(w+200)/6.4,target=fromRight?w-pw-8:8,origin=fromRight?w+100:-100,at=Math.abs(target-origin)/speed,stop=stopSets[grade].includes(i),pause=stop?2.8:0,stopped=stop&&local>=at&&local<at+pause,travel=stopped?at:local>=at+pause?local-pause:local,x=origin+(fromRight?-1:1)*speed*travel;positionPerson(n,x,stopped,fromRight);if(stopped)seen.add(i);if(local<0||local>6.4+pause)n.style.visibility='hidden';});}
function approach(elapsed){const n=walkers[4],w=$('walkway').clientWidth,p=Math.min(1,Math.max(0,(elapsed-25)/3)),ease=p*p*(3-2*p),target=w-n.clientWidth-8;positionPerson(n,w+30+(target-w-30)*ease,p>=1,true);}
function placeSpeech(){const head=walkers[4].querySelector('.head').getBoundingClientRect(),stage=document.querySelector('.stage').getBoundingClientRect();speech.style.top=Math.max(8,head.top-stage.top-speech.offsetHeight-18)+'px';}
window.addEventListener('resize',()=>{if(phase==='request')placeSpeech()});
function advance(elapsed){
 if(phase==='walking'){updateVisitors(elapsed);if(elapsed>=23){phase='suspense';walkers.forEach(n=>n.style.visibility='hidden');$('scene').className='scene suspense';content('譲渡会・閉会','人の流れが、落ち着いた。','かごの中で、静かに待つこむぎ。<br>今日の出会いは、どうだっただろう。','見守っています',true);$('aside').textContent='';}}
 if(phase==='suspense'&&elapsed>=25){if(route==='tnr'){reveal();return;}phase='approach';$('scene').className='scene';content('譲渡会・帰り際','こちらへ、歩いてくる人。','さっき、足を止めていた人が<br>こむぎのところへ戻ってきました。','見守っています',true);}
 if(phase==='approach'){approach(elapsed);if(elapsed>=28){phase='request';$('scene').className='scene requesting';placeSpeech();content('来場者の声','「この子を、家族に。」','かごのそばに、もう一度。<br>その人は、あなたに声をかけました。','話を聞いています',true);}}
 if(phase==='request'&&elapsed>=33)reveal();
}
$('next').onclick=()=>{if(phase==='ready')start();else if(phase==='result'){phase='record';$('scene').classList.add('record');content('活動の記録・こむぎ',route==='adopted'?'家族へつないだ命。':'守って、街へ返した命。',route==='adopted'?'空き地で保護 → 育成 → 譲渡成立<br>この子の姿を、譲渡の記録に残しました。':'空き地で保護 → 育成 → TNR<br>この子の姿を、見守りの記録に残しました。','もう一度、見届ける')}else reset()};$('restart').onclick=start;$('grade').onchange=reset;$('branch').onchange=reset;
const dna={...CatSVG.defaults,body:'normal',headCoat:'tabby',bodyCoat:'tabby',legCoat:'tabby',tailCoat:'tabby',tail:'long',earCut:'left',seed:307},rig=CatSVG.buildCat($('cat'),'cage',dna,375,1.25);$('cat').querySelector('.floor')?.remove();
function frame(t){if(['walking','suspense','approach','request'].includes(phase))advance((t-started)/1000);const time=reduced?0:t/1000,model=CatSVG.poseModel('sit',time);if(phase==='walking'&&!reduced){model.hr=Math.sin(time*.65)*4;model.hx=Math.sin(time*.65)*5;}if(['approach','request','result'].includes(phase)&&route==='adopted'){model.hr=5;model.hx=8;}CatSVG.applyPose(rig,model,time,'sit');requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
</script></body></html>
