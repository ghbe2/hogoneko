<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>落ちるハート・試作</title><style>
*{box-sizing:border-box}body{margin:0;background:#e6ddcf;color:#544738;font:14px system-ui}main{max-width:480px;height:100dvh;margin:auto;padding:12px;display:flex;flex-direction:column;gap:8px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:19px;margin:4px 0}a{color:inherit}button,select{font:inherit;color:inherit;border:1px solid #c7af93;border-radius:12px;background:#fff7e8;min-height:44px;padding:8px}button[aria-pressed=true]{background:#715c49;color:white}.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.phone{position:relative;flex:1;min-height:240px;border-radius:24px;background:#f1e6cf;display:flex;flex-direction:column;overflow:hidden}.gauge{padding:12px 8px;display:flex;justify-content:center;gap:4px;background:#fff7e7;z-index:3}.slot{position:relative;color:#e5d6ca;font-size:23px;line-height:1}.slot.lock{color:#c8bbac;opacity:.5}.slot i{position:absolute;left:0;top:0;overflow:hidden;color:#cf728b;font-style:normal;white-space:nowrap}.room{position:relative;flex:1;min-height:140px;background:linear-gradient(#ede2c7 56%,#caa67c 56%)}.window{position:absolute;left:22px;top:26px;width:80px;height:90px;border:6px solid #b28e68;background:linear-gradient(#bfd5cf 65%,#98af88 65%)}.cat{position:absolute;bottom:54px;left:calc(50% - 85px);width:170px;height:200px;overflow:visible}.feather{position:absolute;bottom:48px;left:49%;font-size:28px}.hearts{position:absolute;inset:0;pointer-events:none;z-index:4}.drop{position:absolute;font-size:27px;color:#d16c86;text-shadow:0 2px #fff6;transform:translate(-50%,-50%)}.big{position:absolute;color:#cd6484;font-size:62px;left:50%;top:55%;transform:translate(-50%,-50%);pointer-events:none;z-index:5}.spark{position:absolute;left:50%;bottom:178px;color:#ce7d90;font-size:26px;pointer-events:none}.play{margin:8px;background:#ce7d90;color:white;border:0;touch-action:none;user-select:none}.note{font-size:12px;line-height:1.5;margin:0}.status{height:18px;text-align:center;font-size:12px}.glow{animation:glow .8s}@keyframes glow{50%{filter:drop-shadow(0 0 6px #e87597);transform:scale(1.2)}}@media(max-height:600px){main{gap:5px;padding:8px}.cat{height:140px;width:140px;left:calc(50% - 70px);bottom:35px}.feather{bottom:32px}.spark{bottom:126px}.window{height:55px;width:55px;top:15px}.note{font-size:11px}.slot{font-size:21px}.gauge{padding:8px}.controls{gap:4px}button,select{padding:6px}.phone{min-height:230px}}
</style></head><body><main><header><h1>落ちるハート</h1><a href="heart-study.html">3案へ戻る</a></header><div class="controls"><label>開始 <select id="start"><option value="50">50</option><option value="55" selected>55</option><option value="59.5">59.5</option></select></label><label>上限 <select id="cap"><option>60</option><option>65</option><option>70</option></select></label><button id="reset">やり直す</button></div><div class="phone"><div class="gauge" aria-label="心の10段階ゲージ"></div><div class="room"><div class="window"></div><svg class="cat" viewBox="200 55 320 320" aria-label="遊ぶネコ"></svg><span class="spark"></span><span class="feather">🪶</span><div class="hearts"></div></div><button class="play">押している間、遊ぶ</button></div><div class="status" aria-live="polite"></div><div class="controls"><button id="auto" aria-pressed="false">自動で遊ぶ</button><label>速さ <select id="speed"><option value="1">実際の速さ</option><option value="5" selected>確認用5倍</option></select></label></div><p class="note">小ハート1個＝心1。10個が大ハートに合体。55なら5個から開始。増えた分は即反映し、合体は演出のみ。本編のセーブは変更しません。</p></main><script src="assets/cat-svg.js"></script><script>
const $=s=>document.querySelector(s);let heart=55,shown=55,held=false,auto=false,busy=false,last=performance.now(),epoch=0,animations=[];const rig=CatSVG.buildCat($('.cat'),'fall',{...CatSVG.defaults},375,1.25);$('.cat .floor')?.remove();
function gauge(){const cap=+$('#cap').value;$('.gauge').innerHTML=Array.from({length:10},(_,i)=>`<span class="slot ${i*10>=cap?'lock':''}">♡<i style="width:${Math.max(0,Math.min(100,(shown-i*10)*10))}%">♥</i></span>`).join('');$('.gauge').setAttribute('aria-label',`心 ${heart.toFixed(1)}、上限 ${cap}`);}
function resting(n){const room=$('.room'),h=document.createElement('span');h.className='drop';h.textContent='♥';h.style.left=`${12+n*8.2}%`;h.style.top=`${room.clientHeight-19-(n%3)*4}px`;h.style.rotate=`${(n%3-1)*12}deg`;$('.hearts').appendChild(h);return h;}
async function animate(el,frames,options){const a=el.animate(frames,options);animations.push(a);try{await a.finished;}catch{}finally{animations=animations.filter(x=>x!==a);}}
async function drop(){busy=true;const token=epoch,n=(Math.floor(heart+.00001)-1)%10,h=resting(n),endX=parseFloat(h.style.left)/100*$('.room').clientWidth,endY=parseFloat(h.style.top);await animate(h,[{translate:`${$('.room').clientWidth*.5-endX}px ${-endY*.6}px`,opacity:0,scale:.4},{offset:.15,opacity:1,scale:1.15},{offset:.8,translate:'0 0',scale:1},{offset:.9,translate:'0 -10px',scale:1},{translate:'0 0',scale:1}],{duration:650,easing:'ease-in',fill:'both'});if(token!==epoch)return;
 if(Math.floor(heart+.00001)%10===0){const nodes=[...$('.hearts').children];await Promise.all(nodes.map(node=>{const r=node.getBoundingClientRect(),room=$('.room').getBoundingClientRect();return animate(node,[{translate:'0 0',opacity:1},{translate:`${room.left+room.width/2-r.left}px ${room.top+room.height*.55-r.top}px`,opacity:0,scale:.3}],{duration:450,fill:'forwards'});}));if(token!==epoch)return;$('.hearts').replaceChildren();const big=document.createElement('span');big.className='big';big.textContent='♥';$('.room').appendChild(big);await animate(big,[{scale:.3,opacity:0},{offset:.25,scale:1.3,opacity:1},{offset:.5,scale:1,opacity:1},{translate:`0 ${-$('.room').clientHeight*.55-25}px`,scale:.35,opacity:0}],{duration:1050,fill:'forwards'});big.remove();if(token!==epoch)return;shown=heart;gauge();$('.gauge').classList.remove('glow');void $('.gauge').offsetWidth;$('.gauge').classList.add('glow');}else{shown=heart;gauge();}busy=false;}
function reset(){epoch++;animations.forEach(a=>a.cancel());animations=[];busy=false;held=false;heart=shown=+$('#start').value;$('.big')?.remove();$('.hearts').replaceChildren();for(let n=0;n<Math.floor(heart)%10;n++)resting(n);gauge();}
$('#reset').onclick=reset;$('#start').onchange=$('#cap').onchange=reset;$('#auto').onclick=()=>{auto=!auto;$('#auto').textContent=auto?'止める':'自動で遊ぶ';$('#auto').setAttribute('aria-pressed',auto)};const play=$('.play');play.onpointerdown=e=>{held=true;play.setPointerCapture(e.pointerId)};play.onpointerup=play.onpointercancel=()=>held=false;play.onkeydown=e=>{if(['Space','Enter'].includes(e.code)){held=true;e.preventDefault()}};play.onkeyup=()=>held=false;window.onblur=()=>held=false;document.addEventListener('visibilitychange',()=>{held=false;last=performance.now()});
function frame(now){const dt=Math.min(100,now-last)/1000;last=now;const active=(held||auto)&&!document.hidden,cap=+$('#cap').value;if(active&&!busy&&heart<cap){const before=Math.floor(heart);heart=Math.min(cap,heart+dt*.1*+$('#speed').value);if(Math.floor(heart)>before)drop();else{shown=heart;gauge();}}const fraction=heart%1;$('.spark').textContent=active&&heart<cap&&!busy?'✧'.repeat(Math.floor(fraction*4)+1):'';$('.spark').style.opacity=.3+fraction*.7;$('.spark').style.scale=.6+fraction*.6;$('.feather').style.transform=`translateX(${active?Math.sin(now/160)*35:0}px)`;$('.status').textContent=heart>=cap&&!busy?'今日の上限。ネコとの遊びは続けられます':busy?'':active?'':'途中で離しても、続きから';const pose=active?'punch':'sit';CatSVG.applyPose(rig,CatSVG.poseModel(pose,now/1000),now/1000,pose);requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
</script></body></html>
