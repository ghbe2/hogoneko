<svg xmlns="http://www.w3.org/2000/svg" width="375" height="764" viewBox="0 0 375 764" role="img" aria-labelledby="title desc">
<title id="title">ホゴネコ・広場を囲む街 SVG案</title>
<desc id="desc">自宅、動物病院、スーパー、ペットショップ、譲渡会と、空き地、路地裏、公園、山をひとつの街に配置した検討用マップ。</desc>
<defs>
