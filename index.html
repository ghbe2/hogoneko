function getPlacedPoint(state, itemId, fallback = { x:50, y:66 }) {
  const placed = getPlaced(getRoom(state)).find(entry => entry.itemId === itemId);
  return placed ? { x:placed.x, y:placed.y } : fallback;
}

function getNearestRoamIndex(target, points = CONFIG.stage1.roamPoints) {
  let bestIndex = 0;
  let bestDistance = Infinity;
  CONFIG.stage1.roamPoints.forEach((point, index) => {
    if (!points.includes(point)) return;
    const distance = Math.hypot(point.x - target.x, (point.y - target.y) * 1.25);
    if (distance < bestDistance) {
      bestDistance = distance;
      bestIndex = index;
    }
  });
  return bestIndex;
}

function getInteractionFocus(result, target = { x:50, y:66 }, state = gameState) {
  const all = CONFIG.stage1.roamPoints;
  const available = getAvailableRoamPoints(state);
  const candidates = result.referenceStage.id === "fear"
    ? available.filter(point => point.distance === "far")
    : result.referenceStage.id === "normal"
      ? available.filter(point => point.surface === "floor" || point.surface === "box")
      : available;
  let index = getNearestRoamIndex(target, candidates);
  if (result.referenceStage.id === "fear") {
    const farthest = candidates.reduce((best, point) => {
      const bestDistance = Math.hypot(best.x - target.x, best.y - target.y);
      const pointDistance = Math.hypot(point.x - target.x, point.y - target.y);
      return pointDistance > bestDistance ? point : best;
    }, candidates[0]);
    index = all.indexOf(farthest);
  }
  return { ...all[index], response:result.operation };
}

function getTypeScore(catType, stimulusTag) {
  const row = CONFIG.affinity.chart[catType];
  if (!row) return 0;
  if (row.like.includes(stimulusTag)) return 1;
  if (row.dislike.includes(stimulusTag)) return -1;
  return 0;
}

function getAffinity(cat, subject) {
  const affinityType = typeof subject === "string" ? subject : subject?.affinityType || null;
  const score = affinityType
    ? cat.types.reduce((total, catType) => total + getTypeScore(catType, affinityType), 0)
    : 0;
  const kind = score >= 2 ? "superMatch"
    : score === 1 ? "match"
      : score === 0 ? "neutral"
        : score === -1 ? "dislike" : "superDislike";
  return { kind, score, tags:affinityType ? [affinityType] : [], affinityType };
}

function getHeartStage(heart) {
  return CONFIG.stage1.heartStages.find(stage => heart >= stage.min && heart <= stage.max) || CONFIG.stage1.heartStages[0];
}

function resolveInteraction(cat, operation, subject) {
  const affinity = getAffinity(cat, subject);
  const baseStage = getHeartStage(cat.heart);
  const baseIndex = CONFIG.stage1.heartStages.findIndex(stage => stage.id === baseStage.id);
  const shift = CONFIG.affinity[affinity.kind].shift;
  const referenceIndex = Math.max(0, Math.min(CONFIG.stage1.heartStages.length - 1, baseIndex + shift));
  const referenceStage = CONFIG.stage1.heartStages[referenceIndex];
  return {
    operation,
    affinity:affinity.kind,
    score:affinity.score,
    tags:affinity.tags,
    baseStage,
    referenceStage,
    shift:referenceIndex - baseIndex,
    response:CONFIG.stage1.responses[operation][referenceStage.id],
    baseHeart:CONFIG.affinity[affinity.kind].heart,
  };
}

function getTroubleCount(cat) {
  return [cat.body.hunger, cat.body.litter, cat.body.sick, cat.body.vomit, Boolean(cat.body.broken)].filter(Boolean).length;
}

function getNeglectPenalty(days) {
  if (days <= 0) return 0;
  return days >= CONFIG.stage1.careTrust.severeAfterDays
    ? CONFIG.stage1.careTrust.severePenalty
    : CONFIG.stage1.careTrust.neglectPenalty;
}

function updateHeart(cat, amount, options = {}) {
  const rounded = Math.round((cat.heart + amount) * 10) / 10;
  if (amount <= 0) return Math.max(0, rounded);
  const limit = options.ignoreCap ? CONFIG.week.heartCapMax : cat.heartCap;
  return Math.max(cat.heart, Math.min(limit, rounded));
}

function isPositiveAffinity(kind) {
  return kind === "superMatch" || kind === "match" || kind === "neutral";
}

function isLikedAffinity(kind) {
  return kind === "superMatch" || kind === "match";
}

function isNegativeAffinity(kind) {
  return kind === "superDislike" || kind === "dislike";
}

function applyAffinityHeart(state, cat, result, requestedAmount = result.rawHeartDelta) {
  const canOverflow = result.affinity === "superMatch" && !state.ui.usedHandItems.heart_overflow;
  const nextHeart = updateHeart(cat, requestedAmount, { ignoreCap:canOverflow });
  return {
    nextHeart,
    delta:Math.round((nextHeart - cat.heart) * 10) / 10,
    overflowUsed:canOverflow && nextHeart > cat.heartCap,
  };
}

function getInteractionApplication(state, cat, result, alreadyUsed = false, requestedAmount = result.rawHeartDelta) {
  const repeatableLoss = result.affinity === "superDislike";
  const amount = alreadyUsed && !repeatableLoss ? 0 : requestedAmount;
  return applyAffinityHeart(state, cat, result, amount);
}

function formatHeartDelta(value) {
  if (value === 0) return "心 ±0";
  return `心 ${value > 0 ? "+" : ""}${value}`;
}

function makeReaction(kind, title, detail, operation = null) {
  return { kind, title, detail, operation, id: Date.now() + Math.random() };
}

function interactionResult(cat, operation, subject) {
  const result = resolveInteraction(cat, operation, subject);
  const rawHeartDelta = result.baseHeart;
  const heartDelta = Math.round((updateHeart(cat, rawHeartDelta) - cat.heart) * 10) / 10;
  return { ...result, rawHeartDelta, heartDelta };
}

function affinityLog(result) {
  return {
    operation:result.operation,
    tags:result.tags,
    score:result.score,
    affinity:result.affinity,
    baseStage:result.baseStage.label,
    referenceStage:result.referenceStage.label,
    shift:result.shift,
    heartDelta:result.heartDelta,
    careBonus:result.careBonus || 0,
    neglectPenalty:result.neglectPenalty || 0,
  };
}

function getSubjectLabel(id) {
  const item = getItem(id);
  if (item) return item.label;
  const food = getFood(id);
  if (food) return food.label;
  return { action_call:"呼ぶ", action_pet:"撫でる", action_pickup:"抱っこ", action_leave:"ほっとく", action_clean:"掃除" }[id] || id;
}

function reactionFromResult(result, delta = result.heartDelta, suffix = "") {
  const detail = `${result.response.text}・${formatHeartDelta(delta)}${suffix ? `・${suffix}` : ""}`;
  return makeReaction(result.affinity, result.response.symbol, detail, result.operation);
}

// ============================================================
// 純粋な状態更新
// ============================================================
function reduceGameState(state, action) {
  const cat = getCat(state);

  switch (action.type) {
    case "START_GAME":
      return state.onboarding.status === "new"
        ? { ...state, onboarding:{ status:"active", storyIndex:0 }, campaign:{ ...state.campaign, phase:"story" } }
        : state;

    case "NEXT_STORY":
      if (state.campaign.phase !== "story") return state;
      if (state.onboarding.storyIndex < 2) return { ...state, onboarding:{ ...state.onboarding, storyIndex:state.onboarding.storyIndex + 1 } };
      return reduceGameState(state, { type:"GO_RESCUE" });

    case "PREVIOUS_STORY":
      return { ...state, onboarding:{ ...state.onboarding, storyIndex:Math.max(0, state.onboarding.storyIndex - 1) } };

    case "TOGGLE_GUIDE":
      return { ...state, ui:{ ...state.ui, guideExpanded:!(state.ui.guideExpanded ?? state.onboarding.status === "active") } };

    case "GO_RESCUE":
      if (cat.status === "raising") return { ...state, ui:{ ...state.ui, message:`${getCallName(cat)}との保護生活中。おうちへ戻ろう` } };
      return { ...state, campaign:{ ...state.campaign, phase:"field", bait:[], trapPlaced:false, trapId:null, trapReady:false, trapToken:0, trapRevealDone:false, waitTicks:0, captured:false }, ui:{ ...state.ui, modal:null, message:"" } };

    case "GO_HOME":
      if (cat.status !== "raising") return state;
      return { ...state, campaign:{ ...state.campaign, phase:"room" }, ui:{ ...state.ui, modal:null, layoutMode:false, message:`${getCallName(cat)}のいるおうちへ戻った` } };

    case "BACK_TO_TOWN":
      return { ...state, campaign:{ ...state.campaign, phase:"town", trapPlaced:false, waitTicks:0 }, ui:{ ...state.ui, modal:null } };

    case "OPEN_MAP_SHOP":
      return { ...state, campaign:{ ...state.campaign, phase:"shop", shopId:action.shopId }, ui:{ ...state.ui, modal:null } };

    case "BUY_SHOP_ITEM": {
      const price = Math.max(0, Number(action.price) || 0);
      if (!action.itemId || state.coins < price) return state;
      return { ...state, coins:state.coins - price, inventory:{ ...state.inventory, [action.itemId]:(state.inventory[action.itemId] || 0) + 1 } };
    }

    case "FIELD_PLACE_TRAP":
      return { ...state, campaign:{ ...state.campaign, trapPlaced:true, trapId:action.trapId || "trap_standard", trapPosition:{ x:action.x ?? 50, y:action.y ?? 72 }, trapReady:false, waitTicks:0 } };

    case "FIELD_ADD_BAIT": {
      if (!state.campaign.trapPlaced || state.campaign.bait.length >= CONFIG.capture.maxMix || !state.inventory[action.foodId]) return state;
      const bait = state.campaign.bait.includes(action.foodId) ? state.campaign.bait : [...state.campaign.bait, action.foodId];
      return { ...state, campaign:{ ...state.campaign, bait, trapReady:false, waitTicks:1, trapToken:action.token || Date.now() } };
    }

    case "TRAP_READY":
      if (state.campaign.phase !== "field" || !state.campaign.trapPlaced || !state.campaign.bait.length || action.token !== state.campaign.trapToken) return state;
      return { ...state, campaign:{ ...state.campaign, trapReady:true, waitTicks:CONFIG.capture.waitTicks } };

    case "TOGGLE_BAIT": {
      if (state.campaign.trapPlaced) return state;
      const bait = new Set(state.campaign.bait);
      if (bait.has(action.foodId)) bait.delete(action.foodId);
      else if (bait.size < CONFIG.capture.maxMix) bait.add(action.foodId);
      return { ...state, campaign:{ ...state.campaign, bait:[...bait] } };
    }

    case "PLACE_TRAP":
      if (!state.campaign.bait.length) return state;
      return { ...state, campaign:{ ...state.campaign, trapPlaced:true, waitTicks:0 } };

    case "WAIT_TRAP":
      if (!state.campaign.trapPlaced || state.campaign.waitTicks >= CONFIG.capture.waitTicks) return state;
      return { ...state, campaign:{ ...state.campaign, waitTicks:state.campaign.waitTicks + 1 } };

    case "OPEN_TRAP": {
      if (!state.campaign.trapReady) return state;
      const inventory = { ...state.inventory };
      const types = cat.types.length ? cat.types : drawShuffledTypes({ ...cat, types:[] });
      state.campaign.bait.forEach(id => { inventory[id] = Math.max(0, (inventory[id] || 0) - 1); });
      return {
        ...state,
        inventory,
        flags:{ ...state.flags, firstCapture:true },
        cats:[{ ...cat, types, status:"captured" }],
        campaign:{ ...state.campaign, phase:"trapInspect", captured:true, trapRevealDone:false },
      };
    }

    case "FINISH_TRAP_REVEAL":
      if (state.campaign.phase !== "trapInspect") return state;
      return { ...state, campaign:{ ...state.campaign, trapRevealDone:true } };

    case "GO_CLINIC":
      return { ...state, campaign:{ ...state.campaign, phase:"clinic", clinicStep:"exam" } };

    case "FINISH_EXAM":
      if (state.campaign.phase !== "clinic" || state.campaign.clinicStep !== "exam") return state;
      return { ...state, campaign:{ ...state.campaign, clinicStep:"summary" } };

    case "SHOW_RECEIPT":
      return { ...state, campaign:{ ...state.campaign, clinicStep:"summary" } };

    case "START_NAMING":
      return { ...state, campaign:{ ...state.campaign, clinicStep:"naming" } };

    case "START_INTAKE": {
      const cost = CONFIG.stage1.campaign.clinicCost;
      if (state.coins < cost) return state;
      const name = String(action.name || "").trim().slice(0, 8);
      if (!name) return { ...state, ui:{ ...state.ui, message:"名前を入力してね" } };
      const resetCat = {
        ...cat,
        name,
        nickname:null,
        lifeLog:[],
        heart:CONFIG.stage1.heartStart,
        heartCap:CONFIG.stage1.heartCapStart,
        intakeEnv:0,
        status:"intake",
        body:{ ...cat.body, days:0, weight:CONFIG.stage1.bodyStart.weight, weightHistory:[], hunger:false, litter:0, vomit:0, broken:null, sick:false, neglectDays:0 },
      };
      return {
        ...state,
        coins:state.coins - cost,
        flags:{ ...state.flags, firstIntake:true },
        cats:[resetCat],
        campaign:{ ...state.campaign, phase:"intake", intakeItems:[], intakeCalled:false, intakeFeedback:null },
        ui:{ ...state.ui, layoutMode:true, layoutTrayOpen:true, layoutFilter:"all", debugIntakeOpen:false, scheduleIntro:false, modal:null, reaction:null, catFocus:null },
      };
    }

    case "TOGGLE_INTAKE_ITEM": {
      const items = new Set(state.campaign.intakeItems);
      if (items.has(action.itemId)) items.delete(action.itemId);
      else items.add(action.itemId);
      return { ...state, campaign:{ ...state.campaign, intakeItems:[...items] } };
    }

    case "CALL_INTAKE_CAT": {
      if (state.campaign.phase !== "intake" || state.campaign.intakeCalled) return state;
      const breakdown = getRoomComfortBreakdown(state);
      const mood = getIntakeMood(state);
      if (breakdown.missingEssential.length) {
        return { ...state, campaign:{ ...state.campaign, intakeFeedback:"essential" }, ui:{ ...state.ui, message:"ごはん皿とトイレが必要そう" } };
      }
      if (!breakdown.canExit && mood.disliked.length) {
        return { ...state, campaign:{ ...state.campaign, intakeFeedback:"concern" }, ui:{ ...state.ui, message:"苦手なものがありそう" } };
      }
      if (!breakdown.canExit) {
        return { ...state, campaign:{ ...state.campaign, intakeFeedback:"more" }, ui:{ ...state.ui, message:"もう少しみたい" } };
      }
      return {
        ...state,
        campaign:{ ...state.campaign, intakeCalled:true, intakeFeedback:mood.disliked.length ? "readyConcern" : "ready" },
        ui:{ ...state.ui, layoutTrayOpen:false, message:mood.disliked.length ? `気になるものもあるけど、「${getCallName(cat)}」に応えた` : `「${getCallName(cat)}」と呼んだ` },
      };
    }

    case "ACCEPT_CAT": {
      const breakdown = getRoomComfortBreakdown(state);
      if (!breakdown.canExit || !state.campaign.intakeCalled) return state;
      return {
        ...state,
        onboarding:{ ...state.onboarding, status:"done" },
        cats:[{ ...cat, status:"raising", intakeEnv:breakdown.total, lifeLog:[...(cat.lifeLog || []).filter(entry => entry.day !== 1), { day:1, kind:"start", title:`${cat.name}と生活開始`, note:"おうちに迎えた日" }] }],
        rooms:state.rooms.map(room => ({ ...room, cats:[cat.id] })),
        campaign:{ ...state.campaign, phase:"room" },
        lastSeenAt:Date.now(),
        ui:{ ...state.ui, layoutMode:false, modal:"schedule", scheduleIntro:true, clueFound:false, clueIndex:0, roamIndex:1, message:`1日目・${cat.name}との生活が始まった` },
      };
    }

    case "GO_EVENT":
      if (cat.body.days + 1 < CONFIG.stage1.adoptionEventDay || !isGraduationReady(state)) {
        return { ...state, ui:{ ...state.ui, modal:"schedule", message:"譲渡会までに、からだの準備も整えよう" } };
      }
      return { ...state, campaign:{ ...state.campaign, phase:"graduation" }, ui:{ ...state.ui, modal:null } };

    case "POSTPONE_EVENT":
      return reduceGameState({ ...state, campaign:{ ...state.campaign, phase:"room" }, ui:{ ...state.ui, modal:null } }, { type:"NEXT_DAY" });

    case "SEND_EVENT": {
      if (!isGraduationReady(state)) return state;
      const outcome = cat.heart >= CONFIG.graduation.adoptScoreGood ? "adopted" : "tnr";
      const area = state.areas.a1 || { tnrCount:0 };
      return {
        ...state,
        cats:[{ ...cat, status:outcome }],
        rooms:state.rooms.map(room => ({ ...room, cats:[] })),
        areas:{ ...state.areas, a1:{ ...area, tnrCount:area.tnrCount + (outcome === "tnr" ? 1 : 0) } },
        flags:{ ...state.flags, firstGraduate:true, ...(outcome === "tnr" ? { firstTnr:true } : {}) },
        album:[...state.album, { catId:cat.id, name:cat.name, outcome, day:cat.body.days + 1 }],
        campaign:{ ...state.campaign, phase:"result", outcome },
      };
    }

    case "NEXT_RESCUE": {
      const fresh = {
        ...cat,
        id:`cat_mock_${state.album.length + 2}`,
        name:"",
        nickname:null,
        types:[],
        status:"candidate",
        heart:CONFIG.stage1.heartStart,
        heartCap:CONFIG.stage1.heartCapStart,
        intakeEnv:0,
        body:{ ...cat.body, days:0, weight:CONFIG.stage1.bodyStart.weight, weightHistory:[], hunger:false, litter:0, vomit:0, broken:null, sick:false, neglectDays:0 },
        notebook:{ chart:true, tried:{}, favorite:null, disliked:null, foundPlaced:{} },
      };
      return {
        ...state,
        cats:[fresh],
        rooms:state.rooms.map(room => ({ ...room, cats:[] })),
        campaign:{ phase:"town", area:"a1", shopId:null, bait:[], trapPlaced:false, trapId:null, trapPosition:{x:50,y:72}, trapReady:false, trapToken:0, trapRevealDone:false, waitTicks:0, captured:false, clinicStep:"exam", intakeItems:[], intakeCalled:false, intakeFeedback:null, outcome:null },
        ui:{ ...state.ui, modal:null, reaction:null, usedHandItems:{}, debugOpen:false, debugIntakeOpen:false },
      };
    }

    case "TOGGLE_DEBUG":
      return { ...state, ui:{ ...state.ui, debugOpen:!state.ui.debugOpen } };

    case "TOGGLE_INTAKE_DEBUG":
      if (state.campaign.phase !== "intake") return state;
      return { ...state, ui:{ ...state.ui, debugIntakeOpen:!state.ui.debugIntakeOpen } };

    case "SHUFFLE_CAT_TYPES": {
      if (!canShowCatTypes(state)) return state;
      const types = Array.isArray(action.types) && action.types.length ? action.types : cat.types;
      return {
        ...state,
        cats:[{ ...cat, types, notebook:{ ...cat.notebook, tried:{}, favorite:null, disliked:null } }],
        campaign:{ ...state.campaign, intakeFeedback:null },
        ui:{ ...state.ui, debugOpen:true, usedHandItems:{}, lastAffinityLog:null, message:`タイプを${types.map(type => TYPE_LABELS[type]).join("＋")}に変更` },
      };
    }

    case "ADVANCE_THREE_HOURS": {
      const previousHours = Number(state.ui.debugHours) || 0;
      const nextHours = previousHours + 3;
      if (state.campaign.phase === "field" && state.campaign.trapPlaced && state.campaign.bait.length) {
        return { ...state, campaign:{ ...state.campaign, trapReady:true, waitTicks:CONFIG.capture.waitTicks }, ui:{ ...state.ui, debugHours:nextHours, message:"3時間経過：保護器が揺れている" } };
      }
      if (state.campaign.phase !== "room") {
        return { ...state, ui:{ ...state.ui, debugHours:nextHours, message:"3時間経過" } };
      }
      const events = ["hunger", "litter", "vomit", "broken"];
      const event = events[Math.floor(previousHours / 3) % events.length];
      const progressed = reduceGameState({ ...state, ui:{ ...state.ui, debugHours:nextHours } }, { type:"RETURN_FROM_AWAY", events:[event], at:Date.now() });
      const eventLabel = { hunger:"空腹", litter:"トイレ", vomit:"吐いたあと", broken:"家具の傷み" }[event];
      return { ...progressed, ui:{ ...progressed.ui, debugOpen:true, debugHours:nextHours, message:`3時間経過：${eventLabel}を反映` } };
    }

    case "TOGGLE_LAYOUT_TRAY":
      return { ...state, ui:{ ...state.ui, layoutTrayOpen:!state.ui.layoutTrayOpen } };

    case "SET_LAYOUT_FILTER":
      return { ...state, ui:{ ...state.ui, layoutFilter:["all","floor","wall"].includes(action.filter) ? action.filter : "all" } };

    case "COMMAND_MISS":
      return { ...state, ui:{ ...state.ui, message:action.message || "そこでは使えない。反応した場所まで運ぼう" } };

    case "OPEN_INVENTORY":
      return { ...state, ui:{ ...state.ui, modal:state.ui.modal === "inventory" ? null : "inventory", inventoryTab:action.tab || state.ui.inventoryTab || "play", reaction:null, catFocus:null } };

    case "OPEN_SLOT_MENU":
      return { ...state, ui:{ ...state.ui, modal:"inventory", inventoryTab:["play","food","clean"].includes(action.tab) ? action.tab : "play", reaction:null, catFocus:null } };

    case "SET_INVENTORY_TAB":
      return { ...state, ui:{ ...state.ui, inventoryTab:["play","food","clean"].includes(action.tab) ? action.tab : "play" } };

    case "OPEN_SCHEDULE":
      return { ...state, ui:{ ...state.ui, layoutMode:false, modal:state.ui.modal === "schedule" ? null : "schedule", scheduleIntro:false, reaction:null, catFocus:null } };

    case "OPEN_OUTING":
      return { ...state, campaign:{ ...state.campaign, phase:"town" }, ui:{ ...state.ui, layoutMode:false, modal:null, reaction:null, catFocus:null } };

    case "SHOW_WEIGHT":
      return { ...state, ui:{ ...state.ui, weightPeek:Number(action.index) } };

    case "OUTING_CHOICE":
      if (action.destination === "event") return reduceGameState({ ...state, ui:{ ...state.ui, modal:null } }, { type:"GO_EVENT" });
      return { ...state, ui:{ ...state.ui, modal:null, message:{ rescue:"今はこの子の保護生活中。卒業後に次の保護へ向かえる", shop:"必要なものを確認してから買いものへ向かう", clinic:"気になる体調があれば動物病院へ", event:"譲渡会の準備へ向かう" }[action.destination] || "おでかけする" } };

    case "OPEN_TOOLBOX":
      return { ...state, ui:{ ...state.ui, modal:state.ui.modal === "toolbox" ? null : "toolbox", reaction:null, catFocus:null } };

    case "OPEN_SHELF":
      return { ...state, ui:{ ...state.ui, modal:state.ui.modal === "shelf" ? null : "shelf", reaction:null, catFocus:null } };

    case "OPEN_CONTACT":
      return { ...state, ui:{ ...state.ui, modal:state.ui.modal === "contact" ? null : "contact", reaction:null, catFocus:null } };

    case "OPEN_RELATE":
      return { ...state, ui:{ ...state.ui, modal:state.ui.modal === "relate" ? null : "relate", reaction:null, catFocus:null } };

    case "OPEN_CLEANERS":
      return { ...state, ui:{ ...state.ui, modal:state.ui.modal === "cleaners" ? null : "cleaners", reaction:null, catFocus:null } };

    case "SELECT_HAND": {
      const item = getItem(action.itemId);
      if (!item || !state.inventory[item.id] || getDurability(state, item.id) <= 0) return state;
      return {
        ...state,
        ui:{ ...state.ui, modal:null, equippedHand:action.itemId, equippedContact:null, playMode:false, interactionMode:null,
          message:`あそぶを${item.label}に変更した` },
      };
    }

    case "EQUIP_FOOD": {
      const food = getFood(action.foodId);
      return {
        ...state,
        ui:{ ...state.ui, modal:null, equippedFood:action.foodId, message:`ごはんを${food.label}に変更した` },
      };
    }

    case "EQUIP_CLEANER": {
      const cleaner = getCleaner(action.cleanerId);
      if (!cleaner || !state.inventory[action.cleanerId]) return { ...state, ui:{ ...state.ui, modal:"inventory", message:"この道具は使い切っている" } };
      return {
        ...state,
        ui:{ ...state.ui, modal:null, equippedCleaner:action.cleanerId, message:`そうじを${cleaner.label}に変更した` },
      };
    }

    case "TOGGLE_LAYOUT":
      if (state.ui.layoutMode) {
        if (!state.ui.lastLayoutItem) {
          return { ...state, ui:{ ...state.ui, layoutMode:false, modal:null, message:"レイアウトを閉じた" } };
        }
        const item = getItem(state.ui.lastLayoutItem);
        const result = interactionResult(cat, "layout", item);
        const usedKey = `layout_${item.id}`;
        const application = getInteractionApplication(state, cat, result, Boolean(state.ui.usedHandItems[usedKey]));
        const delta = application.delta;
        const notebook = {
          ...cat.notebook,
          tried:{ ...cat.notebook.tried, [item.id]:result.affinity },
          favorite:isLikedAffinity(result.affinity) ? item.id : cat.notebook.favorite,
          disliked:isNegativeAffinity(result.affinity) ? item.id : cat.notebook.disliked,
        };
        return {
          ...state,
          cats:[{ ...cat, heart:application.nextHeart, notebook }],
          ui:{ ...state.ui, layoutMode:false, modal:null, lastLayoutItem:null,
            usedHandItems:{ ...state.ui.usedHandItems, [usedKey]:true, heart_overflow:state.ui.usedHandItems.heart_overflow || application.overflowUsed }, lastAffinityLog:affinityLog({ ...result, heartDelta:delta }),
            catFocus:getInteractionFocus(result, getPlacedPoint(state, item.id, CONFIG.stage1.defaultLayout[item.id])),
            message:`${item.label}の配置を保存。${getCallName(cat)}が様子を見に来た`, reaction:reactionFromResult(result, delta) },
        };
      }
      return {
        ...state,
        ui:{ ...state.ui, layoutMode:true, layoutTrayOpen:true, modal:null, reaction:null, catFocus:null, holdingCat:false, pickupResult:null, playMode:false, interactionMode:null,
          lastLayoutItem:null, message:"床の物は床、壁の物は壁の範囲だけに置ける" },
      };

    case "TOGGLE_PLACED_ITEM": {
      const room = getRoom(state);
      const existing = getPlaced(room).some(placed => placed.itemId === action.itemId);
      const config = CONFIG.stage1.defaultLayout[action.itemId];
      const strip = list => list.filter(placed => placed.itemId !== action.itemId);
      let floor = strip(room.floor);
      let wall = strip(room.wall);
      if (!existing) {
        const placed = { itemId:action.itemId, x:config.x, y:config.y };
        if (config.zone === "wall") wall = [...wall, placed];
        else floor = [...floor, placed];
      }
      return {
        ...state,
        rooms:[{ ...room, floor, wall }],
        campaign:{ ...state.campaign, intakeFeedback:state.campaign.phase === "intake" ? null : state.campaign.intakeFeedback },
        ui:{ ...state.ui, layoutTrayOpen:false, lastLayoutItem:action.itemId, message:`${getItem(action.itemId).label}を${existing ? "押し入れにしまった" : "部屋に出した"}` },
      };
    }

    case "MOVE_ITEM": {
      const room = getRoom(state);
      const move = list => list.map(placed => placed.itemId === action.itemId
        ? { ...placed, x:action.x, y:action.y }
        : placed);
      return { ...state, rooms:[{ ...room, floor:move(room.floor), wall:move(room.wall) }], campaign:{ ...state.campaign, intakeFeedback:state.campaign.phase === "intake" ? null : state.campaign.intakeFeedback }, ui:{ ...state.ui, lastLayoutItem:action.itemId } };
    }

    case "DROP_LAYOUT_ITEM": {
      const item = getItem(action.itemId);
      if (!state.ui.layoutMode || !CONFIG.stage1.placedItems.includes(action.itemId) || !item) return state;
      if (!action.store && (getDurability(state, item.id) <= 0 || !Number.isFinite(action.x) || !Number.isFinite(action.y))) return state;
      const room = getRoom(state);
      const nextRoom = { ...room, floor:room.floor.filter(p => p.itemId !== item.id), wall:room.wall.filter(p => p.itemId !== item.id) };
      if (!action.store) nextRoom[item.zone].push({ itemId:item.id, x:action.x, y:action.y });
      return { ...state, rooms:[nextRoom], campaign:{ ...state.campaign, intakeFeedback:null },
        ui:{ ...state.ui, lastLayoutItem:item.id, message:action.store ? `${item.label}を押し入れに戻した` : `${item.label}を置いた` } };
    }

    case "SET_ROOM_PAN":
      return { ...state, ui:{ ...state.ui, roomPan:Math.max(0, Math.min(getMaxPan(state), action.pan)) } };

    case "ROAM_CAT":
      return { ...state, ui:{ ...state.ui, roamIndex:action.index, pickupResult:null, catFocus:null } };

    case "TAP_CLUE": {
      if (state.ui.clueFound) return state;
      const clue = CONFIG.stage1.clueCycle[state.ui.clueIndex];
      const item = getItem(clue.itemId);
      const result = resolveInteraction(cat, "layout", item);
      const notebook = {
        ...cat.notebook,
        favorite: isLikedAffinity(result.affinity) ? clue.itemId : cat.notebook.favorite,
        disliked: isNegativeAffinity(result.affinity) ? clue.itemId : cat.notebook.disliked,
        foundPlaced:{ ...cat.notebook.foundPlaced, [clue.itemId]:{ affinity:result.affinity, note:clue.note } },
      };
      return {
        ...state, cats:[{ ...cat, notebook }],
        ui:{ ...state.ui, clueFound:true, message:"",
          lastAffinityLog:affinityLog({ ...result, heartDelta:0 }), catFocus:null, reaction:null },
      };
    }

    case "TAP_CAT": {
      const mode = state.ui.interactionMode;
      if (!mode) {
        return {
          ...state,
          ui:{ ...state.ui, catNameOpen:true, message:`${getCallName(cat)}。名前をタップすると手帳を開く`, reaction:null, catFocus:null },
        };
      }
      const affinityType = CONFIG.stage1.operationAffinityTypes[mode];
      const result = interactionResult(cat, mode === "pickup" ? "pet" : mode, affinityType);
      const usedKey = `action_${mode}`;
      const alreadyUsed = Boolean(state.ui.usedHandItems[usedKey]);
      let application = getInteractionApplication(state, cat, result, alreadyUsed);
      let delta = application.delta;
      if (mode === "pickup" && result.referenceStage.id !== CONFIG.stage1.pickup.requiredStage) {
        delta = alreadyUsed && result.affinity !== "superDislike" ? 0 : Math.min(-1, delta);
        application = { ...application, delta, nextHeart:updateHeart(cat, delta), overflowUsed:false };
        return {
          ...state,
          cats:[{ ...cat, heart:application.nextHeart }],
          ui:{ ...state.ui, interactionMode:null, holdingCat:false, pickupResult:"fled", roamIndex:CONFIG.stage1.pickup.escapeRoamIndex,
            usedHandItems:{ ...state.ui.usedHandItems, [usedKey]:true, heart_overflow:state.ui.usedHandItems.heart_overflow || application.overflowUsed }, lastAffinityLog:affinityLog({ ...result, heartDelta:delta }),
            catFocus:getInteractionFocus(result, getCatPoint(state)),
            message:"抱こうとしたら、するりと部屋の奥へ逃げた",
            reaction:makeReaction("dislike", "💢", `まだ抱っこの気分ではない・${formatHeartDelta(delta)}`, "pet") },
        };
      }
      if (mode === "pickup") {
        return {
          ...state,
          cats:[{ ...cat, heart:application.nextHeart }],
          ui:{ ...state.ui, interactionMode:null, holdingCat:true, pickupResult:"held",
            usedHandItems:{ ...state.ui.usedHandItems, [usedKey]:true, heart_overflow:state.ui.usedHandItems.heart_overflow || application.overflowUsed }, lastAffinityLog:affinityLog({ ...result, heartDelta:delta }),
            catFocus:getInteractionFocus(result, getCatPoint(state)),
            message:"そっと抱っこできた。猫をタップすると下ろす",
            reaction:makeReaction("match", "❤", `おとなしく抱かれている・${formatHeartDelta(delta)}`, "pet") },
        };
      }
      const notebook = {
        ...cat.notebook,
        tried:{ ...cat.notebook.tried, action_pet:result.affinity },
        favorite:isLikedAffinity(result.affinity) ? "action_pet" : cat.notebook.favorite,
        disliked:isNegativeAffinity(result.affinity) ? "action_pet" : cat.notebook.disliked,
      };
      return {
        ...state,
        cats:[{ ...cat, heart:application.nextHeart, notebook }],
        ui:{ ...state.ui, interactionMode:null, usedHandItems:{ ...state.ui.usedHandItems, [usedKey]:true, heart_overflow:state.ui.usedHandItems.heart_overflow || application.overflowUsed },
          roamIndex:result.referenceStage.id === "fear" ? CONFIG.stage1.pickup.escapeRoamIndex : state.ui.roamIndex,
          catFocus:getInteractionFocus(result, getCatPoint(state)),
          lastAffinityLog:affinityLog({ ...result, heartDelta:delta }), message:"撫でたときの返事を手帳に記録",
          reaction:reactionFromResult(result, delta, alreadyUsed ? "今日は心への効果なし" : "") },
      };
    }

    case "CONTACT_ACTION":
      return { ...state, ui:{ ...state.ui, modal:null, equippedContact:action.contact, equippedHand:null, interactionMode:null, playMode:false,
        message:`あそぶを${action.contact === "call" ? "呼ぶ" : action.contact === "pet" ? "撫でる" : "抱っこ"}に変更した` } };

    case "EXECUTE_CONTACT": {
      if (action.contact !== "call") {
        return reduceGameState({ ...state, ui:{ ...state.ui, modal:null, equippedContact:action.contact, equippedHand:null, interactionMode:action.contact } }, { type:"TAP_CAT" });
      }
      const result = interactionResult(cat, "call", CONFIG.stage1.operationAffinityTypes.call);
      const usedKey = "action_call";
      const alreadyUsed = Boolean(state.ui.usedHandItems[usedKey]);
      const application = getInteractionApplication(state, cat, result, alreadyUsed);
      const delta = application.delta;
      const notebook = {
        ...cat.notebook,
        tried:{ ...cat.notebook.tried, action_call:result.affinity },
        favorite:isLikedAffinity(result.affinity) ? "action_call" : cat.notebook.favorite,
        disliked:isNegativeAffinity(result.affinity) ? "action_call" : cat.notebook.disliked,
      };
      const roamIndex = result.referenceStage.id === "sweet" ? 4 : result.referenceStage.id === "fear" ? 1 : state.ui.roamIndex;
      return {
        ...state, cats:[{ ...cat, heart:application.nextHeart, notebook }],
        ui:{ ...state.ui, modal:null, equippedContact:"call", equippedHand:null, interactionMode:null, roamIndex,
          usedHandItems:{ ...state.ui.usedHandItems, [usedKey]:true, heart_overflow:state.ui.usedHandItems.heart_overflow || application.overflowUsed }, lastAffinityLog:affinityLog({ ...result, heartDelta:delta }),
          catFocus:getInteractionFocus(result, { x:46, y:66 }),
          message:`「${getCallName(cat)}」と呼んだ`, reaction:reactionFromResult(result, delta, alreadyUsed ? "今日は心への効果なし" : "") },
      };
    }

    case "FINISH_PLAY": {
      const item = getItem(action.itemId || state.ui.equippedHand);
      if (!item) return state;
      if (!state.inventory[item.id] || getDurability(state, item.id) <= 0) {
        return { ...state, ui:{ ...state.ui, playMode:false, message:`${item.label}はこわれている。別のものを選ぼう` } };
      }
      const result = interactionResult(cat, "play", item);
      const usedKey = `play_${item.id}`;
      const usedValue = state.ui.usedHandItems[usedKey];
      const earnedToday = result.rawHeartDelta > 0 ? Number(usedValue) || 0 : 0;
      const alreadyUsed = result.rawHeartDelta > 0 ? earnedToday >= result.rawHeartDelta : Boolean(usedValue);
      const requestedGain = action.live && result.rawHeartDelta > 0
        ? Math.max(0, Math.min(result.rawHeartDelta - earnedToday, Number(action.liveHeartGain) || 0))
        : result.rawHeartDelta;
      const application = getInteractionApplication(state, cat, result, alreadyUsed, requestedGain);
      const delta = application.delta;
      const nextUsedValue = result.rawHeartDelta > 0
        ? Math.round((earnedToday + Math.max(0, delta)) * 10) / 10
        : true;
      const bodyKey = `play_body_${item.id}`;
      const bodyUsed = Boolean(state.ui.usedHandItems[bodyKey]);
      const notebook = {
        ...cat.notebook,
        tried:{ ...cat.notebook.tried, [item.id]:result.affinity },
        favorite:isLikedAffinity(result.affinity) ? item.id : cat.notebook.favorite,
        disliked:isNegativeAffinity(result.affinity) ? item.id : cat.notebook.disliked,
      };
      const worn = wearToy(state, item.id);
      const equippedHand = worn.inventory[item.id] > 0 ? item.id : null;
      const liveReaction = result.affinity === "superMatch" || result.affinity === "match"
        ? null
        : result.affinity === "neutral"
          ? makeReaction("neutral", "✦", "興味はあるが、距離を保って見ている", "play")
          : result.affinity === "dislike"
            ? makeReaction("dislike", "…", "玩具から距離を取った", "play")
            : makeReaction("superDislike", "💢", "強く避けて部屋の奥へ離れた", "play");
      return {
        ...state,
        inventory:worn.inventory,
        durability:worn.durability,
        cats:[{ ...cat, heart:application.nextHeart, body:{ ...cat.body, weight:cat.body.weight + (bodyUsed ? 0 : 1) }, notebook }],
        ui:{ ...state.ui, modal:null, equippedHand, equippedContact:null, playMode:false, usedHandItems:{ ...state.ui.usedHandItems, [usedKey]:nextUsedValue, [bodyKey]:true, heart_overflow:state.ui.usedHandItems.heart_overflow || application.overflowUsed },
          roamIndex:action.anchorIndex ?? (result.referenceStage.id === "fear" ? state.ui.roamIndex : 4),
          catFocus:action.live ? null : action.anchorIndex != null ? { ...CONFIG.stage1.roamPoints[action.anchorIndex], response:"play" } : getInteractionFocus(result, { x:action.x ?? 50, y:action.y ?? 65 }),
          lastAffinityLog:affinityLog({ ...result, heartDelta:delta }), message:worn.broken ? `${item.label}を使い切った` : `${item.label}を動かして、${getCallName(cat)}と遊んだ`,
          reaction:action.live ? liveReaction : reactionFromResult(result, delta, `${action.motionLabel || "玩具を追った"}${alreadyUsed ? "・今日は心への効果なし" : ""}`) },
      };
    }

    case "RELEASE_CAT":
      return { ...state, ui:{ ...state.ui, holdingCat:false, pickupResult:null, catFocus:null, message:"そっと床へ下ろした" } };

    case "TAP_TROUBLE":
      return { ...state, ui:{ ...state.ui, message:action.problem === "hunger"
        ? "丸いごはんスロットを、お皿まで運んで補充しよう"
        : "丸いそうじスロットを、ここまで運んで使おう" } };

    case "START_CARE": {
      if (state.ui.careAnimation) return state;
      if (action.operation === "food") {
        if (!cat.body.hunger) return { ...state, ui:{ ...state.ui, message:"お皿にはまだごはんが入っている" } };
        const food = getFood(action.foodId || state.ui.equippedFood);
        if (!food || !state.inventory[food.id]) return { ...state, ui:{ ...state.ui, message:"選んでいるごはんは在庫切れ。えらぶから変更しよう" } };
        const result = interactionResult(cat, "feed", food);
        const target = getPlacedPoint(state, "bowl", { x:38, y:80 });
        const careAnimation = { id:Date.now() + Math.random(), operation:"food", foodId:food.id, x:target.x, y:target.y, emoji:"🍚" };
        return { ...state, ui:{ ...state.ui, modal:null, equippedFood:food.id, careAnimation, reaction:null, catFocus:getInteractionFocus(result, target), message:`${food.label}をお皿へ入れている…` } };
      }
      const cleaner = getCleaner(action.cleanerId || state.ui.equippedCleaner);
      const level = getProblemLevel(cat, action.problem);
      if (!level) return { ...state, ui:{ ...state.ui, message:"ここはもうきれい" } };
      if (!cleaner || !state.inventory[cleaner.id]) return { ...state, ui:{ ...state.ui, message:"そうじ道具を使い切った。上のそうじ枠から選び直そう" } };
      const result = interactionResult(cat, "clean", CONFIG.stage1.operationAffinityTypes.clean);
      const target = action.problem === "litter"
        ? getPlacedPoint(state, "litter", { x:82, y:78 })
        : action.problem === "vomit" ? { x:53, y:68 } : getPlacedPoint(state, getBrokenItemId(cat) || "box", { x:20, y:72 });
      const careAnimation = { id:Date.now() + Math.random(), operation:"clean", cleanerId:cleaner.id, problem:action.problem, x:target.x, y:target.y, emoji:cleaner.emoji };
      return { ...state, ui:{ ...state.ui, modal:null, equippedCleaner:cleaner.id, careAnimation, reaction:null, catFocus:getInteractionFocus(result, target), message:`${cleaner.label}で${getProblemLabel(action.problem)}を片づけている…` } };
    }

    case "FINISH_CARE": {
      const animation = state.ui.careAnimation;
      if (!animation || animation.id !== action.id) return state;
      if (animation.operation === "food") {
        const foodId = animation.foodId || state.ui.equippedFood;
        const food = getFood(foodId);
        if (!food || !state.inventory[foodId]) return { ...state, ui:{ ...state.ui, careAnimation:null } };
        const result = interactionResult(cat, "feed", food);
        const usedKey = `feed_${foodId}`;
        const alreadyUsed = Boolean(state.ui.usedHandItems[usedKey]);
        const careBonus = state.ui.usedHandItems.care_trust ? 0 : CONFIG.stage1.careTrust.dailyBonus;
        const application = getInteractionApplication(state, cat, result, alreadyUsed);
        const heartAfterCare = updateHeart({ ...cat, heart:application.nextHeart }, careBonus);
        const adjusted = Math.round((heartAfterCare - cat.heart) * 10) / 10;
        const notebook = {
          ...cat.notebook,
          tried:{ ...cat.notebook.tried, [foodId]:result.affinity },
          favorite:isLikedAffinity(result.affinity) ? foodId : cat.notebook.favorite,
          disliked:isNegativeAffinity(result.affinity) ? foodId : cat.notebook.disliked,
        };
        const body = { ...cat.body, hunger:false, weight:cat.body.weight + CONFIG.care.feed.body.weight };
        if (getTroubleCount({ ...cat, body }) === 0) body.neglectDays = 0;
        return {
          ...state,
          inventory:{ ...state.inventory, [foodId]:state.inventory[foodId] - 1 },
          cats:[{ ...cat, heart:heartAfterCare, body, notebook }],
          ui:{ ...state.ui, careAnimation:null, usedHandItems:{ ...state.ui.usedHandItems, [usedKey]:true, care_trust:true, heart_overflow:state.ui.usedHandItems.heart_overflow || application.overflowUsed }, lastAffinityLog:affinityLog({ ...result, heartDelta:adjusted, careBonus }),
            message:`${food.label}を1つ補充。${getCallName(cat)}も様子を見ていた`, reaction:reactionFromResult(result, adjusted, careBonus ? "今日の世話が信頼になった" : alreadyUsed ? "今日は相性効果なし" : "") },
        };
      }

      const cleaner = getCleaner(animation.cleanerId || state.ui.equippedCleaner);
      if (!cleaner || !state.inventory[cleaner.id]) return { ...state, ui:{ ...state.ui, careAnimation:null } };
      const problem = animation.problem;
      const oldLevel = getProblemLevel(cat, problem);
      const nextLevel = Math.max(0, oldLevel - cleaner.power);
      const cleared = nextLevel === 0;
      const result = interactionResult(cat, "clean", CONFIG.stage1.operationAffinityTypes.clean);
      const usedKey = `clean_${problem}`;
      const alreadyUsed = Boolean(state.ui.usedHandItems[usedKey]);
      const careBonus = cleared && !state.ui.usedHandItems.care_trust ? CONFIG.stage1.careTrust.dailyBonus : 0;
      const application = getInteractionApplication(state, cat, result, alreadyUsed);
      const heartAfterCare = updateHeart({ ...cat, heart:application.nextHeart }, careBonus);
      const adjusted = Math.round((heartAfterCare - cat.heart) * 10) / 10;
      const body = { ...cat.body };
      if (problem === "litter") body.litter = nextLevel;
      if (problem === "vomit") body.vomit = nextLevel;
      if (problem === "broken") body.broken = cleared ? null : { itemId:getBrokenItemId(cat) || "box", level:nextLevel };
      if (getTroubleCount({ ...cat, body }) === 0) body.neglectDays = 0;
      const inventory = { ...state.inventory, [cleaner.id]:state.inventory[cleaner.id] - 1 };
      const repairedItemId = problem === "broken" ? getBrokenItemId(cat) : null;
      const durability = repairedItemId ? changeDurability(state, repairedItemId, cleaner.power) : state.durability;
      const nextCleaner = inventory[cleaner.id] > 0 ? cleaner.id : CONFIG.stage1.cleaners.find(tool => inventory[tool.id] > 0)?.id || cleaner.id;
      const suffix = cleared
        ? `${getProblemLabel(problem)}がきれいになった${careBonus ? "・今日の世話が信頼になった" : ""}`
        : `汚れが${oldLevel}→${nextLevel}。もう一度必要`;
      return {
        ...state,
        inventory,
        durability,
        cats:[{ ...cat, heart:heartAfterCare, body }],
        ui:{ ...state.ui, careAnimation:null, equippedCleaner:nextCleaner,
          usedHandItems:{ ...state.ui.usedHandItems, [usedKey]:true, care_trust:state.ui.usedHandItems.care_trust || cleared, heart_overflow:state.ui.usedHandItems.heart_overflow || application.overflowUsed },
          lastAffinityLog:affinityLog({ ...result, heartDelta:adjusted, careBonus }), message:suffix,
          reaction:reactionFromResult(result, adjusted, suffix) },
      };
    }

    case "AUTO_EVENT": {
      const body = { ...cat.body };
      let durability = state.durability;
      if (action.event === "hunger") body.hunger = true;
      if (action.event === "litter") body.litter = Math.min(3, (Number(body.litter) || 0) + 1);
      if (action.event === "vomit") body.vomit = Math.min(3, (Number(body.vomit) || 0) + 1);
      if (action.event === "broken") {
        const itemId = action.itemId || "box";
        body.broken = worsenDamage(body.broken, itemId);
        durability = changeDurability(state, itemId, -1);
      }
      return { ...state, durability, cats:[{ ...cat, body }], ui:{ ...state.ui, message:action.message || `${getCallName(cat)}が何かしたみたい` } };
    }

    case "LEAVE_ROOM":
      return { ...state, lastSeenAt:action.at };

    case "RETURN_FROM_AWAY": {
      if (!action.events.length) return state;
      const body = { ...cat.body };
      let durability = state.durability;
      action.events.forEach(event => {
        if (event === "hunger") body.hunger = true;
        if (event === "litter") body.litter = Math.min(3, (Number(body.litter) || 0) + 1);
        if (event === "vomit") body.vomit = Math.min(3, (Number(body.vomit) || 0) + 1);
        if (event === "broken") {
          const itemId = getBrokenItemId({ ...cat, body }) || "box";
          body.broken = worsenDamage(body.broken, itemId);
          durability = changeDurability({ ...state, durability }, itemId, -1);
        }
      });
      return { ...state, durability, cats:[{ ...cat, body }], lastSeenAt:action.at,
        ui:{ ...state.ui, message:`留守中の困りごとが${action.events.length}件たまっている` } };
    }

    case "OPEN_NOTEBOOK":
      return { ...state, ui: { ...state.ui, layoutMode:false, modal: state.ui.modal === "notebook" ? null : "notebook", weightPeek:null, reaction: null, catFocus:null } };

    case "SET_NICKNAME": {
      const entered = String(action.nickname || "").trim().slice(0, 8);
      const nickname = entered && entered !== cat.name ? entered : null;
      return {
        ...state,
        cats:[{ ...cat, nickname }],
        ui:{ ...state.ui, modal:"notebook", message:`これから「${nickname || cat.name}」と呼ぶ` },
      };
    }

    case "CLOSE_MODAL":
      return { ...state, ui: { ...state.ui, modal: null, scheduleIntro:false, reaction:null, catFocus:null, message: "部屋に浮く3つの丸から、使いたいものを運ぼう" } };

    case "CLOSE_SCHEDULE_INTRO":
      return { ...state, ui:{ ...state.ui, modal:null, scheduleIntro:false, message:`${getCallName(cat)}との1日目が始まった` } };

    case "NEXT_DAY": {
      const nextIndex = (state.ui.clueIndex + 1) % CONFIG.stage1.clueCycle.length;
      const nextDay = (state.week.dayOfWeek + 1) % DAY_LABELS.length;
      const nextWeek = nextDay === CONFIG.game.weekStart ? state.week.weekIndex + 1 : state.week.weekIndex;
      const nextCap = Math.min(CONFIG.week.heartCapMax, cat.heartCap + CONFIG.week.heartCapPerDay);
      const nextCat = { ...cat, heartCap:nextCap };
      const leaveResult = interactionResult(nextCat, "leave", CONFIG.stage1.operationAffinityTypes.leave);
      const nextNeglectDays = getTroubleCount(cat) > 0 ? (cat.body.neglectDays || 0) + 1 : 0;
      const neglectPenalty = getNeglectPenalty(nextNeglectDays);
      const freshDayState = { ...state, ui:{ ...state.ui, usedHandItems:{} } };
      const leaveApplication = getInteractionApplication(freshDayState, nextCat, leaveResult, false);
      const heartAfterNeglect = updateHeart({ ...nextCat, heart:leaveApplication.nextHeart }, neglectPenalty);
      const combinedDelta = Math.round((heartAfterNeglect - cat.heart) * 10) / 10;
      const notebook = {
        ...cat.notebook,
        tried:{ ...cat.notebook.tried, action_leave:leaveResult.affinity },
        favorite:isLikedAffinity(leaveResult.affinity) ? "action_leave" : cat.notebook.favorite,
        disliked:isNegativeAffinity(leaveResult.affinity) ? "action_leave" : cat.notebook.disliked,
      };
      const wearCandidates = getPlaced(getRoom(state)).filter(entry => getMaxDurability(entry.itemId) && getDurability(state, entry.itemId) > 0);
      const currentBrokenItemId = getBrokenItemId(cat);
      const wearItemId = currentBrokenItemId && getDurability(state, currentBrokenItemId) > 0
        ? currentBrokenItemId
        : wearCandidates.length ? wearCandidates[nextDay % wearCandidates.length].itemId : "box";
      const nextBroken = nextDay % 2 === 0 ? worsenDamage(cat.body.broken, wearItemId) : cat.body.broken;
      const durability = nextDay % 2 === 0 ? changeDurability(state, wearItemId, -1) : state.durability;
      return {
        ...state,
        durability,
        week: { weekIndex: nextWeek, dayOfWeek: nextDay },
        lastSeenAt: Date.now(),
        cats: [{
          ...nextCat,
          heart:heartAfterNeglect,
          notebook,
          body: {
            ...cat.body,
            days: cat.body.days + 1,
            hunger: true,
            litter: Math.min(3, (Number(cat.body.litter) || 0) + 1),
            vomit: Math.min(3, (Number(cat.body.vomit) || 0) + 1),
            broken:nextBroken,
            neglectDays:nextNeglectDays,
            weightHistory:[...(cat.body.weightHistory || []), cat.body.weight],
          },
        }],
        ui: {
          ...state.ui,
          reaction: reactionFromResult(leaveResult, combinedDelta, `${neglectPenalty ? `放置 ${neglectPenalty}` : "放置ペナルティなし"}・心の上限 ${nextCap}`),
          usedHandItems: { action_leave:true, heart_overflow:leaveApplication.overflowUsed },
          clueFound: false,
          clueIndex: nextIndex,
          roamIndex: (state.ui.roamIndex + 2) % CONFIG.stage1.roamPoints.length,
          holdingCat: false,
          pickupResult: null,
          interactionMode:null,
          playMode:false,
          careAnimation:null,
          catNameOpen:false,
          lastAffinityLog:affinityLog({ ...leaveResult, heartDelta:combinedDelta, neglectPenalty }),
          catFocus:getInteractionFocus(leaveResult, { x:50, y:65 }),
          message: "新しい日。留守中の形跡と困りごとを見て回ろう",
        },
      };
    }

    case "CLEAR_REACTION":
      if (!state.ui.reaction || state.ui.reaction.id !== action.id) return state;
      return { ...state, ui: { ...state.ui, reaction: null, catFocus:null, pickupResult:state.ui.holdingCat ? "held" : null } };

    default:
      return state;
  }
}

function dispatch(action) {
  const previousState = gameState;
  const previousPoint = getCatPoint(previousState);
  gameState = reduceGameState(gameState, action);
  const nextPoint = getCatPoint(gameState);
  saveGameState(gameState);
  render(gameState);
  if ((previousPoint.x !== nextPoint.x || previousPoint.y !== nextPoint.y || previousPoint.scale !== nextPoint.scale) && !gameState.ui.holdingCat && !(action.type === "FINISH_PLAY" && action.live)) {
    animateCatWalk(previousPoint, nextPoint, nextPoint.response ? 900 : CONFIG.stage1.roamWalkMs);
  }
  if (gameState.ui.reaction) {
    const reactionId = gameState.ui.reaction.id;
    window.setTimeout(() => dispatch({ type: "CLEAR_REACTION", id: reactionId }), 3400);
  }
  if (action.type === "START_CARE" && gameState.ui.careAnimation && gameState.ui.careAnimation !== previousState.ui.careAnimation) {
    const careId = gameState.ui.careAnimation.id;
    window.setTimeout(() => dispatch({ type:"FINISH_CARE", id:careId }), CONFIG.stage1.careAnimationMs);
  }
  if (action.type === "FIELD_ADD_BAIT" && gameState.campaign.phase === "field" && gameState.campaign.bait.length) {
    const token = gameState.campaign.trapToken;
    window.setTimeout(() => dispatch({ type:"TRAP_READY", token }), 2600);
  }
  if (action.type === "OPEN_TRAP" && previousState.campaign.phase === "field" && gameState.campaign.phase === "trapInspect") {
    window.setTimeout(() => dispatch({ type:"FINISH_TRAP_REVEAL" }), 2800);
  }
  if (action.type === "GO_CLINIC" && gameState.campaign.phase === "clinic") {
    window.setTimeout(() => dispatch({ type:"FINISH_EXAM" }), 1900);
  }
  if (action.type === "CALL_INTAKE_CAT" && !previousState.campaign.intakeCalled && gameState.campaign.intakeCalled) {
    window.setTimeout(() => dispatch({ type:"ACCEPT_CAT" }), 1400);
  }
}

function animateCatWalk(from, to, duration = CONFIG.stage1.roamWalkMs) {
  const catElement = document.querySelector(".cat-object");
  if (!catElement || typeof catElement.animate !== "function") return;
  if (!from || !to) return;
  const jumping = Boolean(from.surface && to.surface && (from.surface !== to.surface || Math.abs(from.y - to.y) > 9));
  if (jumping) {
    const apexY = Math.min(from.y, to.y) - Math.max(7, Math.min(15, Math.abs(from.y - to.y) * .45 + 7));
    catElement.animate([
      { left:`${from.x}%`, top:`${from.y}%`, transform:`translate(-50%,-50%) scale(${from.scale}) rotate(0deg)` },
      { left:`${from.x + (to.x - from.x) * .18}%`, top:`${from.y + 2}%`, transform:`translate(-50%,-50%) scale(${from.scale * .92}) rotate(-3deg)`, offset:.16 },
      { left:`${from.x + (to.x - from.x) * .52}%`, top:`${apexY}%`, transform:`translate(-50%,-50%) scale(${(from.scale + to.scale) * .54}) rotate(5deg)`, offset:.52 },
      { left:`${to.x}%`, top:`${to.y}%`, transform:`translate(-50%,-50%) scale(${to.scale * .94}) rotate(-2deg)`, offset:.88 },
      { left:`${to.x}%`, top:`${to.y}%`, transform:`translate(-50%,-50%) scale(${to.scale}) rotate(0deg)` },
    ], { duration:Math.max(720, duration * .72), easing:"cubic-bezier(.35,.05,.3,1)" });
    return;
  }
  const firstMid = {
    x: from.x + (to.x - from.x) * .34,
    y: from.y + (to.y - from.y) * .34 - 1,
    scale: from.scale + (to.scale - from.scale) * .34,
  };
  const secondMid = {
    x: from.x + (to.x - from.x) * .68,
    y: from.y + (to.y - from.y) * .68 + 1,
    scale: from.scale + (to.scale - from.scale) * .68,
  };
  catElement.animate([
    { left:`${from.x}%`, top:`${from.y}%`, transform:`translate(-50%,-50%) scale(${from.scale})` },
    { left:`${firstMid.x}%`, top:`${firstMid.y}%`, transform:`translate(-50%,-50%) scale(${firstMid.scale})`, offset:.34 },
    { left:`${secondMid.x}%`, top:`${secondMid.y}%`, transform:`translate(-50%,-50%) scale(${secondMid.scale})`, offset:.68 },
    { left:`${to.x}%`, top:`${to.y}%`, transform:`translate(-50%,-50%) scale(${to.scale})` },
  ], {
    duration,
    easing:"linear",
  });
}

function getScreenGuide(state) {
  const phase = state.campaign.phase;
  const active = state.onboarding.status === "active";
  const modalGuides = {
    inventory:["使うものを選ぼう", "分類を切り替えて1つ選ぶと、丸いスロットに入ります。部屋では短押しで入れ替え、ドラッグで使えます。"],
    notebook:["この子の育ち方を見よう", "ハートは心、折れ線は体重。グラフの点に触れると、その日の体重を確認できます。"],
    schedule:["暮らしと予定を見よう", state.ui.scheduleIntro ? "1日目を記録しました。生活をはじめるボタンから、この子との毎日へ。" : "今日と譲渡会の目標を確認。今日はここまで、で翌日へ進みます。"],
  };
  if (modalGuides[state.ui.modal]) { const [title, detail] = modalGuides[state.ui.modal]; return {title, detail}; }
  if (phase === "field") {
    if (!state.campaign.trapPlaced) return {title:"① 保護器を草地へ", detail:"下の標準保護器をつかんで、草地へ運んで離そう。最初の1台は用意してあります。", target:'[data-field-drag="trap"]'};
    if (!state.campaign.bait.length) return {title:"② ごはんを保護器へ", detail:"下のごはんを1つ、置いた保護器の中へドラッグ。置き終わると、自動で待ち時間が始まります。", target:'.bait-grid'};
    if (!state.campaign.trapReady) return {title:"静かに、少し待とう", detail:"追加の操作はいりません。草むらの気配と、保護器の動きを見守って。"};
    return {title:"③ 揺れた保護器に触れよう", detail:"中に誰かがいるようです。保護器をタップして、ゆっくり近づいてみましょう。", target:'[data-action="open-trap"]'};
  }
  if (phase === "trapInspect") return state.campaign.trapRevealDone
    ? {title:"④ 獣医さんに診てもらおう", detail:"怖がり方も、落ち着き方もそれぞれ。様子を見たら、動物病院へ連れていきましょう。", target:'[data-action="go-clinic"]'}
    : {title:"はじめまして、を待とう", detail:"扉の向こうにいる子の様子が見えてきます。今はそっと見守って。"};
  if (phase === "clinic") {
    if (state.campaign.clinicStep === "exam") return {title:"診察が終わるのを待とう", detail:"体の様子を確認中です。診察結果と費用は、このあと表示されます。"};
    if (state.campaign.clinicStep !== "naming") return {title:"⑤ 診察結果を確認しよう", detail:"体重と診療費を確認したら、名前を考えるへ。支払いは名前を決めて連れ帰るときです。", target:'[data-action="start-naming"]'};
    return {title:"⑥ この子の名前を決めよう", detail:"正式な名前はあとから変えられません。呼び方・あだ名は手帳で変えられます。", target:'#campaign-cat-name'};
  }
  if (phase === "intake") {
    if (state.campaign.intakeCalled) return {title:"出てくるまで、そっと", detail:"名前に応えて、キャリーから一歩。もうすぐ一緒の暮らしが始まります。"};
    const comfort = getRoomComfortBreakdown(state);
    if (comfort.missingEssential.length) return {title:"⑦ ごはん皿とトイレを用意", detail:"右の押し入れから、足りない必需品をつかんで床へ置こう。この2つは好みに関係なく必要です。", target:'.layout-edge-palette'};
    if (comfort.canExit) return {title:"⑧ 名前で呼んでみよう", detail:"部屋の準備が整ったようです。下の呼びかけボタンで、この子の返事を待ちましょう。", target:'[data-action="call-intake-cat"]'};
    const best = CONFIG.stage1.placedItems.filter(id => !getPlaced(getRoom(state)).some(p => p.itemId === id)).map(id => getItem(id)).filter(item => item && !item.essential).sort((a,b) => getAffinity(getCat(state), b).score - getAffinity(getCat(state), a).score)[0];
    return {title:"⑦ 落ち着ける部屋を探そう", detail:active && best ? `まず${best.label}を置いて様子を見てみよう。小さなハートやキャリーの揺れがヒント。準備できたら名前を呼んで確認。` : "家具を出し入れして、ハートやキャリーの揺れを見てみよう。名前を呼ぶと、今の部屋への返事が分かります。", target:state.ui.layoutTrayOpen ? '.layout-edge-palette' : '[data-action="toggle-layout-tray"]'};
  }
  if (state.ui.layoutMode) return {title:"つかんで置く、戻してしまう", detail:"右の押し入れから家具を部屋へ。戻すときは家具を押し入れまで運んで離そう。一覧は縦スワイプ、家具は横につかみ出せます。"};
  if (phase === "room") return {title:"猫の返事を見ながら、遊ぼう", detail:"あそぶの丸をつかみ、部屋で玩具を揺らしてみて。小さな♥が10回で大きな♥ひとつ。好きなものほど育つのが速く、苦手なら距離を取ります。"};
  const guides = {
    town:[getCat(state).status === "raising" ? "買い物へ、またはおうちへ" : "住宅街で猫を探そう", "地図の行き先をタップ。ステージ2以降はまだ未解放です。"],
    shop:["必要なものを買おう", "商品をタップして購入。地図へ戻るから、おうちにも帰れます。"],
    graduation:["旅立ちの準備を確認しよう", "心とからだの準備を確認。まだなら、もう1日一緒に過ごせます。"],
    result:["この子の旅立ちを見届けよう", "記録を残して街へ。次の出会いではチュートリアルは繰り返しません。"],
  };
  const [title, detail] = guides[phase] || ["次の一歩へ", "画面下のボタンから進めます。"];
  return {title, detail};
}

function decorateScreen(state) {
  if (state.campaign.phase === "story") return;
  const app = document.querySelector("#app");
  const host = app.querySelector(".stage") || app.firstElementChild;
  if (!host) return;
  const guide = getScreenGuide(state);
  const active = state.onboarding.status === "active";
  const expanded = state.ui.guideExpanded ?? active;
  host.insertAdjacentHTML("beforeend", `<aside class="screen-guide"><button class="guide-toggle" data-action="toggle-guide" aria-expanded="${expanded}"><small>${active ? "はじめてのガイド" : "いま、すること"} ${expanded ? "−" : "＋"}</small>${guide.title}</button>${expanded ? `<div class="guide-detail">${guide.detail}</div>` : ""}</aside>`);
  if (active && guide.target) app.querySelector(guide.target)?.classList.add("tutorial-focus");
}

function resumeCampaignTimers() {
  const phase = gameState.campaign.phase;
  if (phase === "field" && gameState.campaign.trapPlaced && gameState.campaign.bait.length && !gameState.campaign.trapReady) {
    const token = gameState.campaign.trapToken;
    window.setTimeout(() => dispatch({ type:"TRAP_READY", token }), 2600);
  }
  if (phase === "trapInspect" && !gameState.campaign.trapRevealDone) window.setTimeout(() => dispatch({ type:"FINISH_TRAP_REVEAL" }), 2800);
  if (phase === "clinic" && gameState.campaign.clinicStep === "exam") window.setTimeout(() => dispatch({ type:"FINISH_EXAM" }), 1900);
  if (phase === "intake" && gameState.campaign.intakeCalled) window.setTimeout(() => dispatch({ type:"ACCEPT_CAT" }), 1400);
}
