function getCapturedPose(cat) {
  if (cat.types.includes("hide") || cat.types.includes("solo")) return { id:"fear", note:"奥で身を小さくして、こちらを見ている" };
  if (cat.types.includes("prey") || cat.types.includes("food")) return { id:"eating", note:"周りを気にしながら、残った餌を食べている" };
  if (cat.types.includes("human") || cat.types.includes("touch")) return { id:"watch", note:"扉の近くで、じっとこちらを観察している" };
  return { id:"restless", note:"落ち着かず、保護器の中を行き来している" };
}

function renderTrapInspect(state, cat) {
  const pose = getCapturedPose(cat);
  const revealed = Boolean(state.campaign.trapRevealDone);
  const foodEmoji = { food_dry:"◉", food_wet:"🥫", food_fish:"🐟" };
  const trappedFood = state.campaign.bait.map(id => foodEmoji[id] || "◉").join("");
  const detail = revealed
    ? `<div class="capture-note"><span aria-hidden="true">${pose.id === "fear" ? "…" : pose.id === "eating" ? "◉" : pose.id === "watch" ? "👀" : "!!"}</span><strong>${pose.note}</strong></div>`
    : `<div class="capture-beat"><span>ガタ…</span></div>`;
  const body = `<section class="capture-inspect ${revealed ? "settled" : "revealing"} ${pose.id}"><div class="capture-cage"><div class="capture-cage-dark"></div><div class="capture-cat">${renderCatArt(cat)}</div><span class="capture-food">${trappedFood}</span><span class="capture-reveal-eyes">••</span><div class="capture-reveal-flash"></div><div class="capture-cage-cover"></div></div>${detail}</section>`;
  const footer = revealed ? `<button class="campaign-button" data-action="go-clinic">動物病院へ連れていく</button>` : "";
  return renderCampaignShell(state, "保護器", body, footer);
}

function renderClinic(state, cat) {
  const step = state.campaign.clinicStep || "exam";
  const nameDraft = String(state.campaign.nameDraft ?? cat.name ?? "");
  const safeNameDraft = nameDraft.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  if (step === "exam") {
    const body = `<section class="clinic-sequence"><div class="exam-room"><span class="exam-status">診察中…</span><div class="exam-table"></div><div class="exam-cat">${renderCatArt(cat)}</div><span class="vet-hand">🫱</span><span class="stethoscope">🩺</span></div></section>`;
    return renderCampaignShell(state, "動物病院", body, "");
  }
  if (step === "summary" || step === "result" || step === "receipt") {
    const body = `<section class="clinic-sequence"><article class="diagnosis-card clinic-summary-card"><div class="diagnosis-visual">${renderCatArt(cat)}</div><div class="diagnosis-copy"><small>初診結果</small><strong>大きな異常はありません</strong><p>少し緊張しています。静かな部屋で、キャリーから自分で出てくるのを待ちます。</p></div><section class="clinic-summary-receipt" aria-label="診療明細"><h2>診療明細</h2><div class="receipt"><div class="receipt-row"><span>検査・駆除</span><strong>400</strong></div><div class="receipt-row"><span>ワクチン</span><strong>300</strong></div><div class="receipt-row"><span>体重</span><strong>${cat.body.weight.toLocaleString("ja-JP")}g</strong></div><div class="receipt-row total"><span>診療費</span><strong>700</strong></div></div><div class="receipt-stamp">診察済</div></section></article></section>`;
    return renderCampaignShell(state, "動物病院", body, `<button class="campaign-button" data-action="start-naming">診察を終えて、名前を考える</button>`);
  }
  const body = `<section class="naming-scene"><div class="naming-portrait">${renderCatArt(cat)}</div><div class="naming-question"><small>あとから変えられないよ</small><h1>この子を、なんて呼ぼう</h1></div><input class="naming-input" id="campaign-cat-name" maxlength="8" value="${safeNameDraft}" placeholder="あとから変えられないよ" aria-label="猫の正式な名前"></section>`;
  return renderCampaignShell(state, "動物病院", body, `<button class="campaign-button" data-action="start-intake" ${nameDraft.trim() ? "" : "disabled"}>名前を決めて、おうちへ連れ帰る</button>`);
}

function renderIntake(state, cat) {
  const room = getRoom(state);
  const mood = getIntakeMood(state);
  const called = Boolean(state.campaign.intakeCalled);
  const callName = getCallName(cat);
  const strongLike = mood.liked.some(entry => entry.kind === "superMatch");
  const feedback = { essential:"ごはん皿とトイレが必要そう", concern:"苦手なものがありそう", more:"もう少しみたい" }[state.campaign.intakeFeedback] || "";
  const worldWidth = getWorldWidth(state);
  const callScene = called
    ? `<div class="intake-call-wave">${callName}…</div><div class="intake-emerging-cat">${renderCatArt(cat)}</div>`
    : `${mood.liked.length ? `<span class="intake-ambient-heart ${strongLike ? "strong" : ""}" aria-hidden="true">♥</span>` : ""}${feedback ? `<div class="intake-feedback" role="status">${feedback}</div>` : ""}`;
  return `<section class="game-frame layout-mode intake-layout" aria-label="${cat.name}を迎えるおうち">
    <header class="hud"><div class="hud-main"><span class="place-chip">おうち</span></div><div class="hud-side"><strong>${DAY_LABELS[state.week.dayOfWeek]}曜日</strong><span>💰 ${state.coins.toLocaleString("ja-JP")}</span></div></header>
    <section class="stage"><div class="room-world" style="width:${worldWidth * 100}%;left:-${state.ui.roomPan}%" data-room-world><div class="wall"></div><div class="floor"></div><div class="curtain left"></div><div class="curtain right"></div><div class="layout-zones" aria-hidden="true"><div class="layout-zone wall-zone"><span>壁に置くもの</span></div><div class="layout-zone floor-zone"><span>床に置くもの</span></div></div>${renderFixedWindow(state, CONFIG.stage1.clueCycle[0])}${getPlaced(room).map(placed => renderPlacedItem(placed, state, CONFIG.stage1.clueCycle[0])).join("")}<div class="room-carrier ${called ? "called" : ""} ${mood.disliked.length ? "uneasy" : ""}" aria-label="奥に置いた猫のキャリー"></div>${callScene}</div>
      ${called ? "" : state.ui.layoutTrayOpen ? renderLayoutPalette(state) : `<button class="layout-tray-toggle" data-action="toggle-layout-tray">家具</button>`}${renderDebugQuickbar(state, true)}${state.ui.debugIntakeOpen ? renderIntakeDebug(state) : ""}</section>
    <footer class="intake-footer">${called ? `${callName}が、キャリーから出てくる` : `<button class="intake-footer-call" data-action="call-intake-cat">「${callName}」と呼ぶ</button>`}</footer>
  </section>`;
}

function renderGraduation(state, cat) {
  const heartStage = getHeartStage(cat.heart);
  const ready = isGraduationReady(state);
  const body = `<div class="graduation-stage"><div class="graduation-cat">${renderCatArt(cat)}</div></div>
    <div class="readiness-list"><div class="readiness-row"><span>♡</span><span><strong>こころ</strong><small>${heartStage.label}・手帳のハートで確認</small></span><em>${cat.heart >= 60 ? "ご縁を探せる" : "まだ人がこわい"}</em></div>
      <div class="readiness-row"><span>⚖️</span><span><strong>からだ</strong><small>${cat.body.weight.toLocaleString("ja-JP")}g・健康状態</small></span><em>${ready ? "準備できた" : "もう少し"}</em></div></div>`;
  return renderCampaignShell(state, "譲渡会", body, `<button class="campaign-button" data-action="send-event" ${ready ? "" : "disabled"}>譲渡会へ送り出す</button><button class="campaign-button secondary" data-action="postpone-event">もう1日いっしょに過ごす</button>`);
}

function renderResult(state, cat) {
  const adopted = state.campaign.outcome === "adopted";
  const title = adopted ? "新しい家族ができた" : "元いた場所へ帰る";
  const lead = adopted
    ? `${cat.name}を気に入ってくれた方がいました。写真と記録は手帳に残ります。`
    : `${cat.name}は手術と耳先カットを終え、見守られている住宅街へ戻ります。これもひとつの卒業です。`;
  const scene = `<div class="result-scene ${adopted ? "adopted" : ""}"><span class="result-stamp">${adopted ? "譲渡" : "TNR"}</span>${adopted ? `<div class="result-person"></div>` : `<span class="ear-tip">♥</span>`}<div class="result-cat">${renderCatArt(cat)}</div></div>`;
  const body = `${scene}<div class="result-copy"><h1>${title}</h1><p>${lead}</p></div>`;
  return renderCampaignShell(state, adopted ? "譲渡" : "住宅街", body, `<button class="campaign-button" data-action="next-rescue">街へ戻り、次の保護へ</button>`);
}

function renderCampaign(state) {
  const cat = getCat(state);
  if (state.campaign.phase === "story") return renderOpeningStory(state);
  if (state.campaign.phase === "shop") return renderMapShop(state);
  if (state.campaign.phase === "field") return renderField(state);
  if (state.campaign.phase === "trapInspect") return renderTrapInspect(state, cat);
  if (state.campaign.phase === "clinic") return renderClinic(state, cat);
  if (state.campaign.phase === "intake") return renderIntake(state, cat);
  if (state.campaign.phase === "graduation") return renderGraduation(state, cat);
  if (state.campaign.phase === "result") return renderResult(state, cat);
  return renderTown(state);
}

function render(state) {
  if (titleScreenOpen) { document.querySelector("#app").innerHTML = renderTitle(state); return; }
  const cat = getCat(state);
  const room = getRoom(state);
  const clue = CONFIG.stage1.clueCycle[state.ui.clueIndex];
  const roam = getCatPoint(state);
  const food = getFood(state.ui.equippedFood);
  const app = document.querySelector("#app");
  if (state.campaign?.phase !== "room") {
    app.innerHTML = renderCampaign(state);
    decorateScreen(state);
    return;
  }
  const worldWidth = getWorldWidth(state);
  const catScreenX = Math.max(12, Math.min(88, roam.x * worldWidth - state.ui.roomPan));

  app.innerHTML = `
    <section class="game-frame ${state.ui.layoutMode ? "layout-mode" : ""}" aria-label="${CONFIG.game.title} 部屋画面モック">
      <header class="hud" aria-label="部屋情報">
        <div class="hud-main">
          <span class="place-chip">部屋</span>
        </div>
        <div class="hud-side">
          <strong>${DAY_LABELS[state.week.dayOfWeek]}曜日</strong>
          <span>💰 ${state.coins.toLocaleString("ja-JP")}</span>
        </div>
      </header>

      <section class="stage ${state.ui.reaction ? "responding" : ""}" aria-label="${cat.name}の部屋">
        <div class="room-world" style="width:${worldWidth * 100}%;left:-${state.ui.roomPan}%" data-room-world>
          <div class="wall"></div><div class="floor"></div>
          <div class="curtain left"></div><div class="curtain right"></div>
          ${state.ui.layoutMode ? `<div class="layout-zones" aria-hidden="true"><div class="layout-zone wall-zone"><span>壁に置くもの</span></div><div class="layout-zone floor-zone"><span>床に置くもの</span></div></div>` : ""}
          ${renderFixedWindow(state, clue)}

          ${getPlaced(room).map(placed => renderPlacedItem(placed, state, clue)).join("")}
          ${renderRoomLife(state, cat, food, roam)}
          ${state.ui.careAnimation ? renderCareAnimation(state.ui.careAnimation) : ""}
        </div>

        ${state.ui.layoutMode
          ? state.ui.layoutTrayOpen ? renderLayoutPalette(state) : `<button class="layout-tray-toggle" data-action="toggle-layout-tray">家具</button>`
          : renderCommandDock(state)}
        ${state.ui.playMode && state.ui.equippedHand ? renderPlayToy(state.ui.equippedHand) : ""}
        ${state.ui.catNameOpen && !state.ui.holdingCat ? `<button class="cat-name-chip" style="left:${catScreenX}%;top:${Math.max(12, roam.y - 16)}%" data-action="open-notebook">${cat.name}</button>` : ""}
        ${!state.ui.layoutMode && state.ui.holdingCat ? `<div class="held-cat holding-hands" data-action="release-cat" role="button" tabindex="0" aria-label="抱っこしている${cat.name}。タップして下ろす">${renderCatArt(cat)}</div>` : ""}
        ${state.ui.reaction ? renderReaction(state.ui.reaction, catScreenX, state.ui.holdingCat ? 39 : Math.max(15, roam.y - 18)) : ""}
        ${CONFIG.stage1.roomPanEnabled ? `<div class="pan-guide" aria-label="部屋の表示位置">
          <button class="${state.ui.roomPan < 50 ? "active" : ""}" data-action="pan-room" data-pan="0" aria-label="部屋の左側へ移動"></button>
          <button class="${state.ui.roomPan >= 50 ? "active" : ""}" data-action="pan-room" data-pan="${getMaxPan(state)}" aria-label="部屋の右側へ移動"></button>
        </div>` : ""}
        ${renderDebugQuickbar(state, true)}
        ${state.ui.modal === "notebook" ? renderNotebook(state, cat) : ""}
        ${state.ui.modal === "schedule" ? renderSchedule(state, cat) : ""}
        ${state.ui.modal === "outing" ? renderOuting(state) : ""}
        ${state.ui.modal === "inventory" ? renderInventory(state) : ""}
        ${state.ui.modal === "toolbox" ? renderToolbox(state) : ""}
        ${state.ui.modal === "shelf" ? renderShelf(state) : ""}
        ${state.ui.modal === "contact" ? renderContact(state) : ""}
        ${state.ui.modal === "relate" ? renderRelate(state) : ""}
        ${state.ui.modal === "cleaners" ? renderCleaners(state) : ""}
      </section>

      <footer class="controls">
        <nav class="bottom-menu" aria-label="部屋のメニュー">
          ${["inventoryMenu","layout","outing","schedule","notebook"].map(id => renderMenuIcon(id, state)).join("")}
        </nav>
      </footer>
    </section>`;
  decorateScreen(state);
  if (state.ui.modal === "schedule" && cat.body.days + 1 > 7) {
    window.requestAnimationFrame(() => {
      const scheduleScroll = app.querySelector("[data-schedule-scroll]");
      if (scheduleScroll) scheduleScroll.scrollTop = scheduleScroll.scrollHeight;
    });
  }
}

function renderRoomLife(state, cat, food, roam) {
  return `${!state.ui.layoutMode && cat.body.vomit ? `<div class="mess-object mess-${Math.min(3, Number(cat.body.vomit) || 1)}" data-action="tap-trouble" data-drop-target="clean" data-problem="vomit" role="button" tabindex="0" aria-label="吐いたあと。そうじ道具をここへ運んで片づける"></div>` : ""}
    ${state.ui.holdingCat ? "" : `<div class="cat-object walking ${state.ui.reaction ? "answering" : ""} ${state.ui.pickupResult === "fled" ? "fleeing" : ""}" style="left:${roam.x}%;top:${roam.y}%;transform:translate(-50%,-50%) scale(${roam.scale})"
      data-action="tap-cat" role="button" tabindex="0" aria-label="部屋の奥を歩いている${cat.name}">${renderCatArt(cat)}</div>`}`;
}

function renderCareAnimation(animation) {
  const kind = animation.operation === "food" ? "food" : "clean";
  return `<div class="care-animation ${kind}" style="left:${animation.x}%;top:${animation.y}%" role="status" aria-label="お世話中">
    <span class="care-hand">${animation.emoji}</span><span class="care-spark">✨</span>
  </div>`;
}

function renderPlayToy(itemId) {
  const emoji = { mouse:"🐭", feather:"🪶", ball:"⚪" }[itemId] || "🐭";
  return `<div class="play-toy" data-play-toy aria-hidden="true">${emoji}</div>`;
}

function renderFixedWindow(state, clue) {
  const showClue = !state.ui.layoutMode && !state.ui.clueFound && clue.itemId === "window";
  return `<div class="item-window fixed-window season-${state.season}" aria-label="${CONFIG.seasons[state.season].label}の景色が見える窓"><span class="window-weather"></span></div>
    ${showClue ? `<div class="clue-marker hair" style="left:69%;top:31%" data-action="tap-clue" role="button" tabindex="0" aria-label="窓辺に残った毛"></div>` : ""}`;
}

function renderCatArt(cat) {
  return `<div class="cat-fallback" aria-hidden="true">
    <div class="cat-tail"></div><div class="cat-body"></div><div class="cat-head"></div>
    <div class="cat-eyes">••</div><div class="cat-muzzle">ω</div>
  </div><img class="cat-img" src="assets/cat/${cat.pattern}_${cat.age}.png" alt="" onerror="this.style.display='none'">`;
}

function renderPlacedItem(placed, state, clue) {
  const item = getItem(placed.itemId);
  const cat = getCat(state);
  const isClue = !state.ui.layoutMode && !state.ui.clueFound && clue.itemId === placed.itemId;
  const brokenItemId = getBrokenItemId(cat);
  const broken = brokenItemId === placed.itemId;
  const damageLevel = broken ? getProblemLevel(cat, "broken") : 0;
  const durability = getDurabilityView(state, placed.itemId);
  const wearLevel = durability.max ? (durability.ratio <= 0 ? 3 : durability.ratio <= .3 ? 2 : durability.ratio <= .65 ? 1 : 0) : 0;
  const layout = state.ui.layoutMode;
  const careProblem = placed.itemId === "bowl" ? "hunger" : placed.itemId === "litter" ? "litter" : null;
  const itemAction = broken && !layout
    ? `data-action="tap-trouble" data-problem="broken"`
    : !layout && careProblem ? `data-action="tap-trouble" data-problem="${careProblem}"` : "";
  const dropTarget = layout ? ""
    : broken ? `data-drop-target="clean" data-problem="broken"`
    : placed.itemId === "bowl" ? `data-drop-target="food" data-problem="hunger"`
    : placed.itemId === "litter" ? `data-drop-target="clean" data-problem="litter"`
    : "";
  const statusClass = layout ? ""
    : placed.itemId === "bowl" ? (cat.body.hunger ? "empty" : "fixed")
    : placed.itemId === "litter" ? (cat.body.litter ? `dirty dirt-${Math.min(3, Number(cat.body.litter) || 1)}` : "fixed") : "";
  const drag = layout ? `data-layout-item="${placed.itemId}"` : "";
  const itemHtml = `<div class="placed-item item-${placed.itemId} ${item.zone === "wall" ? "wall-placement" : "floor-placement"} ${statusClass} wear-${wearLevel} ${broken ? `broken damage-${damageLevel}` : ""}"
      style="left:${placed.x}%;top:${placed.y}%;right:auto;bottom:auto" ${itemAction} ${drag}
      ${dropTarget} role="button" tabindex="0" aria-label="${item.label}${!broken && !layout && placed.itemId === "bowl" && cat.body.hunger ? "。ごはんをここへ運んで補充" : ""}${!broken && !layout && placed.itemId === "litter" && cat.body.litter ? "。そうじ道具をここへ運んで掃除" : ""}${broken ? "。そうじ道具をここへ運んで手入れする" : ""}">${broken ? `<span class="damage-visual" aria-hidden="true"></span>` : ""}</div>`;
  const clueKind = clue.itemId === "plant" ? "soil" : clue.itemId === "tower" ? "scratch" : "hair";
  const cluePosition = clue.itemId === "plant"
    ? { x:Math.min(93, placed.x + 12), y:Math.min(88, placed.y + 24) }
    : clue.itemId === "tower" ? { x:Math.min(92, placed.x + 8), y:Math.min(84, placed.y + 12) }
    : { x:Math.min(91, placed.x + 9), y:Math.min(86, placed.y + 4) };
  const clueHtml = isClue ? `<div class="clue-marker ${clueKind}" style="left:${cluePosition.x}%;top:${cluePosition.y}%"
      data-action="tap-clue" role="button" tabindex="0" aria-label="部屋に残った猫の痕跡"></div>` : "";
  return itemHtml + clueHtml;
}

function renderReaction(reaction, x, y) {
  if (reaction.visual === "hearts") {
    return `<div class="play-heart-burst" style="left:${x}%;top:${y}%" role="status" aria-label="心が上がった">
      <i>♥</i><i>♥</i><i>♥</i>
    </div>`;
  }
  const action = reaction.operation === "name" ? `data-action="open-notebook" role="button" tabindex="0"` : `role="status"`;
  return `<div class="reaction ${reaction.kind} ${reaction.operation === "name" ? "name-reaction" : ""}" style="left:${x}%;top:${y}%;bottom:auto" ${action}>
    <strong>${reaction.title}</strong></div>`;
}

function renderMenuIcon(id, state) {
  const meta = TOOL_META[id];
  const action = ({ inventoryMenu:"open-inventory", layout:"toggle-layout", outing:"open-outing", schedule:"open-schedule", notebook:"open-notebook" })[id];
  const selected = state.ui.modal === ({ inventoryMenu:"inventory", outing:"outing", schedule:"schedule", notebook:"notebook" }[id]) || (id === "layout" && state.ui.layoutMode) ? "selected" : "";
  return `<button class="tool-icon ${selected}" data-action="${action}">
    <span class="emoji" aria-hidden="true">${meta.emoji}</span>
    <span class="label">${meta.label || "手帳"}</span>
    <span class="kind">${meta.kind}</span>
  </button>`;
}

function renderCommandDock(state) {
  const hand = state.ui.equippedHand ? getItem(state.ui.equippedHand) : null;
  const contact = state.ui.equippedContact;
  const callName = getCallName(getCat(state));
  const catCommand = contact
    ? { label:{ call:"呼ぶ", pet:"撫でる", pickup:"抱っこ" }[contact], emoji:{ call:"📣", pet:"✋", pickup:"🤲" }[contact], detail:contact === "call" ? callName : "猫" }
    : hand
      ? { label:hand.label, emoji:{ mouse:"🐭", feather:"🪶", ball:"⚪" }[hand.id] || "🐭", detail:`${getDurability(state, hand.id)}/${getMaxDurability(hand.id)}` }
      : { label:"未選択", emoji:"＋", detail:"猫" };
  const food = getFood(state.ui.equippedFood);
  const cleaner = getCleaner(state.ui.equippedCleaner);
  const cleanerUses = cleaner ? state.inventory[cleaner.id] || 0 : 0;
  return `<nav class="command-dock" aria-label="部屋で使うもの">
    <button class="command-slot ${catCommand.label === "未選択" ? "empty" : ""}" data-action="open-slot-menu" data-tab="play" data-command="cat" data-slot-label="あそぶ" aria-label="あそぶ。${catCommand.label}。短く押して入れ替え、ドラッグで使う">
      <span class="command-emoji">${catCommand.emoji}</span><strong>${catCommand.label}</strong><small>${catCommand.detail}</small>
    </button>
    <button class="command-slot" data-action="open-slot-menu" data-tab="food" data-command="food" data-slot-label="ごはん" aria-label="ごはん。${food.label}。短く押して入れ替え、ドラッグで補充">
      <span class="command-emoji">${food.emoji}</span><strong>${food.label}</strong><small>×${state.inventory[food.id] || 0}</small>
    </button>
    <button class="command-slot ${cleanerUses ? "" : "empty"}" data-action="open-slot-menu" data-tab="clean" data-command="clean" data-slot-label="そうじ" aria-label="そうじ。${cleaner?.label || "未選択"}。短く押して入れ替え、ドラッグで使う">
      <span class="command-emoji">${cleaner?.emoji || "＋"}</span><strong>${cleaner?.label || "未選択"}</strong><small>×${cleanerUses}</small>
    </button>
  </nav>`;
}

function renderLayoutTray(state) {
  const room = getRoom(state);
  const active = new Set(getPlaced(room).map(placed => placed.itemId));
  const filter = state.ui.layoutFilter || "all";
  const ids = CONFIG.stage1.placedItems.filter(id => filter === "all" || getItem(id)?.zone === filter);
  const filters = [{id:"all",label:"全部"},{id:"floor",label:"床"},{id:"wall",label:"壁"}];
  const filterBar = `<div class="layout-filter-bar"><span>押し入れ ${ids.length}個</span>${filters.map(option => `<button class="${filter === option.id ? "active" : ""}" data-action="set-layout-filter" data-filter="${option.id}">${option.label}</button>`).join("")}<button class="layout-tray-close" data-action="toggle-layout-tray">閉じる</button></div>`;
  return filterBar + ids.map(id => {
    const item = getItem(id);
    const placement = item.zone === "wall" ? "壁" : "床";
    const durability = getDurabilityView(state, id);
    return `<button class="tool-icon ${item.zone === "wall" ? "wall-item" : "floor-item"} ${active.has(id) ? "selected" : ""} ${durability.current ? "" : "unavailable"}" data-action="toggle-placed" data-item="${id}">
      <span class="placement-badge">${placement}</span>

  return `だいたい${years}歳`;
}

function renderHeartVisual(cat) {
  const hearts = Array.from({ length:10 }, (_, index) => {
    const start = index * 10;
    const end = start + 10;
    const fill = Math.max(0, Math.min(1, (cat.heart - start) / 10));
    const available = end <= cat.heartCap;
    const overflow = fill > 0 && end > cat.heartCap;
    const className = fill >= 1 ? "filled" : available ? "available" : "locked";
    return `<span class="heart-slot ${className} ${overflow ? "overflow" : ""}" style="--fill:${Math.round(fill * 100)}%" aria-hidden="true">♥<i class="heart-fill">♥</i></span>`;
  }).join("");
  return `<section class="heart-visual" aria-label="心の育ち方"><small>こころ</small><div class="heart-row">${hearts}</div></section>`;
}

function renderWeightChart(state, cat) {
  const values = [...(cat.body.weightHistory || []), cat.body.weight];
  const min = Math.min(...values) - 2;
  const max = Math.max(...values) + 2;
  const span = Math.max(1, max - min);
  const dayStep = 100 / 6;
  const chartWidth = Math.max(100, (values.length - 1) * dayStep);
  const pointsData = values.map((value, index) => ({ value, x:index * dayStep, y:48 - ((value - min) / span) * 38 }));
  const points = pointsData.map(point => `${point.x},${point.y}`).join(" ");
  const selectedIndex = Math.max(0, Math.min(values.length - 1, Number.isInteger(state.ui.weightPeek) ? state.ui.weightPeek : values.length - 1));
  const selected = pointsData[selectedIndex];
  const pointElements = pointsData.map((point, index) => `<g class="weight-point ${index === selectedIndex ? "selected" : ""}" data-action="show-weight" data-index="${index}" role="button" tabindex="0" aria-label="${index + 1}日目 ${point.value}グラム"><circle class="hit" cx="${point.x}" cy="${point.y}" r="6"></circle><circle class="dot" cx="${point.x}" cy="${point.y}" r="2.6"></circle></g>`).join("");
  return `<section class="body-chart" aria-label="体重の推移">
    <div class="body-chart-head"><small>からだ・迎えた日から</small><strong>${selected.value.toLocaleString("ja-JP")}g <small>${selectedIndex + 1}日目</small></strong></div>
    <div class="weight-scroll"><div class="weight-canvas" style="width:${chartWidth}%">
      <svg viewBox="0 0 ${chartWidth} 54" preserveAspectRatio="none"><path d="M0 50 H${chartWidth}" stroke="#d9d0cc" stroke-width="1" fill="none"/><polyline points="${points}" stroke="#d36c82" stroke-width="2.2" fill="none" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>${pointElements}</svg>
      <div class="chart-days"><span>1日目</span><span>${Math.max(7, values.length)}日目</span></div>
    </div></div>
  </section>`;
}

function renderSchedule(state, cat) {
  const today = cat.body.days + 1;
  const eventDay = CONFIG.stage1.adoptionEventDay;
  const remaining = eventDay - today;
  const goalText = remaining > 0 ? `あと${remaining}日` : remaining === 0 ? "今日" : "開催できる状態";
  const ready = isGraduationReady(state);
  const intro = Boolean(state.ui.scheduleIntro);
  const logs = cat.lifeLog || [];
  const firstLog = logs.find(entry => entry.day === 1) || { title:`${cat.name}と生活開始`, note:"おうちに迎えた日" };
  const visibleEndDay = Math.max(eventDay, Math.ceil(today / 7) * 7);
  const days = Array.from({ length:visibleEndDay }, (_, index) => index + 1).map(day => {
    const isToday = day === today;
    const isPast = day < today;
    const isGoal = day === eventDay;
    const log = logs.find(entry => entry.day === day);
    const noteworthy = Boolean(log) || isToday || isGoal;
    const title = log ? log.title : day === 1 ? firstLog.title
      : isGoal ? "譲渡会"
        : isToday ? "いっしょに暮らしている"
          : isPast ? "記録なし" : "予定なし";
    const note = log ? log.note : day === 1 ? firstLog.note
      : isGoal ? goalText
        : isToday ? "心とからだを育てる"
          : "";
    const classes = ["timeline-card", noteworthy ? "" : "quiet", isToday ? "today" : "", day > today ? "future" : ""].filter(Boolean).join(" ");
    const dayLabel = `${day}日目${isToday ? "・今日" : ""}${isGoal ? "・目標" : ""}`;
    return `<div class="${classes}"><small>${dayLabel}</small><strong>${title}</strong><span>${note}</span></div>`;
  }).join("");
  return `<div class="modal-layer schedule-modal" aria-modal="true" role="dialog" aria-label="保護生活の予定">
    <section class="simple-panel schedule-panel"><header class="sheet-head"><small>季節が変わっても、この日数は続きます</small><h2>保護生活 ${today}日目</h2></header>
      <div class="simple-panel-body schedule-scroll" data-schedule-scroll><div class="timeline schedule-timeline">${days}</div><div class="schedule-actions">${intro
        ? `<button class="campaign-button" data-action="close-schedule-intro">${cat.name}との生活をはじめる</button>`
        : today >= eventDay
        ? `<button class="campaign-button" data-action="go-event" ${ready ? "" : "disabled"}>${ready ? "譲渡会へ向かう" : "からだの準備を待つ"}</button>`
        : `<button class="campaign-button" data-action="end-day">今日はここまで</button>`}
        ${intro ? "" : `<button class="campaign-button secondary" data-action="close-modal">部屋へ戻る</button>`}</div></div>
    </section>
  </div>`;
}

const app = document.querySelector("#app");

app.addEventListener("click", event => {
  if (Date.now() < suppressClickUntil) return;
  const target = event.target.closest("[data-action]");
  if (!target) return;
  const action = target.dataset.action;
  if (action === "start-game") { titleScreenOpen = false; dispatch({ type:"START_GAME" }); resumeCampaignTimers(); return; }
  if (action === "next-story") dispatch({ type:"NEXT_STORY" });
  if (action === "previous-story") dispatch({ type:"PREVIOUS_STORY" });
  if (action === "toggle-guide") dispatch({ type:"TOGGLE_GUIDE" });
  if (action === "reset-save") {

app.addEventListener("input", event => {
  if (event.target.id !== "campaign-cat-name") return;
  gameState.campaign.nameDraft = event.target.value;
  saveGameState(gameState);
  const button = app.querySelector('[data-action="start-intake"]');
  if (button) button.disabled = !String(event.target.value || "").trim();
});

let dragDraft = null;
let panDraft = null;
let playDraft = null;
let commandDraft = null;
let fieldDragDraft = null;
let suppressClickUntil = 0;
let debugHoldTimer = null;
let debugHoldDraft = null;

app.addEventListener("pointerdown", event => {
  const debugTarget = event.target.closest("[data-debug-hold]");
  if (debugTarget) {
    debugHoldDraft = { x:event.clientX, y:event.clientY };
    debugHoldTimer = window.setTimeout(() => {
      debugHoldTimer = null;
      debugHoldDraft = null;
      dispatch({ type:"TOGGLE_DEBUG" });
    }, 3000);
    return;
  }

  const fieldSource = event.target.closest("[data-field-drag]");
  if (fieldSource && gameState.campaign.phase === "field") {
    event.preventDefault();
    const kind = fieldSource.dataset.fieldDrag;
    const emoji = kind === "trap" ? "▥" : { food_dry:"◉", food_wet:"🥫", food_fish:"🐟" }[fieldSource.dataset.food] || "●";
    const ghost = document.createElement("div");
    ghost.className = "field-drag-ghost";
    ghost.textContent = emoji;
    ghost.style.left = `${event.clientX}px`;
    ghost.style.top = `${event.clientY}px`;
    document.body.appendChild(ghost);
    const dropTarget = kind === "trap" ? app.querySelector("[data-field-drop='scene']") : app.querySelector(".trap");
    dropTarget?.classList.add("drop-ready");
    fieldDragDraft = { kind, ghost, dropTarget, foodId:fieldSource.dataset.food, trapId:fieldSource.dataset.trap };
    fieldSource.setPointerCapture?.(event.pointerId);
    return;
  }

  const equipSource = event.target.closest("[data-drag-equip]");
  if (equipSource && !gameState.ui.layoutMode && !gameState.ui.careAnimation) {
    const kind = equipSource.dataset.dragEquip;
    const command = kind === "food" ? "food" : kind === "clean" ? "clean" : "cat";
    commandDraft = makeCommandDraft(event, equipSource, command, {
      fromInventory:true,
      itemId:equipSource.dataset.item,
      contactId:kind === "contact" ? equipSource.dataset.item : null,
    });
    equipSource.setPointerCapture?.(event.pointerId);
    return;
  }

  const commandTarget = event.target.closest("[data-command]");
  if (commandTarget && !gameState.ui.layoutMode && !gameState.ui.modal && !gameState.ui.careAnimation) {
    commandDraft = makeCommandDraft(event, commandTarget, commandTarget.dataset.command, {
      itemId:commandTarget.dataset.command === "cat" ? gameState.ui.equippedHand : commandTarget.dataset.command === "food" ? gameState.ui.equippedFood : gameState.ui.equippedCleaner,
      contactId:commandTarget.dataset.command === "cat" ? gameState.ui.equippedContact : null,
    });
    commandTarget.setPointerCapture?.(event.pointerId);
    return;
  }

  const target = event.target.closest("[data-layout-item], .layout-palette-item");
  if (target && gameState.ui.layoutMode && !(gameState.campaign.phase === "intake" && gameState.campaign.intakeCalled)) {
    const stage = target.closest(".stage");
    const world = stage?.querySelector("[data-room-world]");
    if (!stage || !world) return;
    event.preventDefault();
    const fromPalette = target.matches(".layout-palette-item");
    const itemId = target.dataset.layoutItem || target.dataset.item;
    const item = getItem(itemId);
    if (fromPalette && getDurability(gameState, itemId) <= 0) return;
    const placed = getPlaced(getRoom(gameState)).find(entry => entry.itemId === itemId);
    const stageRect = stage.getBoundingClientRect();
    const worldRect = world.getBoundingClientRect();
    const targetRect = target.getBoundingClientRect();
    dragDraft = {
      target, itemId, zone:item.zone, stage, world, stageRect, worldRect, fromPalette,
      startX:event.clientX, startY:event.clientY, pointerType:event.pointerType, pointerId:event.pointerId,
      offsetX:fromPalette ? null : event.clientX-targetRect.left,
      offsetY:fromPalette ? null : event.clientY-targetRect.top,
      scroll:target.closest('.layout-edge-scroll'), scrollTop:target.closest('.layout-edge-scroll')?.scrollTop || 0,
      moved:false, scrolling:false, valid:false, store:false,
      x:placed?.x ?? CONFIG.stage1.defaultLayout[itemId].x,
      y:placed?.y ?? CONFIG.stage1.defaultLayout[itemId].y,
    };
    app.setPointerCapture(event.pointerId);
    return;
  }

  if (gameState.ui.playMode && event.target.closest(".stage") && !event.target.closest("[data-action], .modal-layer")) {
    const stage = event.target.closest(".stage");
    const rect = stage.getBoundingClientRect();
    const toy = stage.querySelector("[data-play-toy]");
    const catElement = stage.querySelector(".cat-object");
    if (!toy) return;
    event.preventDefault();
    playDraft = { rect, toy, catElement, startX:event.clientX, startY:event.clientY, moved:false };
    toy.classList.add("active");
    movePlayObjects(event.clientX, event.clientY);
    return;
  }

  if (event.target.closest("[data-action], .placed-item, .cat-object, .trouble-object, .clue-marker, .mess-object, .held-cat")) return;
  if (!CONFIG.stage1.roomPanEnabled) return;
  const stage = event.target.closest(".stage");
  const world = stage?.querySelector("[data-room-world]");
  if (!stage || !world) return;
  event.preventDefault();
  const rect = stage.getBoundingClientRect();
  panDraft = { startX:event.clientX, startPan:gameState.ui.roomPan, pan:gameState.ui.roomPan, maxPan:getMaxPan(gameState), rect, world };
  world.classList.add("dragging");
});

app.addEventListener("pointermove", event => {
  if (fieldDragDraft) {
    event.preventDefault();
    fieldDragDraft.ghost.style.left = `${event.clientX}px`;
    fieldDragDraft.ghost.style.top = `${event.clientY}px`;
    return;
  }
  if (debugHoldTimer && debugHoldDraft && Math.hypot(event.clientX - debugHoldDraft.x, event.clientY - debugHoldDraft.y) > 10) {
    window.clearTimeout(debugHoldTimer);
    debugHoldTimer = null;
    debugHoldDraft = null;
  }
  if (commandDraft) {
    const distance = Math.hypot(event.clientX - commandDraft.startX, event.clientY - commandDraft.startY);
    if (!commandDraft.moved && distance <= 8) return;
    event.preventDefault();
    if (!commandDraft.moved) startCommandDrag(commandDraft, event.clientX, event.clientY);
    commandDraft.moved = true;
    moveCommandDrag(commandDraft, event.clientX, event.clientY);
    return;
  }
  if (playDraft) {
    event.preventDefault();
    playDraft.moved = playDraft.moved || Math.hypot(event.clientX - playDraft.startX, event.clientY - playDraft.startY) > 8;
    movePlayObjects(event.clientX, event.clientY);
    return;
  }
  if (dragDraft) {
    event.preventDefault();
    moveLayoutDrag(dragDraft, event.clientX, event.clientY);
    return;
  }
  if (panDraft) {
    event.preventDefault();
    const delta = ((panDraft.startX - event.clientX) / panDraft.rect.width) * 100;
    panDraft.pan = Math.max(0, Math.min(panDraft.maxPan, panDraft.startPan + delta));
    panDraft.world.style.left = `-${panDraft.pan}%`;
  }
});

app.addEventListener("pointerup", event => {
  if (debugHoldTimer) {
    window.clearTimeout(debugHoldTimer);
    debugHoldTimer = null;
  }
  debugHoldDraft = null;
  if (fieldDragDraft) {
    const draft = fieldDragDraft;
    fieldDragDraft = null;
    const dropRect = draft.dropTarget?.getBoundingClientRect();
    const valid = Boolean(dropRect && event.clientX >= dropRect.left && event.clientX <= dropRect.right && event.clientY >= dropRect.top && event.clientY <= dropRect.bottom);
    draft.dropTarget?.classList.remove("drop-ready");
    draft.ghost.remove();
    if (valid && draft.kind === "trap") {
      const sceneRect = dropRect;
      dispatch({ type:"FIELD_PLACE_TRAP", trapId:draft.trapId, x:Math.max(20, Math.min(80, ((event.clientX - sceneRect.left) / sceneRect.width) * 100)), y:Math.max(55, Math.min(78, ((event.clientY - sceneRect.top) / sceneRect.height) * 100)) });
    }
    if (valid && draft.kind === "bait") dispatch({ type:"FIELD_ADD_BAIT", foodId:draft.foodId, token:Date.now() });
    return;
  }
  if (commandDraft) {
    const draft = commandDraft;
    commandDraft = null;
    if (draft.moved) {
      event.preventDefault();
      suppressClickUntil = Date.now() + 350;
      completeCommandDrag(draft, event.clientX, event.clientY);
    }
    return;
  }
  if (playDraft) {
    playDraft = null;
    dispatch({ type:"FINISH_PLAY" });
    return;
  }
  if (dragDraft) {
    const draft = dragDraft;
    dragDraft = null;
    if (draft.moved || draft.scrolling) suppressClickUntil = Date.now() + 350;
    if (draft.moved) moveLayoutDrag(draft, event.clientX, event.clientY);
    clearLayoutDrag(draft);
    if (draft.moved && draft.valid) dispatch({ type:"DROP_LAYOUT_ITEM", itemId:draft.itemId, x:draft.x, y:draft.y, store:draft.store });
    return;
  }
  if (panDraft) {
    const draft = panDraft;
    panDraft = null;
    draft.world.classList.remove("dragging");
    dispatch({ type:"SET_ROOM_PAN", pan:Math.round(draft.pan) });
  }
});

app.addEventListener("pointercancel", () => {
  if (debugHoldTimer) window.clearTimeout(debugHoldTimer);
  debugHoldTimer = null;
  debugHoldDraft = null;
  if (fieldDragDraft) {
    fieldDragDraft.dropTarget?.classList.remove("drop-ready");
    fieldDragDraft.ghost?.remove();
  }
  fieldDragDraft = null;
  if (commandDraft) clearCommandDrag(commandDraft, false);
  commandDraft = null;
  playDraft = null;
  if (dragDraft) clearLayoutDrag(dragDraft);
  dragDraft = null;
  if (panDraft?.world) panDraft.world.classList.remove("dragging");
  panDraft = null;
  render(gameState);
});

function moveLayoutDrag(draft, clientX, clientY) {
  const dx=clientX-draft.startX, dy=clientY-draft.startY;
  if (!draft.moved && !draft.scrolling && Math.hypot(dx,dy)<8) return;
  // スマホでは押し入れを縦にスワイプすると一覧、横につかみ出すと家具を操作。
  if (!draft.moved && draft.fromPalette && draft.pointerType === 'touch' && (draft.scrolling || Math.abs(dy)>Math.abs(dx)*1.2)) {
    draft.scrolling=true;
    draft.scroll.scrollTop=draft.scrollTop-dy;
    return;
  }
  if (!draft.moved) {
    draft.moved=true;
    const template=document.createElement('template');
    template.innerHTML=renderPlacedItem({itemId:draft.itemId,x:draft.x,y:draft.y},gameState,CONFIG.stage1.clueCycle[0]);
    draft.ghost=template.content.firstElementChild;
    draft.ghost.removeAttribute('data-layout-item');
    draft.ghost.removeAttribute('tabindex');
    draft.ghost.setAttribute('aria-hidden','true');
    draft.ghost.classList.add('layout-drag-preview');
    draft.world.appendChild(draft.ghost);
    const bounds=draft.ghost.getBoundingClientRect();
    draft.width=bounds.width;draft.height=bounds.height;
    draft.offsetX ??= bounds.width/2;draft.offsetY ??= bounds.height/2;
    draft.origin=draft.world.querySelector(`[data-layout-item="${draft.itemId}"]`);
    draft.origin?.classList.add('layout-lift-origin');
    draft.stage.classList.add('layout-dragging');
    draft.storage=draft.stage.querySelector('.layout-edge-palette, .layout-tray-toggle');
    draft.storage?.classList.add('drop-storage');
    draft.hint=document.createElement('div');draft.hint.className='layout-drop-hint';draft.hint.setAttribute('role','status');draft.stage.appendChild(draft.hint);
  }
  const inside=(rect)=>rect && clientX>=rect.left && clientX<=rect.right && clientY>=rect.top && clientY<=rect.bottom;
  draft.store=Boolean(inside(draft.storage?.getBoundingClientRect()));
  const rect=draft.stageRect, world=draft.worldRect;
  const width=draft.width/world.width*100,height=draft.height/rect.height*100;
  const rawX=(clientX-world.left-draft.offsetX)/world.width*100;
  const rawY=(clientY-rect.top-draft.offsetY)/rect.height*100;
  // 背の高い床家具も、つかんだ位置ではなく足元で床に接しているか判定。
  const floor=rawY+height>=59;
  const minY=draft.zone==='wall'?7:Math.max(9,61-height);
  const maxY=draft.zone==='wall'?Math.max(minY,57-height):Math.max(minY,98-height);
  draft.x=Math.round(Math.max(2,Math.min(98-width,rawX)));
  draft.y=Math.round(Math.max(minY,Math.min(maxY,rawY)));
  draft.valid=draft.store || (inside(rect) && (draft.zone==='floor'?floor:!floor));
  draft.ghost.style.left=`${draft.x}%`;draft.ghost.style.top=`${draft.y}%`;
  draft.ghost.classList.toggle('invalid',!draft.valid);
  draft.ghost.style.visibility=draft.store?'hidden':'';
  draft.storage?.classList.toggle('drop-storage-active',draft.store);
  draft.hint.textContent=draft.store?'離して押し入れに戻す':draft.valid?'離してここに置く':`置けるのは${draft.zone==='wall'?'壁':'床'}。右の押し入れへ戻せます`;
}

function clearLayoutDrag(draft) {
  draft.ghost?.remove();draft.hint?.remove();
  draft.origin?.classList.remove('layout-lift-origin');
  draft.stage.classList.remove('layout-dragging');
  draft.storage?.classList.remove('drop-storage','drop-storage-active');
  if(app.hasPointerCapture(draft.pointerId)) app.releasePointerCapture(draft.pointerId);
}

function makeCommandDraft(event, target, command, extra = {}) {
  const rect = target.getBoundingClientRect();
  return {
    pointerId:event.pointerId,
    command,
    target,
    origin:{ x:rect.left + rect.width / 2, y:rect.top + rect.height / 2 },
    startX:event.clientX,
    startY:event.clientY,
    moved:false,
    valid:false,
    dropElement:null,
    ghost:null,
    totalDistance:0,
    peakSpeed:0,
    fastMs:0,
    slowMs:0,
    heartEarned:0,
    heartProgressMs:0,
    lastMoveAt:performance.now(),
    lastClientX:event.clientX,
    lastClientY:event.clientY,
    liveAnchorIndex:CONFIG.stage1.roamPoints.indexOf(getRoamPoint(gameState)),
    lastCatMoveAt:0,
    ...extra,
  };
}

function startCommandDrag(draft, clientX, clientY) {
  const emoji = draft.target.querySelector(".command-emoji, .big-emoji")?.textContent || "●";
  const ghost = document.createElement("div");
  ghost.className = "command-ghost";
  ghost.textContent = emoji;
  ghost.style.left = `${clientX}px`;
  ghost.style.top = `${clientY}px`;
  document.body.appendChild(ghost);
  draft.ghost = ghost;
  if (draft.fromInventory) draft.target.closest(".modal-layer")?.classList.add("dragging-source");
  const selector = draft.command === "food"
    ? '[data-drop-target="food"]'
    : draft.command === "clean"
      ? '[data-drop-target="clean"]'
      : draft.contactId ? ".cat-object, .held-cat" : draft.itemId ? ".stage" : null;
  draft.readyElements = selector ? [...document.querySelectorAll(selector)] : [];
  draft.readyElements.forEach(element => element.classList.add("drop-ready"));
}

function moveCommandDrag(draft, clientX, clientY) {
  if (!draft.ghost) return;
  draft.ghost.style.left = `${clientX}px`;
  draft.ghost.style.top = `${clientY}px`;
  draft.readyElements?.forEach(element => element.classList.remove("drop-hover"));
  const point = document.elementFromPoint(clientX, clientY);
  let dropElement = null;
  if (draft.command === "food") dropElement = point?.closest?.('[data-drop-target="food"]');
  if (draft.command === "clean") dropElement = point?.closest?.('[data-drop-target="clean"]');
  if (draft.command === "cat") {
    dropElement = draft.contactId
      ? point?.closest?.(".cat-object, .held-cat")
      : draft.itemId ? point?.closest?.(".stage") : null;
  }
  draft.dropElement = dropElement;
  draft.valid = Boolean(dropElement);
  if (!draft.valid) document.querySelector(".live-heart-meter")?.remove();
  draft.ghost.classList.toggle("invalid", !draft.valid);
  dropElement?.classList.add("drop-hover");
  if (draft.command === "cat" && draft.itemId && !draft.contactId) updateLiveToyPlay(draft, clientX, clientY);
}

function completeCommandDrag(draft, clientX, clientY) {
  clearCommandDrag(draft, draft.valid);
  if (!draft.valid) {
    dispatch({ type:"COMMAND_MISS", message:draft.command === "food"
      ? "ごはんは、お皿まで運ぶと補充できる"
      : draft.command === "clean" ? "そうじ道具は、汚れている場所まで運ぼう" : `猫へのアクションは、部屋か${getCallName(getCat(gameState))}まで運ぼう` });
    return;
  }
  if (draft.command === "food") {
    dispatch({ type:"START_CARE", operation:"food", foodId:draft.itemId });
    return;
  }
  if (draft.command === "clean") {
    dispatch({ type:"START_CARE", operation:"clean", cleanerId:draft.itemId, problem:draft.dropElement.dataset.problem });
    return;
  }
  if (draft.contactId) {
    dispatch({ type:"EXECUTE_CONTACT", contact:draft.contactId });
    return;
  }
  const stageRect = draft.dropElement.getBoundingClientRect();
  const motionLabel = draft.fastMs > draft.slowMs * 1.2
    ? "速い動きを追いかけた"
    : draft.slowMs > draft.fastMs * 1.4 ? "ゆっくり揺れる玩具を見つめた" : "動きの変化に反応した";
  dispatch({ type:"FINISH_PLAY", live:true, itemId:draft.itemId, anchorIndex:draft.liveAnchorIndex, motionLabel, liveHeartGain:draft.heartEarned,
    x:Math.max(5, Math.min(95, ((clientX - stageRect.left) / stageRect.width) * 100)),
    y:Math.max(12, Math.min(85, ((clientY - stageRect.top) / stageRect.height) * 100)),
  });
}

function clearCommandDrag(draft, accepted) {
  document.querySelector(".live-heart-meter")?.remove();
  draft.readyElements?.forEach(element => element.classList.remove("drop-ready", "drop-hover"));
  draft.target.closest(".modal-layer")?.classList.remove("dragging-source");
  if (!draft.ghost) return;
  if (accepted || typeof draft.ghost.animate !== "function") {
    draft.ghost.remove();
    return;
  }
  const ghost = draft.ghost;
  const animation = ghost.animate([
    { left:ghost.style.left, top:ghost.style.top, opacity:1 },
    { left:`${draft.origin.x}px`, top:`${draft.origin.y}px`, opacity:.25 },
  ], { duration:240, easing:"ease-in" });
  animation.onfinish = () => ghost.remove();
}

function updateLiveToyPlay(draft, clientX, clientY) {
  if (!draft.valid || !draft.dropElement) return;
  const now = performance.now();
  // 止めていた時間やタブを離れた時間を、次の一振りに加算しない。
  const dt = Math.max(0, Math.min(100, now - draft.lastMoveAt));
  const segment = Math.hypot(clientX - draft.lastClientX, clientY - draft.lastClientY);
  const speed = segment / Math.max(1, dt);
  draft.totalDistance += segment;
  draft.peakSpeed = Math.max(draft.peakSpeed, speed);
  if (speed > .65) draft.fastMs += dt;
  if (speed < .22) draft.slowMs += dt;
  draft.lastMoveAt = now;
  draft.lastClientX = clientX;
  draft.lastClientY = clientY;

  const stage = draft.dropElement;
  const rect = stage.querySelector("[data-room-world]").getBoundingClientRect();
  const toyPoint = {
    x:Math.max(4, Math.min(96, ((clientX - rect.left) / rect.width) * 100)),
    y:Math.max(8, Math.min(88, ((clientY - rect.top) / rect.height) * 100)),
  };
  const cat = getCat(gameState);
  const item = getItem(draft.itemId);
  const result = resolveInteraction(cat, "play", item);
  const feel = CONFIG.playFeel[result.affinity];
  const catElement = stage.querySelector(".cat-object");
  if (!catElement) return;
  catElement.classList.remove("toy-eager", "toy-alert", "toy-watch", "toy-avoid", "toy-reject");
  catElement.classList.add(feel.pose);
  draft.affinity = result.affinity;
  accrueLivePlayHeart(draft, catElement, result, segment, dt, speed);
  updateLiveHeartMeter(draft, stage);
  if (segment > .15 && now - (draft.lastMoodAt || 0) > (result.affinity === "superDislike" ? 700 : 1800)) {
    spawnLiveFeedback(catElement, result.affinity, false, true);
    draft.lastMoodAt = now;
  }
  const available = getAvailableRoamPoints(gameState);
  if (!available.length) return;
  if (isNegativeAffinity(result.affinity)) {
    if (now - draft.lastCatMoveAt < feel.followWaitMs || draft.totalDistance < feel.distance) return;
    const farthest = available.reduce((best, point) => {
      const bestDistance = Math.hypot(best.x - toyPoint.x, best.y - toyPoint.y);
      const distance = Math.hypot(point.x - toyPoint.x, point.y - toyPoint.y);
      return distance > bestDistance ? point : best;
    }, available[0]);
    const targetIndex = CONFIG.stage1.roamPoints.indexOf(farthest);
    if (targetIndex !== draft.liveAnchorIndex) {
      const from = CONFIG.stage1.roamPoints[draft.liveAnchorIndex] || getCatPoint(gameState);
      animateLiveCatMove(draft, catElement, from, farthest, Math.max(.8, speed));
      draft.liveAnchorIndex = targetIndex;
    }
    draft.lastCatMoveAt = now;
    draft.totalDistance = 0;
    return;
  }

  const eager = result.affinity === "superMatch";
  if (now - draft.lastCatMoveAt < feel.followWaitMs || draft.totalDistance < feel.distance) return;
  const points = eager
    ? available
    : result.baseStage.id === "fear"
      ? available.filter(point => point.distance === "far")
      : available.filter(point => ["floor","box","tower"].includes(point.surface));
  const targetIndex = getNearestRoamIndex(toyPoint, points);
  if (targetIndex === draft.liveAnchorIndex) return;
  const from = CONFIG.stage1.roamPoints[draft.liveAnchorIndex] || getCatPoint(gameState);
  const to = CONFIG.stage1.roamPoints[targetIndex];
  animateLiveCatMove(draft, catElement, from, to, speed);
  draft.liveAnchorIndex = targetIndex;
  draft.lastCatMoveAt = now;
  draft.totalDistance = 0;
}

function updateLiveHeartMeter(draft, stage) {
  let meter = stage.querySelector(".live-heart-meter");
  if (!meter) {
    meter = document.createElement("aside");
    meter.className = "live-heart-meter";
    meter.setAttribute("aria-label", "遊んでいる猫のこころ");
    stage.appendChild(meter);
  }
  const cat = getCat(gameState);
  // 手帳と同じ描画を使い、今回の遊びで獲得した分だけ先に見せる。
  const markup = renderHeartVisual({ ...cat, heart:Math.round((cat.heart + draft.heartEarned) * 10) / 10 });
  if (meter.innerHTML !== markup) meter.innerHTML = markup;
}

function accrueLivePlayHeart(draft, catElement, result, segment, dt, speed) {
  if (result.baseHeart <= 0 || segment < .15) return;
  const usedKey = `play_${draft.itemId}`;
  const earnedToday = Number(gameState.ui.usedHandItems[usedKey]) || 0;
  const cat = getCat(gameState);
  const overflowAvailable = result.affinity === "superMatch" && !gameState.ui.usedHandItems.heart_overflow;
  const limit = overflowAvailable ? CONFIG.week.heartCapMax : cat.heartCap;
  const allowance = Math.max(0, Math.min(result.baseHeart - earnedToday, limit - cat.heart));
  if (allowance - draft.heartEarned < .099) return;
  draft.heartProgressMs += Math.max(0, Math.min(100, dt));
  const interval = CONFIG.playFeel[result.affinity].tickMs;
  while (draft.heartProgressMs >= interval && allowance - draft.heartEarned + .0001 >= .1) {
    draft.heartProgressMs -= interval;
    const before = earnedToday + draft.heartEarned;
    draft.heartEarned = Math.round((draft.heartEarned + .1) * 10) / 10;
    const after = earnedToday + draft.heartEarned;
    const reachedFullHeart = Math.floor(after + .0001) > Math.floor(before + .0001);
    spawnLiveFeedback(catElement, result.affinity, false);
    if (reachedFullHeart) spawnLiveFeedback(catElement, result.affinity, true);
    if (draft.heartEarned >= allowance) break;
  }
}

function spawnLiveFeedback(catElement, affinity, big = false, moodOnly = false) {
  const stage = catElement.closest(".stage");
  if (!stage) return;
  const catRect = catElement.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  const heart = document.createElement("span");
  heart.className = `live-heart ${big ? "big" : ""} ${affinity} ${moodOnly ? "mood-only" : ""}`;
  heart.style.left = `${((catRect.left + catRect.width * (.35 + Math.random() * .3) - stageRect.left) / stageRect.width) * 100}%`;
  heart.style.top = `${((catRect.top + catRect.height * .28 - stageRect.top) / stageRect.height) * 100}%`;
  heart.style.setProperty("--heart-drift", `${Math.round((Math.random() - .5) * 34)}px`);
  heart.textContent = moodOnly ? ({ superMatch:"♫", match:"♪", neutral:"·", dislike:"…", superDislike:"💢" }[affinity]) : "♥";
  stage.appendChild(heart);
  window.setTimeout(() => heart.remove(), big ? 1500 : 1100);
}

function animateLiveCatMove(draft, catElement, from, to, speed) {
  const parentRect = catElement.parentElement.getBoundingClientRect();
  const computed = getComputedStyle(catElement);
  const matrix = new DOMMatrixReadOnly(computed.transform === "none" ? undefined : computed.transform);
  from = { ...from, x:parseFloat(computed.left) / parentRect.width * 100, y:parseFloat(computed.top) / parentRect.height * 100, scale:Math.hypot(matrix.a, matrix.b) || from.scale };
  draft.catAnimation?.cancel?.();
  catElement.style.left = `${to.x}%`;
  catElement.style.top = `${to.y}%`;
  catElement.style.transform = `translate(-50%,-50%) scale(${to.scale})`;
  if (typeof catElement.animate !== "function") return;
  const jumping = from.surface !== to.surface || Math.abs(from.y - to.y) > 9 || speed > .72;
  const duration = (jumping ? Math.max(430, 720 - speed * 170) : Math.max(520, 920 - speed * 190)) * (CONFIG.playFeel[draft.affinity]?.moveScale || 1);
  if (jumping) {
    const apexY = Math.min(from.y, to.y) - Math.max(6, Math.min(14, Math.abs(from.y - to.y) * .4 + 6));
    draft.catAnimation = catElement.animate([
      { left:`${from.x}%`, top:`${from.y}%`, transform:`translate(-50%,-50%) scale(${from.scale * .94}) rotate(-3deg)` },
      { left:`${from.x + (to.x - from.x) * .5}%`, top:`${apexY}%`, transform:`translate(-50%,-50%) scale(${(from.scale + to.scale) * .53}) rotate(6deg)`, offset:.5 },
      { left:`${to.x}%`, top:`${to.y}%`, transform:`translate(-50%,-50%) scale(${to.scale * .92}) rotate(-2deg)`, offset:.9 },
      { left:`${to.x}%`, top:`${to.y}%`, transform:`translate(-50%,-50%) scale(${to.scale}) rotate(0deg)` },
    ], { duration, easing:"cubic-bezier(.32,.06,.28,1)" });
    return;
  }
  draft.catAnimation = catElement.animate([
    { left:`${from.x}%`, top:`${from.y}%`, transform:`translate(-50%,-50%) scale(${from.scale})` },
    { left:`${from.x + (to.x - from.x) * .5}%`, top:`${from.y + (to.y - from.y) * .5 - 1}%`, transform:`translate(-50%,-50%) scale(${(from.scale + to.scale) / 2})`, offset:.5 },
    { left:`${to.x}%`, top:`${to.y}%`, transform:`translate(-50%,-50%) scale(${to.scale})` },
  ], { duration, easing:"linear" });
}

function movePlayObjects(clientX, clientY) {
  if (!playDraft) return;
  const x = Math.max(5, Math.min(95, ((clientX - playDraft.rect.left) / playDraft.rect.width) * 100));
  const y = Math.max(12, Math.min(85, ((clientY - playDraft.rect.top) / playDraft.rect.height) * 100));
  playDraft.toy.style.left = `${x}%`;
  playDraft.toy.style.top = `${y}%`;
  const cat = getCat(gameState);
  const item = getItem(gameState.ui.equippedHand);
  const result = resolveInteraction(cat, "play", item);
  if (playDraft.catElement && result.referenceStage.id !== "fear") {
    const factor = result.referenceStage.id === "sweet" ? .72 : .42;
    const roam = CONFIG.stage1.roamPoints[gameState.ui.roamIndex];
    playDraft.catElement.style.left = `${roam.x + (x - roam.x) * factor}%`;
    playDraft.catElement.style.top = `${roam.y + (y - roam.y) * factor}%`;
  }
}

app.addEventListener("keydown", event => {
  if (event.key !== "Enter" && event.key !== " ") return;
  const target = event.target.closest("[role='button'][data-action]");
  if (!target) return;
  event.preventDefault();
  target.click();
});

// ゲーム画面では選択・拡大ジェスチャーを使わない。
let lastTouchEndAt = 0;
document.addEventListener("gesturestart", event => event.preventDefault(), { passive:false });
document.addEventListener("gesturechange", event => event.preventDefault(), { passive:false });
document.addEventListener("gestureend", event => event.preventDefault(), { passive:false });
document.addEventListener("touchmove", event => {
  if (event.touches.length > 1) event.preventDefault();
}, { passive:false });
document.addEventListener("touchend", event => {
  const now = Date.now();
  if (now - lastTouchEndAt < 320) event.preventDefault();
  lastTouchEndAt = now;
}, { passive:false });
document.addEventListener("dblclick", event => event.preventDefault());

function scheduleRoam() {
  const cat = getCat(gameState);
  const ratio = cat.heart / CONFIG.week.heartCapMax;
  const span = CONFIG.stage1.roamMsHighHeart - CONFIG.stage1.roamMsLowHeart;
  const delay = CONFIG.stage1.roamMsLowHeart + Math.round(span * ratio);
  window.setTimeout(() => {
    if (!titleScreenOpen && gameState.campaign.phase === "room" && !commandDraft && !playDraft && !gameState.ui.modal && !gameState.ui.layoutMode && !gameState.ui.holdingCat && !gameState.ui.reaction && !gameState.ui.catFocus && !gameState.ui.playMode) {
      const catNow = getCat(gameState);
      const stage = getHeartStage(catNow.heart);
      const availablePoints = getAvailableRoamPoints(gameState);
      const preferred = stage.id === "fear"
        ? CONFIG.stage1.roamPoints.map((point,index) => ({ point,index })).filter(entry => availablePoints.includes(entry.point) && entry.point.distance === "far")
        : stage.id === "sweet"
          ? CONFIG.stage1.roamPoints.map((point,index) => ({ point,index })).filter(entry => availablePoints.includes(entry.point) && entry.point.distance === "near")
          : CONFIG.stage1.roamPoints.map((point,index) => ({ point,index })).filter(entry => availablePoints.includes(entry.point));
      let next = preferred[Math.floor(Math.random() * preferred.length)].index;
      if (next === gameState.ui.roamIndex) next = preferred[(preferred.findIndex(entry => entry.index === next) + 1) % preferred.length].index;
      dispatch({ type:"ROAM_CAT", index:next });
    }
    scheduleRoam();
  }, delay);
}

function triggerAutoEvent() {
  if (titleScreenOpen) return;
  if (gameState.campaign.phase !== "room") return;
  if (commandDraft || playDraft || gameState.ui.modal || gameState.ui.layoutMode) return;
  const cat = getCat(gameState);
  const available = [];
  if (!cat.body.hunger) available.push({ event:"hunger", message:"お腹がすいたみたい" });
  if ((Number(cat.body.litter) || 0) < 3) available.push({ event:"litter", message:"トイレを使ったみたい" });
  if ((Number(cat.body.vomit) || 0) < 3) available.push({ event:"vomit", message:"床に吐いたあとがある" });
  const durablePlaced = getPlaced(getRoom(gameState)).filter(entry => getMaxDurability(entry.itemId) && getDurability(gameState, entry.itemId) > 0);
  if (getProblemLevel(cat, "broken") < 3 && durablePlaced.length) {
    const currentBrokenItemId = getBrokenItemId(cat);
    const target = durablePlaced.find(entry => entry.itemId === currentBrokenItemId) || durablePlaced[Math.floor(Math.random() * durablePlaced.length)];
    available.push({ event:"broken", itemId:target.itemId, message:"部屋のものが少し傷んでいる" });
  }
  if (!available.length) return;
  dispatch({ type:"AUTO_EVENT", ...available[Math.floor(Math.random() * available.length)] });
}

document.addEventListener("visibilitychange", () => {
  if (titleScreenOpen || gameState.campaign.phase !== "room") return;
  if (document.hidden) {
    dispatch({ type:"LEAVE_ROOM", at:Date.now() });
    return;
  }
  const elapsed = Math.max(0, Date.now() - gameState.lastSeenAt);
  const count = Math.min(4, Math.floor(elapsed / CONFIG.stage1.awayEventMs));
  const order = ["hunger", "litter", "vomit", "broken"];
  dispatch({ type:"RETURN_FROM_AWAY", events:order.slice(0, count), at:Date.now() });
});

saveGameState(gameState);
render(gameState);
scheduleRoam();
window.setInterval(triggerAutoEvent, CONFIG.stage1.autoEventMs);
</script>
