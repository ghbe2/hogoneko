<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f4bfc7">
  <title>ホゴネコ｜保護から卒業までモック v0.14</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #473b3a;
      --muted: #887876;
      --paper: #fffaf4;
      --cream: #f8eadb;
      --peach: #f3c7b7;
      --pink: #e997a5;
      --pink-dark: #b85e70;
      --sage: #b6c8ab;
      --sage-dark: #667b5f;
      --line: rgba(71, 59, 58, .16);
      --shadow: 0 10px 30px rgba(99, 67, 63, .16);
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body, #app, button {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body, #app { touch-action: pan-x pan-y; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.9) 0 12%, transparent 13%),
        linear-gradient(145deg, #ead9d3, #d4e1d3);
      color: var(--ink);
      overscroll-behavior: none;
    }

    body {
      width: 100vw;
      height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    button, input { font: inherit; }
    button { color: inherit; }
    img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }

    #app {
      width: min(100vw, 375px);
      height: 100svh;
      max-height: 812px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--paper);
      box-shadow: 0 20px 70px rgba(75, 57, 54, .24);
      position: relative;
    }

    .title-screen, .story-screen { height:100%; min-height:0; overflow:hidden; display:flex; flex-direction:column; align-items:center; padding:32px 25px 24px; background:radial-gradient(ellipse at 50% 32%,#fffaf4 0 24%,transparent 66%),#efe1d6; text-align:center; }
    .title-screen .title-kicker { margin:18px 0 4px; color:#9b746b; letter-spacing:.24em; font-size:10px; }
    .title-screen h1 { margin:8px 0; color:#805c54; font-size:46px; letter-spacing:.14em; }
    .title-screen p { color:#8d7870; font-size:12px; line-height:1.9; }
    .intro-illustration { position:relative; flex:1; width:100%; min-height:125px; max-height:280px; margin:15px 0; border-radius:150px 150px 22px 22px; background:linear-gradient(#bcd1c5 0 60%,#dfc4aa 60%); overflow:hidden; box-shadow:0 12px 25px #8d6c4920; }
    .intro-illustration::before { content:""; position:absolute; width:64px; height:88px; left:26px; top:25px; border:7px solid #fff5e6; background:linear-gradient(90deg,transparent 46%,#fff5e6 47% 54%,transparent 55%),linear-gradient(transparent 46%,#fff5e6 47% 54%,transparent 55%),#dce9d2; }
    .intro-illustration .cat-fallback { left:55%; top:64%; transform:translate(-50%,-50%) scale(.9); }
    .intro-illustration .cat-tail { animation:toy-tail 2.2s ease-in-out infinite alternate; }
    .title-actions { flex:0 0 auto; width:100%; margin-top:auto; padding-top:14px; }
    .title-actions small { display:block; margin-top:15px; color:#96847a; font-size:9px; }
    .story-screen { padding:28px 25px 22px; background:#fbf4ec; }
    .story-eyebrow { color:#ac7b77; font-size:10px; letter-spacing:.16em; }
    .story-screen h1 { margin:16px 0 4px; font-size:24px; color:#75594f; }
    .story-screen p { margin:12px 0; font-size:12px; line-height:2; color:#8b746c; }
    .story-screen .intro-illustration { max-height:220px; }
    .story-icon { position:absolute; left:28px; top:32px; font-size:45px; z-index:2; }
    .story-pages { display:flex; justify-content:center; gap:8px; margin:10px; }
    .story-pages i { width:7px; height:7px; border-radius:50%; background:#dcd0c5; }
    .story-pages i.current { width:22px; border-radius:5px; background:#cd8190; }
    .story-back { border:0; background:none; color:#9b8279; font-size:10px; padding:14px; }
    .screen-guide { position:absolute; right:6px; top:57px; z-index:71; width:min(190px,51%); text-align:left; }
    .stage > .screen-guide { top:6px; }
    .stage:has(.layout-edge-palette) > .screen-guide { right:79px; width:165px; }
    .guide-toggle { width:100%; min-height:28px; border:1px solid #dfc8c0; border-radius:12px; padding:5px 8px; background:#fff9eff5; color:#88635b; font-size:9px; font-weight:800; text-align:left; box-shadow:0 3px 8px #60472d10; }
    .guide-toggle small { display:block; color:#b67b88; font-size:7px; margin-bottom:2px; }
    .guide-detail { padding:9px 10px; margin-top:4px; border:1px solid #ead7ca; border-radius:12px; background:#fffaf4f7; color:#806b60; font-size:10px; line-height:1.7; box-shadow:0 6px 15px #60472d10; }
    .tutorial-focus { outline:3px solid #f3be64 !important; outline-offset:3px; animation:tutorial-focus 1.8s ease-in-out infinite; }
    @keyframes tutorial-focus { 50% { outline-color:#d8798c; } }
    @media (max-height:620px) { .title-screen,.story-screen { padding:18px 22px; } .story-screen h1 { font-size:20px; margin-top:10px; } .story-screen p { margin:8px 0; font-size:11px; line-height:1.7; } .intro-illustration { margin:8px 0; } }

    .game-frame {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }
    .game-frame.layout-mode.tray-open { grid-template-rows:auto minmax(0,1fr) 119px auto; }

    .hud {
      min-height: 52px;
      padding: calc(9px + env(safe-area-inset-top)) 15px 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: rgba(255, 250, 244, .96);
      border-bottom: 1px solid var(--line);
      z-index: 20;
    }

    .hud-main { display:flex; align-items:center; min-width:0; }

    .place-chip {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f5d6d9;
      color: #974e5e;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
    }

    .cat-line { min-width: 0; }
    .cat-line small { display: block; font-size: 9px; color: var(--muted); line-height: 1.1; }
    .cat-line strong { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .hud-side { display:flex; align-items:center; gap:13px; text-align:right; line-height:1.15; }
    .hud-side strong { display:block; font-size:13px; }
    .hud-side span { font-size:11px; color:var(--muted); }

    .stage {
      width: 100%;
      min-height: 0;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: #ead5bd;
      touch-action: none;
    }

    .room-world {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 200%;
      overflow: hidden;
      transition: left .12s ease-out;
      will-change: left;
      touch-action: none;
    }

    .room-world.dragging { transition: none; }

    .room-world::after {
      content: "";
      position: absolute;
      top: 12%;
      bottom: 8%;
      left: 50%;
      border-left: 1px dashed rgba(113, 83, 76, .1);
      pointer-events: none;
      display: none;
    }

    .wall {
      position: absolute;
      inset: 0 0 41% 0;
      background:
        linear-gradient(90deg, transparent 49.5%, rgba(91,72,65,.035) 50%, transparent 50.5%) 0 0 / 82px 100%,
        linear-gradient(#f8eae4, #f5e2db);
      border-bottom: 7px solid #d1a987;
    }

    .wall::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 12px 14px, rgba(255,255,255,.5) 0 2px, transparent 2.5px) 0 0 / 38px 38px;
      opacity: .55;
    }

    .floor {
      position: absolute;
      inset: 59% 0 0;
      background:
        linear-gradient(100deg, transparent 49%, rgba(103, 79, 57, .09) 50%, transparent 51%) 0 0 / 68px 100%,
        linear-gradient(#dfc4a6, #d4b18b);
    }

    .curtain {
      position: absolute;
      top: 0;
      width: 23px;
      height: 62%;
      z-index: 1;
      opacity: .72;
      background: repeating-linear-gradient(90deg, #d9b6b5 0 7px, #cda3a4 7px 13px);
    }
    .curtain.left { left: 0; border-radius: 0 0 18px 0; }
    .curtain.right { right: 0; border-radius: 0 0 0 18px; }

    .scene-hint {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      width: max-content;
      max-width: calc(100% - 38px);
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,250,244,.9);
      box-shadow: 0 4px 14px rgba(88,58,53,.09);
      color: #766563;
      font-size: 11px;
      text-align: center;
      pointer-events: none;
    }

    .placed-item, .cat-object, .trouble-object {
      position: absolute;
      z-index: 4;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      outline: none;
    }

    .placed-item:focus-visible, .cat-object:focus-visible, .trouble-object:focus-visible {
      filter: drop-shadow(0 0 4px #b84f68);
    }

    .clue-marker {
      position: absolute;
      width: 34px;
      height: 24px;
      border: 0;
      background: transparent;
      pointer-events: auto;
      cursor: pointer;
      z-index: 12;
    }
    .clue-marker.hair::before, .clue-marker.hair::after {
      content:"";
      position:absolute;
      width:24px;
      height:10px;
      border-top:2px solid rgba(112,91,79,.72);
      border-radius:50%;
      transform:rotate(16deg);
    }
    .clue-marker.hair::after { left:7px; top:7px; width:19px; transform:rotate(-22deg); }
    .clue-marker.soil { background:radial-gradient(circle at 25% 60%,#795741 0 3px,transparent 4px),radial-gradient(circle at 55% 35%,#6a4a36 0 4px,transparent 5px),radial-gradient(circle at 80% 70%,#8a654a 0 3px,transparent 4px); }
    .clue-marker.scratch { background:repeating-linear-gradient(105deg,transparent 0 6px,rgba(103,74,57,.72) 7px 8px,transparent 9px 12px); transform:rotate(-8deg); }

    .item-window {
      left: 62%; top: 15%; width: 74px; height: 90px;
      border: 7px solid #ad8268;
      background: linear-gradient(#bbdce1 0 62%, #9fbea1 62%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.72), 0 5px 0 rgba(108,77,57,.12);
    }
    .item-window.season-spring { background:linear-gradient(#c8e0e6 0 58%,#a9c9a5 58%); }
    .item-window.season-summer { background:linear-gradient(#98d5e5 0 58%,#6eaf76 58%); }
    .item-window.season-autumn { background:linear-gradient(#d9c9b8 0 58%,#c78b5b 58%); }
    .item-window.season-winter { background:linear-gradient(#dbe3ea 0 58%,#eef1ee 58%); }
    .window-weather { position:absolute; inset:0; z-index:1; overflow:hidden; pointer-events:none; }
    .window-weather::before, .window-weather::after { content:""; position:absolute; border-radius:50%; }
    .season-spring .window-weather::before { width:5px; height:5px; left:12px; top:15px; background:#f7b8c7; box-shadow:20px 9px #f6c3ce,38px 2px #f3afbf,10px 34px #f9cbd2,43px 39px #f5b7c3; }
    .season-summer .window-weather::before { width:18px; height:18px; right:7px; top:7px; background:#f6d268; box-shadow:0 0 0 5px rgba(246,210,104,.22); }
    .season-autumn .window-weather::before { width:7px; height:4px; left:9px; top:18px; border-radius:80% 15%; background:#c96f45; transform:rotate(28deg); box-shadow:21px 13px #d99a48,40px -6px #b75d45,32px 30px #d17d3f; }
    .season-winter .window-weather::before { width:4px; height:4px; left:10px; top:12px; background:#fff; box-shadow:17px 14px #fff,38px 2px #fff,8px 36px #fff,45px 34px #fff,28px 44px #fff; }
    .item-window::before, .item-window::after { content: ""; position: absolute; z-index:2; background: #ad8268; }
    .item-window::before { width: 5px; height: 100%; left: 50%; transform: translateX(-50%); }
    .item-window::after { height: 5px; width: 100%; top: 50%; transform: translateY(-50%); }

    .fixed-window {
      position: absolute;
      left: 60%;
      top: 15%;
      z-index: 2;
      cursor: default;
    }

    .item-shelf {
      width: 86px;
      height: 28px;
      z-index: 5;
    }
    .item-shelf::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 7px;
      height: 13px;
      border-radius: 5px;
      background: linear-gradient(#c79470, #a87555);
      box-shadow: 0 5px 0 rgba(91,62,46,.12);
    }
    .item-shelf::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 0;
      height: 8px;
      border-left: 5px solid #8e6148;
      border-right: 5px solid #8e6148;
    }

    .item-tower { left: 68%; bottom: 18%; width: 78px; height: 138px; }
    .item-tower::before {
      content: ""; position: absolute; left: 33px; bottom: 0; width: 13px; height: 105px;
      border-radius: 6px; background: repeating-linear-gradient(#ac8262 0 5px, #c69d7a 5px 9px);
    }
    .item-tower::after {
      content: ""; position: absolute; left: 5px; top: 20px; width: 68px; height: 19px;
      border-radius: 50%; background: #b9836e; box-shadow: 0 66px 0 #b9836e;
    }

    .item-box {
      left: 9%; bottom: 17%; width: 88px; height: 62px;
      background: #c99765;
      border: 3px solid #a7784e;
      clip-path: polygon(8% 17%, 92% 17%, 100% 100%, 0 100%);
    }
    .item-box::after { content: ""; position: absolute; inset: 11px 13px auto; height: 13px; background: #735b49; border-radius: 50%; }

    .item-blanket { width:76px; height:38px; border-radius:50% 45% 42% 48%; background:repeating-linear-gradient(18deg,#96aab8 0 7px,#b6c6cf 8px 14px); box-shadow:0 7px 9px rgba(72,55,49,.13); }
    .item-blanket::after { content:""; position:absolute; inset:8px 13px; border:2px dashed rgba(255,255,255,.55); border-radius:50%; }
    .item-scratch { width:68px; height:25px; border-radius:7px; background:repeating-linear-gradient(90deg,#b9875f 0 4px,#cda079 5px 8px); border:3px solid #9b6d4b; box-shadow:0 5px 7px rgba(71,51,43,.14); }

    .item-plant { left: 11%; top: 31%; width: 70px; height: 113px; }
    .item-plant::before {
      content: ""; position: absolute; left: 18px; bottom: 0; width: 44px; height: 46px;
      border-radius: 4px 4px 16px 16px; background: linear-gradient(90deg, #bd7e65, #d59a7c);
    }
    .item-plant::after {
      content: "🌿"; position: absolute; left: 0; top: -2px; font-size: 61px; line-height: 1;
      filter: saturate(.75);
    }

    .trouble-object { z-index: 7; }
    .trouble-object.fixed { opacity: .78; }

    .item-bowl { left: 37%; bottom: 10%; width: 68px; height: 38px; }
    .item-bowl::before {
      content: ""; position: absolute; inset: 7px 4px 2px; border-radius: 50% 50% 42% 42%;
      background: #d6938a; border: 4px solid #fff0e6; box-shadow: 0 5px 7px rgba(78,54,48,.14);
    }

    .item-litter { right: 4%; bottom: 4%; width: 84px; height: 60px; }
    .item-litter::before {
      content: ""; position: absolute; inset: 7px 2px 2px; border-radius: 15px 15px 9px 9px;
      background: #b9c4b0; border: 5px solid #eef0e7; transform: perspective(60px) rotateX(8deg);
    }
    .item-bowl:not(.empty)::after { content: "•••"; position: absolute; left: 26px; top: 10px; color: #775144; letter-spacing: 1px; }
    .item-litter.dirt-1::before { background: radial-gradient(circle at 35% 45%, #88746a 0 3px, transparent 4px), #b9c4b0; }
    .item-litter.dirt-2::before { background: radial-gradient(circle, #88746a 0 3px, transparent 4px) 10px 8px / 24px 19px, #b9c4b0; }
    .item-litter.dirt-3::before { background: radial-gradient(circle, #746158 0 4px, transparent 5px) 6px 5px / 20px 15px, linear-gradient(rgba(118,96,82,.23),rgba(118,96,82,.23)), #aeb7a5; filter:saturate(.75); }

    .cat-object {
      left: 50%;
      top: 62%;
      bottom: auto;
      width: 119px;
      height: 134px;
      transform: translate(-50%, -50%);
      z-index: 10;
      transition: transform .35s ease;
      will-change: left, top, transform;
    }
    .cat-object:active { transform: translate(-50%, -50%) scale(.96); }

    .cat-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2; }
    .cat-fallback { position: absolute; inset: 0; }
    .cat-body {
      position: absolute; width: 88px; height: 91px; left: 17px; bottom: 0;
      border-radius: 48% 48% 42% 42%; background: repeating-linear-gradient(104deg, #806b5b 0 14px, #a48c77 14px 24px);
      box-shadow: inset -9px -6px 0 rgba(58,44,38,.12), 0 8px 12px rgba(75,49,36,.18);
    }
    .cat-head {
      position: absolute; width: 82px; height: 75px; left: 19px; top: 13px;
      border-radius: 48% 48% 43% 43%; background: repeating-linear-gradient(102deg, #806b5b 0 13px, #a48c77 13px 23px); z-index: 2;
    }
    .cat-head::before, .cat-head::after {
      content: ""; position: absolute; top: -14px; width: 31px; height: 34px;
      background: #806b5b; clip-path: polygon(50% 0, 100% 100%, 0 84%);
    }
    .cat-head::before { left: 3px; transform: rotate(-8deg); }
    .cat-head::after { right: 3px; transform: rotate(8deg); }
    .cat-eyes { position: absolute; left: 36px; top: 43px; z-index: 5; font-size: 24px; letter-spacing: 11px; color: #d6b64f; line-height: 1; text-shadow: 0 0 0 #222; }
    .cat-muzzle { position: absolute; left: 53px; top: 68px; z-index: 6; font-size: 19px; color: #fff2e9; }
    .cat-tail {
      position: absolute; right: 1px; bottom: 14px; width: 47px; height: 79px; border: 13px solid #806b5b;
      border-left-color: transparent; border-bottom-color: transparent; border-radius: 50%; transform: rotate(21deg);
    }

    .cat-object.walking .cat-body { animation: cat-step-body .46s ease-in-out infinite alternate; }
    .cat-object.walking .cat-tail { animation: cat-tail-walk .7s ease-in-out infinite alternate; }
    .cat-object.walking .cat-body::before,
    .cat-object.walking .cat-body::after {
      content: "";
      position: absolute;
      bottom: -8px;
      width: 15px;
      height: 22px;
      border-radius: 50%;
      background: #806b5b;
      transform-origin: top;
    }
    .cat-object.walking .cat-body::before { left: 16px; animation: cat-foot .46s ease-in-out infinite alternate; }
    .cat-object.walking .cat-body::after { right: 16px; animation: cat-foot .46s ease-in-out infinite alternate-reverse; }
    .cat-object.fleeing { animation: cat-startle .42s ease-in-out 2; }
    .cat-object.toy-alert .cat-head { animation: toy-head 1s ease-in-out infinite alternate; transform-origin: 50% 80%; }
    .cat-object.toy-alert .cat-tail { animation: toy-tail .24s ease-in-out infinite alternate; }
    .cat-object.toy-watch .cat-head { animation:toy-head 1.8s ease-in-out infinite alternate; transform-origin:50% 80%; }
    .cat-object.toy-eager .cat-head { animation:toy-head .3s ease-in-out infinite alternate; transform-origin:50% 80%; }
    .cat-object.toy-eager .cat-tail { animation:toy-tail .13s ease-in-out infinite alternate; }
    .cat-object.toy-eager .cat-eyes { text-shadow:0 0 6px #ffe986; }
    .cat-object.toy-reject .cat-head { transform:rotate(-17deg) translateY(-3px); }
    .cat-object.toy-reject .cat-tail { animation:cat-tail-walk .1s ease-in-out infinite alternate; }
    .cat-object.toy-reject .cat-body { filter:drop-shadow(0 0 2px #735f62); }
    .cat-object.toy-watch .cat-eyes { color:#d4ae47; text-shadow:0 0 4px rgba(255,236,154,.8); }
    .cat-object.toy-avoid .cat-head { transform:rotate(-8deg); }
    .cat-object.toy-avoid .cat-tail { animation:cat-tail-walk .18s ease-in-out infinite alternate; }

    .held-cat {
      position: absolute;
      left: 50%;
      top: 60%;
      z-index: 24;
      width: 145px;
      height: 165px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      animation: held-arrive .3s ease-out;
    }
    .held-cat .cat-fallback { transform: scale(1.08); }
    .holding-hands::before,
    .holding-hands::after {
      content: "";
      position: absolute;
      bottom: -8px;
      z-index: 6;
      width: 48px;
      height: 86px;
      border-radius: 52% 52% 25% 25%;
      background: #f1bf9f;
      box-shadow: inset -6px -6px 0 rgba(143,82,63,.08);
    }
    .holding-hands::before { left: -6px; transform: rotate(-21deg); }
    .holding-hands::after { right: -6px; transform: rotate(21deg); }

    .pan-guide {
      position: absolute;
      left: 50%;
      bottom: 7px;
      z-index: 15;
      display: flex;
      gap: 5px;
      transform: translateX(-50%);
      pointer-events: auto;
    }
    .pan-guide button {
      position: relative;
      width: 38px;
      height: 28px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .pan-guide button::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 12px;
      height: 5px;
      border-radius: 999px;
      background: rgba(85,67,64,.22);
    }
    .pan-guide button.active::after { background: #b85e70; }

    .reaction {
      position: absolute;
      left: 50%;
      bottom: calc(21% + 125px);
      transform: translateX(-50%);
      z-index: 16;
      width: 48px;

    .capture-inspect.revealing::before { content:""; position:absolute; inset:0; z-index:-1; background:radial-gradient(circle at 50% 45%,rgba(255,245,224,.8),rgba(72,62,56,.18) 48%,rgba(42,34,32,.55)); animation:reveal-room-light 2.8s ease-out both; }

    .capture-note { width:min(310px,100%); display:grid; grid-template-columns:36px 1fr; align-items:center; gap:8px; padding:11px 13px; border-radius:15px; background:#fff; box-shadow:0 5px 14px rgba(73,54,49,.12); animation:capture-note-in .3s ease-out; }

function mergeSavedState(defaultValue, savedValue) {
  if (Array.isArray(defaultValue)) {
    if (!Array.isArray(savedValue)) return defaultValue;
    if (!defaultValue.length) return savedValue;
    return savedValue.map((value, index) => mergeSavedState(defaultValue[Math.min(index, defaultValue.length - 1)], value));
  }
  if (defaultValue && typeof defaultValue === "object") {
    const savedObject = savedValue && typeof savedValue === "object" && !Array.isArray(savedValue) ? savedValue : {};
    const keys = new Set([...Object.keys(defaultValue), ...Object.keys(savedObject)]);
    return Object.fromEntries([...keys].map(key => [key, key in defaultValue ? mergeSavedState(defaultValue[key], savedObject[key]) : savedObject[key]]));
  }
  return savedValue === undefined ? defaultValue : savedValue;
}

function normalizeLoadedState(state) {
  const normalized = JSON.parse(JSON.stringify(state));
  normalized.ui = { ...normalized.ui, modal:null, reaction:null, catFocus:null, holdingCat:false, pickupResult:null, playMode:false, interactionMode:null, careAnimation:null, debugOpen:false, debugIntakeOpen:false, scheduleIntro:false };
  normalized.ui.guideExpanded = null;
  return normalized;
}

function loadSavedGameState(defaultState) {
  try {
    const raw = window.localStorage.getItem(SAVE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(defaultState));
    const save = JSON.parse(raw);
    if (!save || save.version !== SAVE_SCHEMA_VERSION || !save.state) return JSON.parse(JSON.stringify(defaultState));
    const restored = mergeSavedState(defaultState, save.state);
    // 導入追加前のセーブは進行を尊重し、保護をやり直させない。
    if (!save.state.onboarding) restored.onboarding.status = restored.flags.firstIntake || restored.cats[0]?.status === "raising" || restored.album.length ? "done" : restored.campaign.phase !== "town" ? "active" : "new";
    return normalizeLoadedState(restored);
  } catch (error) {
    return JSON.parse(JSON.stringify(defaultState));
  }
}

function saveGameState(state) {
  try {
    const saveState = normalizeLoadedState(state);
    window.localStorage.setItem(SAVE_KEY, JSON.stringify({ version:SAVE_SCHEMA_VERSION, savedAt:Date.now(), state:saveState }));
    return true;
  } catch (error) {
    return false;
  }
}

function resetGameSave() {
  try { window.localStorage.removeItem(SAVE_KEY); } catch (error) {}
  window.location.reload();
}

function getItem(itemId) {

function getMaxDurability(itemId) {

function getDurability(state, itemId) {
  const max = getMaxDurability(itemId);
  return max ? Math.max(0, Math.min(max, Number(state.durability?.[itemId] ?? max))) : 0;
}

function getDurabilityView(state, itemId) {
  const max = getMaxDurability(itemId);
  const current = getDurability(state, itemId);
  const ratio = max ? current / max : 1;
  return { current, max, ratio, className:current <= 0 ? "empty" : ratio <= .3 ? "low" : "" };
}

function renderDurability(state, itemId) {
  const value = getDurabilityView(state, itemId);
  if (!value.max) return "";
  return `<span class="durability ${value.className}" style="--durability:${Math.round(value.ratio * 100)}%" aria-label="耐久 ${value.current}/${value.max}"><i></i></span>`;
}

function changeDurability(state, itemId, amount) {
  const max = getMaxDurability(itemId);
  if (!max) return state.durability;
  const next = Math.max(0, Math.min(max, getDurability(state, itemId) + amount));
  return { ...state.durability, [itemId]:next };
}

function wearToy(state, itemId) {
  const current = getDurability(state, itemId);
  const max = getMaxDurability(itemId);
  if (!max || current <= 0) return { inventory:state.inventory, durability:state.durability, broken:false };
  if (current > 1) return { inventory:state.inventory, durability:changeDurability(state, itemId, -1), broken:false };
  const copies = Number(state.inventory[itemId]) || 0;
  if (copies > 1) {
    return {
      inventory:{ ...state.inventory, [itemId]:copies - 1 },
      durability:{ ...state.durability, [itemId]:max },
      broken:true,
    };
  }
  return {
    inventory:{ ...state.inventory, [itemId]:0 },
    durability:{ ...state.durability, [itemId]:0 },
    broken:true,
  };
}

function getRoomComfortBreakdown(state) {
  const cat = getCat(state);
  const points = { superMatch:15, match:10, neutral:5, dislike:0, superDislike:-10 };
  const entries = getPlaced(getRoom(state)).flatMap(placed => {
    if (getDurability(state, placed.itemId) <= 0 && getMaxDurability(placed.itemId)) return [];
    const item = getItem(placed.itemId);
    if (!item) return [];
    if (item.essential) return [{ itemId:item.id, label:item.label, essential:true, kind:"essential", points:5 }];
    const kind = getAffinity(cat, item).kind;
    return [{ itemId:item.id, label:item.label, essential:false, kind, points:points[kind] }];
  });
  const essentialIds = CONFIG.items.filter(item => item.essential).map(item => item.id);
  const present = new Set(entries.map(entry => entry.itemId));
  const missingEssential = essentialIds.filter(id => !present.has(id));
  const total = Math.max(0, Math.min(100, 20 + entries.reduce((sum, entry) => sum + entry.points, 0)));
  return {
    base:20,
    total,
    entries,
    missingEssential,
    canExit:missingEssential.length === 0 && total > CONFIG.stage1.campaign.intakeThreshold,
  };
}

function drawShuffledTypes(cat) {
  const pool = [...CONFIG.cat.types];
  for (let index = pool.length - 1; index > 0; index -= 1) {
    const swap = Math.floor(Math.random() * (index + 1));
    [pool[index], pool[swap]] = [pool[swap], pool[index]];
  }
  const count = Math.max(CONFIG.cat.typeCount.min, Math.min(CONFIG.cat.typeCount.max, cat.types?.length || 2));
  const currentKey = [...(cat.types || [])].sort().join("|");
  let next = pool.slice(0, count);
  if ([...next].sort().join("|") === currentKey) {
    const replacement = pool.find(type => !next.includes(type));
    if (replacement) next = [...next.slice(0, -1), replacement];
  }
  return next;
}

  return CONFIG.stage1.roamPoints.filter(point => !point.requiresItem || (placed.has(point.requiresItem) && getDurability(state, point.requiresItem) > 0));

function getCatPoint(state) {
