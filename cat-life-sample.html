<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ホゴネコ｜ネコのしぐさ</title><link rel="stylesheet" href="assets/cat-life-sample.css"></head>
<body><main id="sample">
 <svg class="room" viewBox="0 0 400 800" preserveAspectRatio="xMidYMin slice" aria-hidden="true"><rect width="400" height="800" fill="#e9e3ce"/><path d="M0 535H400V800H0Z" fill="#bd9d73"/><path d="M0 535H400" stroke="#967655" stroke-width="9"/><path d="M0 615H400M0 720H400M90 535L30 800M290 535L370 800" stroke="#a98a63" fill="none"/><rect x="35" y="145" width="122" height="198" rx="3" fill="#ae8e64"/><rect x="43" y="153" width="106" height="180" fill="#d5dfce"/><path d="M43 291Q96 243 149 281V333H43Z" fill="#b0bf9c"/><path d="M96 153V333M43 244H149" stroke="#f6f0dc" stroke-width="7"/><path d="M30 141L53 144 44 345 23 350Z M139 144L162 141 175 350 152 345Z" fill="#bd8c70"/><path d="M44 345H152L294 800H68Z" fill="#fff2c9" opacity=".19"/></svg>
 <header><div><small>動きの試作 / 本編には未反映</small><h1>ネコのしぐさ</h1></div><button id="change" class="quiet">別のネコ <span>↻</span></button></header>
 <div class="floor-plane" aria-hidden="true"></div><section class="stage" aria-label="ネコに触れると反応します"><svg id="cat" viewBox="170 55 380 375" aria-label="ネコ" role="img"></svg></section>
 <button id="pose-open" aria-haspopup="dialog">ポーズ：すわる <span>⌄</span></button>
 <dialog id="pose-dialog" aria-labelledby="pose-heading"><div class="pose-heading"><h2 id="pose-heading">ポーズを選ぶ</h2><span>全19種類</span></div><label class="compare"><input type="checkbox" id="original"> 既存の動きと比較（元の15ポーズ）</label><div id="pose-list"></div><button id="pose-close">閉じる <span>›</span></button></dialog>
 <p id="response" aria-live="polite">こちらを見たり、耳を澄ませたり。</p>
 <footer><p class="hint">顔をなでる · 指やマウスをゆっくり追います</p><nav aria-label="ネコの気持ち"><button data-mode="idle" aria-pressed="true">くつろぐ</button><button data-mode="wary" aria-pressed="false">警戒する</button><button data-mode="warm" aria-pressed="false">甘える</button></nav><div class="actions"><button id="call">呼んでみる <span>›</span></button><button id="pause" aria-pressed="false">一時停止 <span>Ⅱ</span></button></div></footer>
 </main><style>.pose-embed body,.pose-embed #sample{width:100%;height:100dvh;min-height:0;max-width:none;max-height:none;margin:0;border:0;border-radius:0;background:transparent;overflow:hidden}.pose-embed #sample>*:not(.stage){display:none!important}.pose-embed .stage{inset:0;position:absolute}.pose-embed .stage svg{width:100%;height:100%}</style><script src="assets/book-materials.js"></script><script src="assets/cat-svg.js"></script><script src="assets/cat-life-motion.js"></script><script src="assets/cat-life-sample.js"></script></body></html>
