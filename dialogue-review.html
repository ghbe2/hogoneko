<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>セリフ・進行確認</title><style>body{margin:0;background:#f5f4ef;color:#34473f;font:15px/1.8 sans-serif}header,main{max-width:900px;margin:auto;padding:24px}header{border-bottom:1px solid #ccc}h1{font-size:24px}h2{margin-top:32px}article{padding:16px;margin:12px 0;background:white;border-radius:12px}small{color:#6a756c}textarea{display:block;box-sizing:border-box;width:100%;min-height:90px;font:inherit;border:1px solid #ccc;border-radius:6px;padding:10px}button{padding:12px;border:0;border-radius:8px;background:#344e42;color:white;cursor:pointer}pre{white-space:pre-wrap}a{color:inherit}</style><header><a href="check.html">チェック一覧へ</a><h1>セリフ・進行確認</h1><p>ゲームと共通のセリフ原稿を順番に表示します。編集内容はこのページ内の下書きです。「変更をダウンロード」で修正一覧を保存できます。本体には自動反映しません。</p><button id="export">変更をダウンロード</button></header><main id="list"></main><script src="game-dialogue.js"></script><script>
const changes={},list=document.querySelector('#list');
function group(title,entries){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=title;section.append(h);for(const [id,spec]of entries){const article=document.createElement('article'),label=document.createElement('small');label.textContent=id+(spec.next?' → '+spec.next:'');article.append(label);const value=typeof spec.copy==='function'?spec.copy.toString():spec.copy;const input=document.createElement('textarea');input.value=value;input.readOnly=typeof spec.copy==='function';input.setAttribute('aria-label',id+'のセリフ');input.oninput=()=>{changes[id]=input.value};article.append(input);if(input.readOnly){const note=document.createElement('p');note.textContent='ネコの名前・家具によって変わるセリフです。共通原稿で管理しています。';article.append(note)}section.append(article)}list.append(section)}
group('導入',INTRODUCTION_PAGES.map((p,i)=>['intro-'+i,{copy:p.join('\n')}]));group('街のマップ',Object.entries(TOWN_TUTORIAL));group('初めての保護から生活開始',Object.entries(FIRST_GUIDES));group('生活開始・保護センター',Object.entries(ACTIVITY_DIALOGUE));document.querySelector('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(changes,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='dialogue-changes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
