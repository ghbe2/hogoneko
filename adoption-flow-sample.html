<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ホゴネコ｜最後の挑戦・シーンサンプル</title>
<style>
*{box-sizing:border-box}svg{display:block}body{margin:0;background:#373b35;color:#554e3c;font-family:"Yu Mincho","Hiragino Mincho ProN",serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #c79548;outline-offset:3px}
.preview{height:48px;display:flex;align-items:center;justify-content:center;gap:12px;padding:4px 8px;color:#f9efd8;font:12px sans-serif}.preview select,.preview button{height:36px;border:1px solid #898f7f;border-radius:8px;background:#485043;color:#fff8e9;padding:0 8px}.preview label{display:flex;align-items:center;gap:6px}.preview span{font-size:10px;color:#d1d3c5}
.game{position:relative;margin:auto;width:min(100%,420px);height:calc(100dvh - 48px);max-height:820px;background:#e4e2cd;--paper:#fff8e7;--green:#687c59;--panel:196px;isolation:isolate}
.bar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fff8e9;font-size:12px;letter-spacing:.12em}.bar span:last-child{font-size:11px;color:#8a8069}
.scene{position:absolute;inset:42px 0 0;background:linear-gradient(#e1e2cf 0 67%,#cbae7d 67%);transition:background 1s}
.stage{position:absolute;inset:0 0 calc(var(--panel) + 12px)}
.windows{position:absolute;inset:12% 7% 37%;display:flex;justify-content:space-between}.window{width:26%;border:6px solid #ac946e;box-shadow:inset 0 0 0 2px #f5ecd4;background:linear-gradient(90deg,transparent 47%,#f5ecd4 47% 53%,transparent 53%),linear-gradient(transparent 46%,#f5ecd4 46% 51%,transparent 51%),#b4cdcd}
.flags{position:absolute;left:4%;top:3%;width:92%;height:46px}.room-sign{position:absolute;top:5%;left:36%;right:36%;text-align:center;font-size:13px;color:#788164}
.table{position:absolute;left:8%;width:84%;height:23%;bottom:0}.cat-slot{position:absolute;left:50%;bottom:23%;width:150px;height:61%;max-height:245px;transform:translateX(-50%);z-index:2}.cat-slot svg{display:block;width:100%;height:100%;overflow:visible}
.visitor{position:absolute;width:120px;height:73%;max-height:265px;right:0;bottom:15%;opacity:0;transform:translateX(12px);transition:opacity 1s,transform 1s;z-index:1}.visitor svg{width:100%;height:100%;overflow:visible}.visitor .arm{transform-origin:68px 130px;animation:offer 4s ease-in-out infinite}.has-visitor .visitor{opacity:1;transform:none}
.whisper{position:absolute;z-index:3;right:14px;top:10px;max-width:68%;padding:9px 13px;border:1px solid #dbd4bb;border-radius:18px 18px 4px 18px;background:#fff9e9;color:#6b735a;font-size:13px;line-height:1.5;opacity:0;transition:opacity .5s;pointer-events:none}.has-visitor .whisper{opacity:1}
.panel{position:absolute;left:10px;right:10px;bottom:12px;height:var(--panel);padding:14px 16px;border:1px solid #fdf8e8;border-radius:21px;background:var(--paper);box-shadow:0 3px 0 #9f86532b;display:grid;grid-template-rows:16px 29px 50px 44px;gap:8px;z-index:5}
.eyebrow{font-size:10px;letter-spacing:.16em;color:#8c846b}.panel h1{margin:0;font-size:20px;font-weight:500;line-height:29px;white-space:nowrap}.panel p{margin:0;font-size:13px;line-height:23px}.actions{display:flex;gap:8px}.actions button{height:44px;border:0;border-radius:24px;padding:5px 12px;color:#fff8e9;background:var(--green);font-size:14px;flex:1}.actions .back{flex:0 0 52px;background:#eee4cb;color:#7b6b51}.actions .back[hidden]{display:block;visibility:hidden}.actions button:disabled{cursor:default;background:#ddd8c4;color:#827964}
.seal{position:absolute;left:50%;top:7%;transform:translateX(-50%);font-size:13px;color:#9b7939;letter-spacing:.22em;text-align:center;opacity:0;transition:opacity 1s}.seal b{display:block;font-size:29px;font-weight:500;line-height:1.7;letter-spacing:.12em}.success .seal{opacity:1}.success .flags,.success .room-sign{opacity:0}.success .cat-slot:before{content:'';position:absolute;inset:-15% -30%;background:radial-gradient(ellipse,#fff6c580,transparent 68%);z-index:-1}
.outdoors{position:absolute;inset:0;opacity:0;transition:opacity 1s;background:linear-gradient(#d9dfcb 0 67%,#b7c39b 67%)}.outdoors svg{width:100%;height:100%}.tnr .outdoors{opacity:1}.tnr .windows,.tnr .flags,.tnr .room-sign,.tnr .table{opacity:0}.tnr .cat-slot{z-index:2}
.record-frame{position:absolute;inset:9% 12% 0;border:9px solid #fff7e3;box-shadow:0 3px 8px #6c614b22;opacity:0;pointer-events:none}.record .record-frame{opacity:1}.record .visitor{opacity:0}.record .seal{top:2%;font-size:10px}.record .seal b{font-size:22px}
.seal{width:92%;font-size:11px}.success .whisper{opacity:0}.tnr .cat-slot:after{content:'';position:absolute;bottom:-5px;left:12%;right:5%;height:12px;border-radius:50%;background:#8eaa7970;z-index:-1}
@keyframes offer{0%,100%{rotate:0deg}50%{rotate:5deg}}
@media(max-height:650px){.panel{padding:12px;gap:8px}.panel h1{font-size:18px}.game{--panel:192px}.whisper{top:0;font-size:12px;padding:6px 10px}.seal{top:0}.seal b{font-size:23px}.visitor{width:100px}.room-sign{top:0}.preview{gap:8px}.preview span{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body>
<nav class="preview" aria-label="サンプル確認用"><label>結末<select id="branch"><option value="adopted">譲渡成立</option><option value="tnr">TNR</option></select></label><button id="restart">最初から</button><span>確認用・本番では選びません</span></nav>
<main class="game"><header class="bar"><span>ホゴネコ</span><span id="place">譲渡会</span></header><div class="scene" id="scene"><div class="outdoors" aria-hidden="true"><svg viewBox="0 0 375 600" preserveAspectRatio="none"><path d="M125 600L189 280H223L260 600" fill="#d8c495"/><path d="M15 240V140H102V240M272 222V118H357V222" fill="#eee5c9"/><path d="M4 140L58 98 111 140M260 118L315 72 368 118" fill="#aa9474"/><path d="M30 157H60V193H30ZM286 138H320V178H286Z" fill="#b4cbc7"/><path d="M58 266V345M321 240V320" stroke="#96815d" stroke-width="7"/><path d="M58 286C-8 282 8 227 39 219C34 178 84 182 87 219C132 230 107 284 58 286M320 263C273 258 274 215 298 201C289 161 343 165 345 197C389 212 371 258 320 263" fill="#94aa7d"/></svg></div>
<div class="stage"><div class="windows" aria-hidden="true"><i class="window"></i><i class="window"></i></div><svg class="flags" viewBox="0 0 400 55" preserveAspectRatio="none" aria-hidden="true"><path d="M0 3Q200 70 400 3" fill="none" stroke="#8e7758" stroke-width="2"/><path d="M30 12L62 21 41 41Z M244 31L276 25 264 49Z" fill="#bf8b6f"/><path d="M98 28L130 34 109 54Z M333 19L366 10 357 39Z" fill="#99aa83"/><path d="M173 36L206 36 189 55Z" fill="#cdb67c"/></svg><div class="room-sign">譲渡会</div>
<div class="visitor" aria-hidden="true"><svg viewBox="0 0 120 260"><path d="M53 126Q77 115 99 139L109 215H42Z" fill="#8e9d81"/><path d="M49 211L39 256H71L80 226 93 257H116L108 210" fill="#716953"/><path d="M55 80Q46 42 77 37Q113 36 110 77L104 108Q84 128 64 109Z" fill="#d9b591"/><path d="M52 91Q37 53 61 38Q91 20 111 48L114 80 99 66 87 50 68 69 59 66Z" fill="#78634d"/><path d="M67 87L74 86M92 86L99 87M76 104Q85 110 94 102" fill="none" stroke="#735f4c" stroke-width="2" stroke-linecap="round"/><g class="arm"><path d="M69 132L49 166 13 158" fill="none" stroke="#8e9d81" stroke-width="18" stroke-linecap="round"/><path d="M16 158L4 152" stroke="#d9b591" stroke-width="11" stroke-linecap="round"/></g></svg></div>
<svg class="table" viewBox="0 0 300 90" preserveAspectRatio="none" aria-hidden="true"><path d="M26 23L20 88M275 23L280 88" stroke="#927046" stroke-width="7" stroke-linecap="round"/><path d="M12 0H288L300 18H0Z" fill="#b58c55"/><path d="M2 18H298L289 67Q250 76 210 68Q150 75 97 68Q48 76 11 67Z" fill="#f4ecd2"/></svg>
<div class="cat-slot"><svg id="cat" viewBox="0 0 450 420" role="img" aria-label="耳カットをした保護ネコ、こむぎ"></svg></div><div class="whisper" id="whisper"></div><div class="seal">ひとつの命を、新しい家族へ<b>譲渡成立</b></div><div class="record-frame"></div></div>
<section class="panel" aria-live="polite"><div class="eyebrow" id="step"></div><h1 id="heading"></h1><p id="copy"></p><div class="actions"><button class="back" id="back" aria-label="前のシーンへ">←</button><button id="next"></button></div></section></div></main>
<script src="assets/cat-svg.js"></script><script>
const $=id=>document.getElementById(id);let index=0,route='adopted',timer=null,entered=performance.now();
const common=[
 ['最後の挑戦','この子の、これからへ。','守り、育ててきた日々。<br>家族と暮らす可能性を、ここで確かめよう。','譲渡会へ送り出す'],
 ['譲渡会・はじまり','こむぎ、おいで。','知らない人の声、いつもと違う気配。<br>ここからは、この子を見守ろう。','見守る'],
 ['譲渡会・ふれあい','差し出された手。','急がず、そっと待ってくれる人。<br>こむぎは、どうするだろう。','反応を待っています…'],
 ['譲渡会・こたえ','育ててきた日々が、ここに。','', '最後まで見届ける']
];
function pages(){return [...common,route==='adopted'?['活動の到達点','新しい家族ができました。','「この子と、一緒に暮らしたいです。」<br>こむぎに、帰るおうちができました。','こむぎを送り出す']:['活動の区切り','いつもの街へ、返そう。','今回は、ご縁にはつながりませんでした。<br>元いた場所へ返し、これからも見守ります。','こむぎを見送る'],route==='adopted'?['お別れ','いってらっしゃい、こむぎ。','振り返った、その顔を覚えておこう。<br>一緒に過ごした日々が、次へつながった。','活動の記録へ']:['見守りのはじまり','また、会いにくるよ。','住み慣れた街へ、一歩ずつ。<br>耳の小さな目印が、活動の証です。','活動の記録へ'],['活動の記録・こむぎ',route==='adopted'?'家族へつないだ命。':'守って、街へ返した命。',route==='adopted'?'空き地で保護 → 育成 → 譲渡成立<br>この子の姿を、譲渡の記録に残しました。':'空き地で保護 → 育成 → TNR<br>この子の姿を、見守りの記録に残しました。','もう一度、流れを見る']];}
function show(n){clearTimeout(timer);index=n;entered=performance.now();const page=pages()[index];$('step').textContent=page[0];$('heading').textContent=page[1];$('copy').innerHTML=page[2];$('next').textContent=page[3];$('next').disabled=index===2;$('back').hidden=index===0;$('back').disabled=index===2;
 const end=index>=4,outside=route==='tnr'&&index>=5;
 $('scene').className='scene'+(index>=1&&index<=5&&!outside?' has-visitor':'')+(end&&route==='adopted'?' success':'')+(outside?' tnr':'')+(index===6?' record':'');
 $('place').textContent=outside?'元いた街':index===6?'活動の記録':'譲渡会';
 $('whisper').textContent=index===1?'こんにちは、こむぎ。':index===2?'ここで、待っているね。':index===3?(route==='adopted'?'…来てくれた。':'大丈夫。無理しなくていいよ。'):index===4?'この子と、一緒に暮らしたいです。':'ありがとう。';
 if(index===3)$('copy').innerHTML=route==='adopted'?'少し迷ってから、自分で近づいた。<br>その手に、そっと頬を寄せる。':'気にはなる。でも、距離は縮まらない。<br>こむぎは、静かに周りを見ている。';
 if(index===2)timer=setTimeout(()=>show(3),3200);
}
$('next').onclick=()=>show(index===6?0:index+1);$('back').onclick=()=>show(Math.max(0,index-1));$('restart').onclick=()=>show(0);$('branch').onchange=e=>{route=e.target.value;show(0)};
const svg=$('cat'),dna={...CatSVG.defaults,body:'normal',headCoat:'tabby',bodyCoat:'tabby',legCoat:'tabby',tailCoat:'tabby',tail:'long',earCut:'left',seed:307};
svg.setAttribute('viewBox','200 55 320 320');svg.setAttribute('preserveAspectRatio','xMidYMax meet');
const rig=CatSVG.buildCat(svg,'flow',dna,375,1.25);svg.querySelector('.floor')?.remove();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(t){const time=reduced?0:t/1000;const pose='sit',model=CatSVG.poseModel(pose,time);if(index===3&&route==='adopted'){const approach=reduced?1:Math.min(1,(t-entered)/1800);model.hx+=38*approach;model.hy+=14*approach;model.hr=12*approach;model.bx+=10*approach;}else if(index===3){model.hr=-8;model.hx-=12;}CatSVG.applyPose(rig,model,time,pose);requestAnimationFrame(frame)}requestAnimationFrame(frame);show(0);
</script></body></html>
