<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ホゴネコ｜空と毛並みの質感</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5eedf;color:#564b3d;font:14px/1.4 'Yu Mincho',serif}main{height:100dvh;max-width:1000px;margin:auto;display:grid;grid-template-rows:44px minmax(130px,1fr) auto 24px;gap:8px;padding:0 12px}header{display:flex;align-items:center;justify-content:space-between}header a{display:grid;place-items:center;min-height:44px;color:inherit}h1{font-size:16px;margin:0}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}figure{margin:0;display:grid;grid-template-rows:28px minmax(0,1fr);min-width:0;min-height:0}figcaption{text-align:center}.scene{position:relative;background:#bbd1d0;min-height:0;isolation:isolate}.sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.cat{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}label{display:grid;gap:3px}select,button{min-width:0;width:100%;height:44px;font:inherit;background:#f9f3e5;border:1px solid #beab89;border-radius:6px;color:inherit;padding:4px 8px}.play{grid-column:1/-1}footer{font-size:12px;text-align:center}button{cursor:pointer}@media(min-width:700px){.settings{grid-template-columns:repeat(4,1fr)}.play{grid-column:auto}main{grid-template-rows:44px minmax(130px,1fr) auto 24px}.play{grid-column:1/-1}}
</style></head><body><main><header><h1>空と毛並みの質感</h1><a href="../../check.html">一覧へ</a></header><div class="comparison"><figure><figcaption>今の塗り</figcaption><div class="scene"><svg class="sky" viewBox="0 0 360 460" preserveAspectRatio="none"><path fill="#bacdcc" d="M0 0H360V460H0Z"/><path fill="#c9ba93" d="M0 385Q170 380 360 388V460H0Z"/></svg><svg id="plain" class="cat" viewBox="180 0 360 430"></svg></div></figure><figure><figcaption>質感を重ねる</figcaption><div class="scene"><svg id="sky" class="sky" viewBox="0 0 360 460" preserveAspectRatio="none"></svg><svg id="textured" class="cat" viewBox="180 0 360 430"></svg></div></figure></div><section class="settings" aria-label="比較設定"><label>ネコの色<select id="coat"><option value="cream">クリーム</option><option value="black">黒</option><option value="white">白</option><option value="tabby">キジ</option><option value="tortie">サビ</option><option value="calico">三毛</option></select></label><label>動き<select id="pose"><option value="sit">すわる</option><option value="walk">歩く</option><option value="jump">ジャンプ</option><option value="sleep">ねる</option></select></label><label>毛並みの濃さ<select id="fur"><option value="0">なし</option><option value=".35" selected>ひかえめ</option><option value=".65">しっかり</option><option value="1">強め</option></select></label><label>空の質感<select id="sky-strength"><option value="0">なし</option><option value=".45">ひかえめ</option><option value=".8" selected>しっかり</option></select></label><button id="pause" class="play" aria-pressed="false">動きを止める</button></section><footer>本編・セーブには反映しない比較試作</footer></main><script src="../../assets/cat-svg.js"></script><script src="texture-study.js"></script></body></html>
