<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ペットショップ C案・操作サンプル</title>
<style>
:root{--ink:#554936;--green:#637d56;--cream:#fff8e9;--gold:#c29342;--wood:#c4a16d;font-family:"BIZ UDPGothic","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:#45443e}*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #405e38;outline-offset:2px}button:disabled{cursor:default;opacity:.5}.preview{height:48px;max-width:440px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#fff7e6;font-size:12px}.preview small{color:#ddd3c1}.game{height:calc(100dvh - 48px);max-width:440px;margin:auto;background:#cbaa7b;display:flex;flex-direction:column;position:relative}.status{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--cream);font-size:13px}.balance{display:flex;align-items:center;gap:6px;font-weight:bold}.coin{display:inline-block;width:13px;height:13px;border:2px solid #ac7c2b;background:#efd582;border-radius:50%;vertical-align:-1px;flex:none}.hero{height:clamp(142px,24vh,208px);position:relative;flex:none}.scene{position:absolute;inset:0;pointer-events:none}.scene>svg{display:block;width:100%;height:100%}.exit{position:absolute;top:8px;left:10px;min-height:44px;border:1px solid #f9efd8;border-radius:9px;background:#65583f;color:#fffaf0;padding:8px 12px;font-size:13px;font-weight:bold;box-shadow:0 2px 0 #4d432c}.speech{position:absolute;left:12px;top:58px;margin:0;width:58%;height:36px;border-radius:16px;background:#e6d69c;color:#435b38;padding:10px 12px;font-size:12px;white-space:nowrap}.speech:after{content:"";position:absolute;right:-8px;top:15px;border-left:10px solid #e6d69c;border-bottom:7px solid transparent}.panel{margin:0 8px 10px;padding:10px 8px 8px;flex:1;min-height:0;background:var(--cream);border-radius:22px;display:flex;flex-direction:column;gap:8px;box-shadow:0 3px 0 #866b4d33}.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;flex:none}.tab{height:54px;min-width:0;border:0;border-radius:13px;background:#eee3ca;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.tab svg{width:28px;height:28px}.tab span{font-size:10px;height:12px;line-height:12px}.tab[aria-selected=true]{background:var(--green);color:#fff9ec}.tab:not([aria-selected=true]) span{visibility:hidden}.list{overflow-y:auto;min-height:0;flex:1;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#c4ae89 transparent;padding:2px 1px 8px}.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;position:relative;padding-bottom:6px;margin-bottom:10px}.shelf:after{content:"";height:6px;position:absolute;bottom:0;left:0;right:0;background:#c6a373;border-top:2px solid #dcc096;border-radius:2px;box-shadow:0 2px 1px #95744726}.product{display:block;position:relative;height:114px;padding:0;border:0;border-radius:0;background:transparent;text-align:left}.product:hover .info,.product:focus-visible .info{background:#f2edd7;border-color:#91a078}.product:active .info{background:#e0e8cf}.product:hover>.art,.product:active>.art{transform:translateY(-3px)}.product>.art{position:absolute;left:8px;bottom:0;width:68px;height:60px;z-index:2;transition:transform .15s}.product>.art svg{height:100%;width:100%;overflow:visible}.art{display:flex;align-items:center;justify-content:center}.art svg{display:block;width:100%;height:64px}.info{--bubble:#fffdf5;position:absolute;top:4px;left:22px;right:4px;height:92px;min-width:0;padding:8px;background:var(--bubble);border:1px solid #daccac;border-radius:14px;box-shadow:0 2px 0 #dfcfaf66;transition:background .15s,border-color .15s}.info:before{content:"";position:absolute;left:18px;bottom:-5px;width:8px;height:8px;background:inherit;border-right:1px solid #daccac;border-bottom:1px solid #daccac;transform:rotate(45deg)}.product .price{position:absolute;right:7px;bottom:8px;margin:0;padding-inline:5px}.product .owned{padding-inline:2px}.name{display:block;height:38px;line-height:19px;font-size:13px;font-weight:600;overflow-wrap:anywhere;letter-spacing:0}.price{display:inline-flex;align-items:center;gap:5px;margin-top:5px;padding:4px 7px;border-radius:7px;background:#f3e2b9;min-height:25px;font-size:13px;line-height:17px;font-weight:bold}.owned{background:#e0e6d2;color:#586b48;font-size:11px;padding-inline:5px}.footer{flex:none}.primary{border:0;border-radius:23px;min-height:46px;background:var(--green);color:#fffaf1;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-size:14px;font-weight:bold}.primary svg{width:21px;height:21px}.heading{height:44px;display:flex;align-items:center;gap:12px;flex:none;font-size:14px}.back{border:1px solid #deceb0;background:#eee3cb;border-radius:22px;min-height:44px;padding:8px 12px}.detail{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}.detail .art{width:110px;height:92px}.detail .art svg{height:100%}.detail h2{margin:0;font-size:17px;line-height:1.4}.detail p{margin:0;font-size:13px;line-height:1.6}.quantity{display:flex;align-items:center;gap:20px;margin:4px 0}.quantity button{width:44px;height:44px;border:1px solid #d6c6a6;border-radius:50%;background:#f6edd9;font-size:22px}.quantity output{min-width:24px;font-size:17px}.cart-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid #e0d1b5;font-size:13px}.cart-row .art{width:48px}.cart-row strong{flex:1}.empty{text-align:center;padding:22px 0;font-size:14px}.toast{position:absolute;inset:40px 0 auto;text-align:center;padding:12px;background:#f4e6bd;z-index:3;font-size:13px}.detail-type{color:#6d7858}.cart-heading-total{margin-left:auto}.close-sample{margin-top:15px}.full-message{padding:20px;flex:1;display:grid;place-content:center;text-align:center;gap:16px}.full-message p{font-size:14px;line-height:1.8;margin:0}
@media(min-width:360px){.product{height:122px}.product>.art{left:12px;width:88px;height:68px}.product .info{left:30px;height:100px}.art svg{height:72px}}
@media(max-height:640px){.detail{display:grid;grid-template-columns:80px minmax(0,1fr);align-content:center;justify-items:center;gap:6px}.detail .art{grid-row:1/3;width:75px;height:70px}.detail h2{font-size:16px}.detail .quantity{grid-column:1/-1;margin:0}.detail .description{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="preview"><span>C案 / 棚＋吹き出し値札</span><small>サンプル・保存なし</small></div>
<main class="game">
 <header class="status"><span>ペットショップ</span><span class="balance"><i class="coin"></i>33</span></header>
 <section class="hero" aria-label="店員とインコ、ウサギのいる店内"><div class="scene"></div><button class="exit" id="exit">← 街へ戻る</button><p class="speech" aria-live="polite"></p></section>
 <section class="panel" aria-label="お買い物"></section>
</main>
<script src="assets/storybook-art.js"></script>
<script>
const svg=body=>`<svg viewBox="0 0 100 100" aria-hidden="true">${body}</svg>`;
const drawings={
 box:svg('<path d="M12 29L65 20 88 32 87 78 17 85Z" fill="#b98751"/><path d="M12 29L65 20 88 32 36 40Z" fill="#d9bd87"/><path d="M65 20L88 32 87 78 66 81Z" fill="#aa7a4e"/><path d="M32 81V61Q46 40 61 60V79Z" fill="#45533d"/>'),
 blanket:svg('<path d="M10 32Q49 16 83 33L92 68Q47 91 14 71Z" fill="#c88467"/><path d="M20 36Q48 25 76 37L81 61Q45 78 23 63Z" fill="#ddbd88"/>'),
 plant:svg('<path d="M49 68L55 18" stroke="#688361" stroke-width="4"/><path d="M52 43Q13 41 25 18Q51 16 52 43M55 30Q65 3 84 20Q83 45 55 40" fill="#829872"/><path d="M29 63H74L67 88Q51 96 35 88Z" fill="#b4775d"/>'),
 shelf:svg('<path d="M10 37L80 26 94 36 24 48Z" fill="#c19665"/><path d="M24 48L94 36V46L24 58Z" fill="#a5774e"/><path d="M29 56L33 85H41L43 54M78 48L73 78H82L88 46" fill="#795d3e"/>'),
 food:svg('<path d="M25 18H75L71 30 81 85Q50 93 19 85L29 30Z" fill="#bc9660"/><path d="M29 18H72V27H29Z" fill="#766443"/><path d="M26 43H75V76H26Z" fill="#f2e6c9"/><path d="M38 65L35 49 45 55 56 55 66 49 64 66Q51 77 38 65" fill="#83916a"/>'),
 roller:svg('<rect x="11" y="52" width="68" height="27" rx="8" fill="#a6b18c"/><path d="M79 65H89V43H55V16" fill="none" stroke="#657758" stroke-width="5"/><rect x="46" y="6" width="18" height="30" rx="6" fill="#6b805a"/>'),
 comb:svg('<path d="M16 20Q48 9 84 20V39H16Z" fill="#899978"/><path d="M20 39V83M30 39V83M40 39V83M50 39V83M60 39V83M70 39V83M80 39V83" stroke="#899978" stroke-width="5"/>'),
 wipe:svg('<path d="M10 39L67 24 91 41 83 77 19 84Z" fill="#a9b7a1"/><path d="M10 39L67 24 91 41 33 57Z" fill="#dce5ce"/><ellipse cx="53" cy="41" rx="18" ry="8" fill="#829476"/><path d="M44 41L39 11 62 16 67 39Z" fill="#fff9e9"/>')};
const SB=window.StorybookArt, placed=key=>SB.placed.find(p=>p.art===key).svg;
const products=[
 ['box','段ボール',3,'furniture',drawings.box,'かくれが',true],['blanket','毛布',5,'furniture',drawings.blanket,'ふれあい'],
 ['scratch','ばりばり巻き玉',5,'furniture',placed('scratch'),'つめとぎ'],['plant','観葉植物',6,'furniture',drawings.plant,'ひなた'],
 ['tower','のぼって小枝タワー',12,'furniture',placed('tower'),'たかいところ'],['shelf','窓下の棚',10,'furniture',drawings.shelf,'たかいところ'],
 ['bench','となりの遊びベンチ',8,'furniture',placed('bench'),'いっしょ'],['tunnel','くぐり布トンネル',8,'furniture',placed('tunnel'),'かくれが'],
 ['sunstep','ひだまり窓辺ステップ',10,'furniture',placed('sunstep'),'ひなた'],['scentrail','香りのころころ棚',8,'furniture',placed('scentrail'),'におい'],
 ...SB.hand.slice(0,10).map(p=>[p.art,p.name,6,'play',p.svg,'おもちゃ']),
 ['dry','いつものカリカリ',4,'food',drawings.food,'ごはん'],['wet','ウェットフード',5,'food',drawings.food,'におい'],['fish','お魚ごはん',6,'food',SB.hand.find(p=>p.art==='fish').svg,'えもの'],
 ['roller','コロコロ',4,'care',drawings.roller,'床のおそうじ'],['wipefloor','おそうじシート',5,'care',drawings.wipe,'床のおそうじ'],
 ['comb','コーム',4,'tools',drawings.comb,'毛のお手入れ'],['wipe','ウェット',4,'tools',drawings.wipe,'からだ拭き']
].map(([id,name,price,category,art,type,owned])=>({id,name,price,category,art,type,owned}));
const tabs=[['furniture','置くもの',drawings.box],['play','おもちゃ',SB.hand.find(p=>p.art==='feather').svg],['food','ごはん',drawings.food],['care','そうじ',drawings.roller],['tools','どうぐ',drawings.comb]];
const cartIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 3H5L8 16H20L22 7H6M8 19H20"/><circle cx="9" cy="22" r="1"/><circle cx="19" cy="22" r="1"/></svg>';
let tab='furniture',view='list',selected=null,quantity=1,cart={},timer,scroll=0;
const panel=document.querySelector('.panel'),coin='<i class="coin" aria-hidden="true"></i>';
const template=document.createElement('template');template.innerHTML=SB.scenes.petshop_spring;
const scene=template.content.querySelector('svg');scene.setAttribute('viewBox','0 200 450 305');scene.setAttribute('preserveAspectRatio','xMidYMin slice');
scene.querySelectorAll('.register text').forEach(t=>{const x=t.getAttribute('x'),y=t.getAttribute('y');t.textContent='';const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x||'0');c.setAttribute('cy',Number(y)-4);c.setAttribute('r','6');c.setAttribute('fill','#efd582');c.setAttribute('stroke','#a57b35');c.setAttribute('stroke-width','2');t.after(c)});
document.querySelector('.scene').append(scene);
function speak(text){clearInterval(timer);const el=document.querySelector('.speech');el.textContent='';if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=text;return}let i=0;timer=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(timer)},65)}
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0),total=()=>products.reduce((s,p)=>s+p.price*(cart[p.id]||0),0);
const heading=title=>`<header class="heading"><button class="back" data-do="back">← もどる</button><strong>${title}</strong></header>`;
function render(){
 if(view==='list'){
 const list=products.filter(p=>p.category===tab);let shelves='';for(let i=0;i<list.length;i+=2)shelves+=`<div class="shelf">${list.slice(i,i+2).map(p=>`<button class="product" data-product="${p.id}" aria-label="${p.name}、${p.owned?'所持済み':p.price+'コイン'}、詳細を見る"><span class="art">${p.art}</span><span class="info"><span class="name">${p.name}</span><span class="price ${p.owned?'owned':''}">${p.owned?'所持済み':coin+p.price}</span></span></button>`).join('')}</div>`;
 panel.innerHTML=`<nav class="tabs" aria-label="商品カテゴリ" role="tablist">${tabs.map(([id,label,art])=>`<button class="tab" role="tab" aria-label="${label}" title="${label}" aria-selected="${id===tab}" data-tab="${id}">${art}<span>${label}</span></button>`).join('')}</nav><div class="list">${shelves}</div><footer class="footer"><button class="primary" data-do="cart">${cartIcon}カートを見る${count()?`（${count()}）`:''}</button></footer>`;panel.querySelector('.list').scrollTop=scroll;
 }else if(view==='detail'){
 panel.innerHTML=heading('商品を見る')+`<div class="detail"><div class="art">${selected.art}</div><h2>${selected.name}</h2><p class="detail-type">${coin} ${selected.price} · ${selected.type}</p><p class="description">${selected.category==='furniture'?'ネコのお気に入りの場所に。':'毎日のお世話に。'}</p><div class="quantity"><button data-do="minus" aria-label="個数を減らす" ${quantity===1?'disabled':''}>−</button><output>${quantity}</output><button data-do="plus" aria-label="個数を増やす" ${selected.category==='furniture'||quantity===99?'disabled':''}>＋</button></div></div><footer class="footer"><button class="primary" data-do="add" ${selected.owned?'disabled':''}>${selected.owned?'所持済みです':'カートに入れる'}</button></footer>`;
 }else if(view==='cart')panel.innerHTML=heading('カートを見る')+`<div class="list">${products.filter(p=>cart[p.id]).map(p=>`<div class="cart-row"><span class="art">${p.art}</span><strong>${p.name}<br><span class="price">${coin}${p.price*cart[p.id]}</span></strong><span>×${cart[p.id]}</span><button class="back" data-remove="${p.id}" aria-label="${p.name}をカートから外す">−</button></div>`).join('')||'<p class="empty">カートは空です。</p>'}</div><footer class="footer"><button class="primary" data-do="confirm" ${count()?'':'disabled'}>購入の確認へ　${coin}${total()}</button></footer>`;
 else if(view==='confirm')panel.innerHTML=heading('購入の確認')+`<div class="full-message"><h2>${count()}点で ${total()}コイン</h2><p>このサンプルでは実際に購入されません。<br>ゲームの所持品・コインは変わりません。</p></div><footer class="footer"><button class="primary" data-do="finish">サンプルの会計を終える</button></footer>`;
 else panel.innerHTML=`<div class="full-message"><h2>${view==='exit'?'ここから街へ戻ります':'アリガト！ マタネ！'}</h2><p>本体に影響しない操作サンプルです。</p><button class="primary" data-do="back">ショップに戻る</button></div>`;
 // Fit visible artwork to the shelf, excluding whitespace in original SVG canvases.
 panel.querySelectorAll('.product>.art svg').forEach(s=>{const b=s.getBBox();if(b.width&&b.height){s.setAttribute('viewBox',`${b.x-2} ${b.y-2} ${b.width+4} ${b.height+2}`);s.setAttribute('preserveAspectRatio','xMidYMax meet')}});
}
panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.tab){tab=b.dataset.tab;scroll=0;view='list';render();speak({furniture:'ネコノ バショ！ エランデ！',play:'アソボ！ アソボ！',food:'ゴハン！ オイシイヨ！',care:'キレイ、キレイ！',tools:'ヤサシク、ソーットネ！'}[tab]);return}
 if(b.dataset.product){scroll=panel.querySelector('.list').scrollTop;selected=products.find(p=>p.id===b.dataset.product);quantity=1;view='detail';render();speak(selected.owned?'ソレ、モッテル！':'ソレ、イイネ！');return}
 if(b.dataset.remove){delete cart[b.dataset.remove];render();return}
 const action=b.dataset.do;
 if(action==='back'){view=view==='confirm'?'cart':'list';render();speak('ユックリ、ミテネ！')}
 if(action==='plus'||action==='minus'){quantity=Math.max(1,Math.min(99,quantity+(action==='plus'?1:-1)));render()}
 if(action==='add'){cart[selected.id]=selected.category==='furniture'?1:(cart[selected.id]||0)+quantity;view='list';render();speak('カート、イレタヨ！')}
 if(action==='cart'){scroll=panel.querySelector('.list')?.scrollTop||0;view='cart';render();speak('ワスレモノ、ナイ？')}
 if(action==='confirm'){view='confirm';render();speak('コレ、カウ？ イイ？')}
 if(action==='finish'){cart={};view='thanks';render();speak('アリガト！ マタネ！')}
});
document.querySelector('#exit').onclick=()=>{view='exit';render();speak('マタ、キテネ！')};
render();speak('イイモノ、アルヨ！');
</script>
</html>
